version: "1.0"
repository: VerdifyConsultancy/verdify-skills
owners: [jvallery, jrvallery]
phases:
  pre-release:
    description: Candidate-side delivery-policy bootstraps PR 189 while main still runs 1.2.1 policy.
    branches:
      dev:
        required_status_checks:
          strict: true
          contexts: [validate, pull-request-policy, compliance / compliance, critic-gate]
        enforce_admins: true
        required_pull_request_reviews:
          dismiss_stale_reviews: false
          require_code_owner_reviews: false
          required_approving_review_count: 0
          require_last_push_approval: false
        restrictions: null
        required_conversation_resolution: true
        allow_force_pushes: false
        allow_deletions: false
      main:
        required_status_checks:
          strict: true
          contexts: [validate, compliance / compliance, delivery-policy, critic-gate]
        enforce_admins: true
        required_pull_request_reviews:
          dismiss_stale_reviews: true
          require_code_owner_reviews: true
          required_approving_review_count: 1
          require_last_push_approval: false
        restrictions: null
        required_conversation_resolution: true
        allow_force_pushes: false
        allow_deletions: false
  steady-state:
    description: Main now trusts 1.3.0 base policy and additionally requires pull-request-policy.
    branches:
      dev:
        required_status_checks:
          strict: true
          contexts: [validate, pull-request-policy, compliance / compliance, critic-gate]
        enforce_admins: true
        required_pull_request_reviews:
          dismiss_stale_reviews: false
          require_code_owner_reviews: false
          required_approving_review_count: 0
          require_last_push_approval: false
        restrictions: null
        required_conversation_resolution: true
        allow_force_pushes: false
        allow_deletions: false
      main:
        required_status_checks:
          strict: true
          contexts: [validate, pull-request-policy, compliance / compliance, delivery-policy, critic-gate]
        enforce_admins: true
        required_pull_request_reviews:
          dismiss_stale_reviews: true
          require_code_owner_reviews: true
          required_approving_review_count: 1
          require_last_push_approval: false
        restrictions: null
        required_conversation_resolution: true
        allow_force_pushes: false
        allow_deletions: false
bootstrap_notes:
  - Pre-release main cannot derive effective ownership from candidate CODEOWNERS because current main has placeholders.
  - Pre-release identity is enforced by critic-gate plus one required approval; steady-state also has effective main CODEOWNERS.
  - Dev push and manual runs discover exactly one open same-repo dev-to-main PR at their SHA and execute the real route and review gates; rerun the same failed run after real approval.
  - Workflow review approval remains disabled and is never part of apply payloads.
