integration_risks:
  - >-
    The report commit S must have E as its sole parent and change only this
    canonical critic report; S must then be the exact PR and remote branch head.
    Any later commit invalidates this review and requires a rebuilt evidence
    chain and fresh criticism.
  - >-
    PR metadata must record Implementation=I, Evidence=E, and Current=S before
    exact-S pull-request-policy, delivery-policy, validate, compliance, and
    critic-gate results can be treated as current. Red checks must not be merged.
  - >-
    This critic report is not the distinct commit-bound GitHub approval required
    from a repository admin or maintainer other than the PR author before
    integration, and it does not authorize merge or release.
residual_risks:
  - >-
    The managed contract reaches main only through a later intentional generated
    dev-to-main release after this lane integrates to dev; this report does not
    claim that promotion or default-branch availability.
  - >-
    This lane deliberately validates the release route without publishing npm,
    creating a tag or GitHub release, or deploying. End-to-end trusted
    publication and runtime proof remain outside this lane.
