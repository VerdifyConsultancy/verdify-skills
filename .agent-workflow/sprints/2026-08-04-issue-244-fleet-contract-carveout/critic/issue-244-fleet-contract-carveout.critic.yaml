integration_risks:
  - >-
    The trusted policy engine is checked out from the pull request BASE
    (.github/workflows/delivery-gate.yml and policy.yml both run
    trusted-policy/scripts/*.rb from base.sha), so this carve-out has no effect
    on any pull request until it is merged to dev. The first real exercise of
    the route will therefore be its first production use; there is no staging
    rehearsal available inside this repository.
  - >-
    Merging with FIND-002 open means dev carries a documented policy route that
    cannot succeed. A future operator who applies the label without reading the
    pull request body will see critic-gate fail with an approval error that is
    accurate in wording but misleading in cause.
  - >-
    The label verdify:fleet-contract-sync can be applied by any collaborator
    with triage rights. Verified live: collaborators are jvallery, jrvallery and
    evallery (all push+triage+admin). evallery can apply the label but is not in
    allowed_release_approvers, so a labelled pull request still cannot satisfy
    the owner-approval requirement -- the label alone confers nothing.
residual_risks:
  - >-
    Span content and .agent-fleet/ci.yaml command content remain unvalidated by
    the mechanical proof (FIND-003); the human owner approval and CODEOWNERS are
    the only checks on what the managed surface actually says.
  - >-
    The managed sentinel block can be relocated within AGENTS.md/CLAUDE.md while
    the check reports confined (FIND-001), because outside-span comparison is
    concatenation equality rather than a positional or pairwise comparison.
  - >-
    MANIFEST.sha256 is shape-checked but not tree-bound by this carve-out
    (FIND-004); correctness depends on `make manifest-check` remaining inside
    the required `validate` context.
  - >-
    The route's one-human property depends entirely on critic-gate remaining a
    required status check on dev, since pull-request-policy enforces no review
    requirement (FIND-005).
  - >-
    Not verified by this review: the behaviour of the route once the
    delivery-gate.yml review-wiring patch lands, because that patch is not
    present at this head and could not be exercised. The Ruby-side approval
    logic was verified only through its unit tests and by reading
    owner_approval_errors, not against live GitHub review payloads on the dev
    route.
