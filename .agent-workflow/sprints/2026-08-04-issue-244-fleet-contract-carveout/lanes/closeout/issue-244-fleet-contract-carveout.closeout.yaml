    purely this check). BLOCKING finding: adding the managed paths to
    .github/CODEOWNERS does not itself require a human review before merge
    on dev (required_approving_review_count: 0 means require_code_owner_
    reviews only auto-requests an owner, proven from this repo's own merge
    history -- PRs #213/#230/#222 merged into dev touching CODEOWNERS-
    protected paths with reviews: [] / zero reviews). Fixed by requiring a
    current-head APPROVED review from a non-author allowed owner for the
    fleet-contract-sync route on dev, reusing exactly what delivery-gate.rb
    already requires for the dev -> main release route (shared
    owner_approval_errors helper). This makes the route one-human (a
    review), not zero-human -- it still skips the lane-contract/
    critic-report ceremony, just not the review itself. Also fixed
    (non-blocking): an invalid UTF-8 byte sequence in a *path* (not just
    file content) raised an uncaught ArgumentError in changed_paths before
    any guard could run; fixed by forcing the raw diff output to ASCII-8BIT
    before splitting on NUL.
  - >-
    5f19ba2 (Jason Vallery, workflow-scoped credential) applied the P4
    labeled/unlabeled trigger-type fix directly to
    .github/workflows/delivery-gate.yml, since this worker's OAuth token
    lacks the workflow scope. The remaining half of the workflow patch --
    wiring the review-history fetch and --reviews flag for the dev
    fleet-contract-sync route so owner_approval_errors actually receives
    review data in live CI -- is still prepared but not committed by this
    worker for the same credential reason; see the PR body for the exact
    diff. Until it lands, the Ruby-side fix fails closed (no reviews.json is
    ever fetched or passed for this route, so the approval requirement can
    never be satisfied) -- safe, but the route does not yet work end-to-end
    in live CI.
  - >-
    Scope note: this lane's contract (dispatched at f8e9097) declared
    .github/workflows/** as a prohibited path and did not list
    .github/CODEOWNERS or scripts/validate-repo.rb as owned. The fix
    required touching CODEOWNERS and the validator that asserts its exact
    content, and .github/workflows/delivery-gate.yml is now also touched --
    by the maintainer directly (5f19ba2), not by this worker. Ownership/
    prohibited-path declarations are not mechanically cross-checked against
    the real diff by this repo's tooling (confirmed: only owned/prohibited
    non-overlap is validated), so this is disclosed here rather than left
    unrecorded; the dispatch commit was left unamended (its exact SHA is
    what both critic rounds reviewed, and amending it would require a
    history rewrite of an already-reviewed, already-pushed PR).
  - >-
    tests/test_package_file_set.sh fails on this macOS worker (archive.paths
    ordering); verified pre-existing by stashing this lane's changes and
    re-running against unmodified origin/dev with the identical failure. Not
    caused by this change; the validate GitHub Actions context runs on a
    Linux runner where this script has historically passed (see #234).
  - >-
    critic-gate for this lane's own pull request (#245) requires an
    independent critic report, which this worker cannot supply (the schema
    and delivery-gate.rb both require critic_agent/critic_session_id to
    differ from worker_agent/worker_session_id). The pull request is
    therefore not merge-ready until a distinct critic reviews it; this is
    the intended behavior of the gate this lane is modifying, not a defect.
  - >-
    scripts/verify-package.sh:27 has a related line.strip.split(...)/
