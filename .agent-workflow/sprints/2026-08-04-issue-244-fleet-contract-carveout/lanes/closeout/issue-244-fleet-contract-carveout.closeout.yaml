residual_risks:
  - >-
    An independent critic reviewed the first version of this lane (head
    a7f8c3d) and REJECTED it with a proven P0 bypass (git diff --name-status
    parsed with line.strip.split("\t") silently drops a trailing space Git
    does not quote, so a brand-new "AGENTS.md " file was misread as the real
    AGENTS.md and both gates returned exit 0) plus three lower-severity
    findings (mode/type changes at a managed path were entirely unchecked;
    an invalid-UTF-8 byte sequence raised instead of failing closed on
    purpose; delivery-gate.yml did not re-run critic-gate on label changes).
    P0, P2 (mode/type), and P3 (invalid UTF-8) are fixed at this head
    (fbb231c); the critic's own 35-case attack harness was re-run against
    the fix and every previously-bypassed mechanical case (trailing/leading
    -space path, chmod, symlink, gitlink, manifest binary/malformed
    content) is now rejected.
  - >-
    P4 (add labeled/unlabeled to .github/workflows/delivery-gate.yml's
    pull_request trigger types, so applying the label re-runs critic-gate
    the way the PR body describes) is prepared as a standalone patch but
    NOT applied to this branch: this worker's git credential is an OAuth
    token without the `workflow` scope, and GitHub rejects any push that
    creates or updates a `.github/workflows/*.yml` file without it
    ("refusing to allow an OAuth App to create or update workflow
    .github/workflows/delivery-gate.yml without workflow scope"). The
    one-line diff (adding `, labeled, unlabeled` to the existing types
    list) needs a maintainer with workflow-scoped push access, or manual
    application via the GitHub web UI, before merge. Until then, applying
    verdify:fleet-contract-sync to an already-open PR requires an edit or
    push to re-trigger critic-gate, not the label event alone.
  - >-
    The independent critic also found that .agent-fleet/ci.yaml's only
    provenance check was an author-typed "# GENERATED by..." comment -- no
    real signature or digest ties it to the actual jvallery/agents central
    render, and the sentinel span content in AGENTS.md/CLAUDE.md is
    similarly unchecked by design (the class doc always said this proves
    *where* a labelled PR writes, never *what*). That cannot be fixed
    mechanically without a cross-repo signature scheme, which is out of
    scope for this repo-side lane. Mitigated instead by adding
    /AGENTS.md, /CLAUDE.md, /.agent-fleet/**, and /MANIFEST.sha256 to
    .github/CODEOWNERS: a codeowner (jvallery or jrvallery) review is now
    the human check on content, so this route is never zero-review, even
    though it no longer requires the full lane/contract/critic ceremony.
  - >-
    Scope note: this lane's contract (dispatched at f8e9097) declared
    .github/workflows/** as a prohibited path and did not list
    .github/CODEOWNERS or scripts/validate-repo.rb as owned. The P1/P4 fix
    required touching CODEOWNERS and the validator that asserts its exact
    content; the workflow file itself was NOT touched in the end (see the
    P4 risk above), so .github/workflows/** stayed prohibited in practice.
    Ownership/prohibited-path declarations are not mechanically cross-
    checked against the real diff by this repo's tooling (confirmed: only
    owned/prohibited non-overlap is validated), so this is disclosed here
    rather than left unrecorded; the dispatch commit was left unamended
    (its exact SHA is what the critic reviewed and rejected, and amending
    it would require a history rewrite of an already-reviewed,
    already-pushed PR).
  - >-
    tests/test_package_file_set.sh fails on this macOS worker (archive.paths
    ordering); verified pre-existing by stashing this lane's changes and
    re-running against unmodified origin/dev with the identical failure. Not
    caused by this change; the validate GitHub Actions context runs on a
    Linux runner where this script has historically passed (see #234).
  - >-
    critic-gate for this lane's own pull request (#245) requires an
    independent critic report, which this worker cannot supply (the schema
    and delivery-gate.rb both require critic_agent/critic_session_id to
    differ from worker_agent/worker_session_id). The pull request is
    therefore not merge-ready until a distinct critic reviews it; this is
    the intended behavior of the gate this lane is modifying, not a defect.
  - >-
    scripts/verify-package.sh:27 has the same line.strip.split(...) parsing
    defect the P0 fix addresses here, in the release-package zipinfo
    verifier rather than the confinement check. Filed separately as #246
    per the critic's explicit request not to fold it into this lane.
