findings:
  - id: FIND-001
    severity: high
    statement: >-
      The publication transaction does not retain the built and consumer-tested
      candidate across workflow attempts. Every publish run packs again, and the
      release ZIP is nondeterministic, so a retry after npm or GitHub release
      mutation can no longer prove or reuse the original release asset set.
    evidence:
      - ".github/workflows/publish-npm.yml:43-54 always runs build-release-candidate before reconciliation, and lines 84-130 publish or upload only the newly rebuilt paths; there is no pinned upload/download-artifact step, prior-run lookup, or explicit artifact retention."
      - "scripts/build-release-candidate.sh:34-43 rewrites package.json gitHead to the current source SHA before npm pack; the worker's I tarball SHA-256 was d618f6f8c0144aef8f08fb387d0d54790ab8edf166cd49521908bc240ad14db1, while the independently built E tarball SHA-256 was 24825b00debebb967784867455e7117823fa711bc3b8e042d8e0bcdc1a600a82. The eventual main head will therefore produce different bytes from the I artifact that supplied worker evidence."
      - "A controlled pair of clean E builds produced the same tarball digest 24825b00debebb967784867455e7117823fa711bc3b8e042d8e0bcdc1a600a82 but different ZIP digests 59df652e370485bd9f4ae1acf388d770aae3f768638a13d83d623a3d3b78712f and b57e2d119946d67735727b497dee16b3020df3fa4d0a2af7a09493bc38424131. scripts/package.sh:19-27 stages files with current timestamps and archives them without timestamp normalization."
      - ".github/workflows/publish-npm.yml runs structural candidate verification but never invokes the exact-tarball install, reinstall, public-1.2.1 upgrade, Node 18, collision, or rollback matrix on the tarball passed to npm publish. A failed-job recovery therefore cannot satisfy the one-pack proof or exact-published-bytes consumer evidence."
    requested_action: >-
      Split candidate construction/testing from privileged publication, persist one
      digest-bound candidate bundle with explicit retention, and make every resume
      retrieve that bundle rather than repack. Make the ZIP reproducible, run the
      complete consumer matrix on the exact tarball later passed to npm publish, and
      add a cross-attempt fixture covering failures after npm publication and after
      partial GitHub release asset upload.
  - id: FIND-002
    severity: high
    statement: >-
      Pack rollback deletes operator-owned targets when backup fails before every
      target has been moved, because cleanup removes the entire changed-target set
      but restores only the subset already recorded in backups.
    evidence:
      - "lib/verdify/cli.rb:2492-2500 records a backup only after FileUtils.mv succeeds; lines 2525-2533 then remove every changed target on any exception and restore only recorded backups."
      - "An independent fault-injection probe failed the second FileUtils.mv. The first operator target was restored, but the not-yet-backed-up second target and the pre-existing operator manifest were both deleted: first_restored=true, second_preserved=false, manifest_preserved=false."
      - "tests/test_cli.sh and tests/test_npm_install.sh exercise conflict preflight and a failure after backups and link creation, but do not inject first, middle, or last backup/write failures that occur before rollback ownership is fully recorded."
    requested_action: >-
      Never remove an existing target unless its backup is durably recorded. Stage
      and validate the complete backup plan before target mutation, track created and
      replaced paths separately, make rollback itself fail safely, and add injected
      first, middle, last, manifest, and restore failure tests that assert all
      operator bytes and types remain intact.
  - id: FIND-003
    severity: high
    statement: >-
      Release reconciliation accepts a sidecar whose recorded archive identity does
      not match the exact archive, then writes the false identity into a schema-valid
      ledger and authorizes npm publication.
    evidence:
      - "scripts/release-transaction.rb:79-89 verifies the archive and checksum against the actual ZIP but never compares the ZIP size or SHA-256 to sidecar.archive; lines 220-222 copy the unverified sidecar values into the ledger."
      - "An independent live-read-only probe changed sidecar.archive.sha256 to 64 zeroes and sidecar.archive.size to 1 while leaving the valid ZIP in place. Reconciliation returned state=artifact_verified, next_action=publish_npm, errors=[], and recorded the all-zero archive digest instead of the actual a91f996f9ce3ecd5076d4e6258c83d7eaf27014e5187304c619366484f152527."
      - "scripts/verify-npm-tarball.rb:75-89 similarly validates only the format of package_file_list_blob and does not compare the sidecar npm_shasum with the exact tarball, leaving other recorded candidate identities self-asserted."
    requested_action: >-
      Validate every sidecar identity against exact local bytes and the clean source
      before querying authorities: archive size/SHA-256/checksum filename and digest,
      tarball SHA-1 shasum, package-file-list blob at the source commit, package
      identity, and source commit. Add one mismatch fixture for every ledger field and
      require each to fail closed with no publish action.
  - id: FIND-004
    severity: medium
    statement: >-
      Release-PR automation prevents published or unbumped versions but can create a
      duplicate issue and PR for an unpublished version whose prior candidate issue
      or dev-to-main PR was closed.
    evidence:
      - ".github/workflows/release-pr.yml:70-77 searches only open issues and only the first 100 results; lines 122-129 search only open dev-to-main PRs. Neither query reconciles a closed candidate before lines 79-86 and 131-135 create new objects."
      - "tests/test_release_preflight.sh:104-110 checks that npm preflight precedes mutation but has no open/closed issue or PR state matrix."
      - "Live read-only GitHub evidence shows repeated closed dev-to-main candidates for the same 1.2.1 version, including PRs 177, 180, and 183, demonstrating that closed-candidate duplication is an active repository failure mode."
    requested_action: >-
      Reconcile open, closed, and merged candidate issues and PRs by durable version
      identity before mutation. Reuse or deterministically stop on the existing
      candidate, avoid bounded top-100 title scans as identity authority, and add a
      mocked workflow matrix for open, closed-unmerged, merged, and conflicting
      candidate states.
  - id: FIND-005
    severity: medium
    statement: >-
      The checked-in upgrade and minimum-runtime regressions are too shallow to prove
      the claimed real 1.2.1 upgrade and Node 18 command compatibility on future
      changes.
    evidence:
      - "tests/test_npm_install.sh:65-79 constructs a one-skill local directory with only package.json and one SKILL.md instead of installing and initializing the published 1.2.1 artifact."
      - "tests/test_npm_install.sh:148-155 exercises only --version under Node 18; all installed package verification, init, pack, collision, and rollback commands run under the host Node version."
      - "Independent critic probes did pass an actual npm @verdify-cli/cli@1.2.1 init followed by the E tarball's forced 1.3.0 upgrade, and passed Node 18 init plus pack list against the E tarball. Those observations establish current behavior but do not provide the required durable regression coverage."
    requested_action: >-
      Replace the synthetic upgrade tree with a digest-pinned faithful 1.2.1 package
      fixture or controlled public-tarball install and run its real init before
      upgrade. Run installed verification plus substantive init/pack commands and at
      least one failure/rollback case under Node 18.
