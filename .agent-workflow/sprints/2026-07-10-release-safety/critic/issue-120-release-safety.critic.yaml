      - "Cross-attempt recovery repacks instead of retrieving one candidate, repeated ZIPs are nondeterministic, and a false sidecar archive digest is accepted and copied to the ledger with publish_npm as the next action."
  - criterion_id: LANE-AC-06
    assessment: not_satisfied
    evidence:
      - "Both workflows use official full commit SHAs for checkout/setup-node/setup-ruby, npm is pinned to 11.4.2, and OIDC plus --provenance are preserved."
      - "There is no explicitly retained candidate upload, and release-PR reconciliation ignores closed candidate issues and PRs, allowing duplicate objects for the same unpublished version."
  - criterion_id: LANE-AC-07
    assessment: not_satisfied
    evidence:
      - "All required local suites and gitleaks passed independently at E, and current E validate, pull-request-policy, and compliance checks pass."
      - "The high artifact-identity/recovery and operator-state-loss findings block an exact-head approval despite green deterministic checks."
