findings:
  - id: FIND-001
    severity: high
    statement: >-
      Release-candidate pull request reconciliation trusts the public body marker
      without requiring the matching pull request to be the repository-owned
      dev-to-main route. A wrong-route or foreign-fork pull request can therefore
      be reused, reopened, or treated as the already-merged release candidate.
    evidence:
      - ".github/workflows/release-pr.yml:77-89 reduces every pull request to number, state, merged_at, body, base.ref, and head.ref; it discards base.repo.full_name and head.repo.full_name before reconciliation."
      - "scripts/release-preflight.rb:110-144 selects matching_pulls by marker alone, computes route_pulls only for conflicting open candidates, and then chooses the first marker match without checking its route or repository ownership."
      - "An independent live-registry/read-only fixture supplied the current @verdify-cli/cli@1.3.0 marker on three non-authoritative pulls. An open dev-to-feature pull returned decision=create/pull_request_action=reuse, a foreign-fork dev-to-main pull returned decision=create/pull_request_action=reuse, and a merged dev-to-feature pull returned decision=skip/reason=candidate_already_merged. No GitHub mutation was performed."
      - "tests/test_release_preflight.sh:65-117 covers open, closed-unmerged, merged, and one combined conflict fixture only with base=main/head=dev; it has no wrong-route, foreign-head-repository, foreign-base-repository, or independently conflicting-PR case."
    requested_action: >-
      Preserve base and head repository ownership in the candidate snapshot and
      authorize reuse, reopen, or merged-stop only for the exact
      VerdifyConsultancy/verdify-skills:dev to
      VerdifyConsultancy/verdify-skills:main route. Treat same-marker pulls on any
      other route or repository, ambiguous/multiple markers, and independent issue
      or PR conflicts as fail-closed identity conflicts before issue or PR mutation;
      add open, closed-unmerged, merged, conflict, wrong-route, and foreign-fork
      fixtures for each relevant state.
  - id: FIND-002
    severity: medium
    statement: >-
      The retained candidate is not durably bound to the GitHub Actions artifact
      digest or to a digest of candidate-provenance.json, and the completed release
      ledger/assets omit the artifact run, artifact ID, artifact digest, and
      provenance digest. The release cannot later prove which exact tested Actions
      bundle supplied publication after the 90-day artifact expires.
    evidence:
      - ".github/workflows/publish-npm.yml:21-24 exports artifact ID, run ID, and bundle name but not actions/upload-artifact's artifact-digest; lines 103-110 discard each artifact API digest while selecting a retry candidate."
      - ".github/workflows/publish-npm.yml:136-152 computes candidate file digests before candidate-provenance.json exists, so the provenance document has no externally checked digest. Lines 221-246 then verify only identities and digests asserted inside that same downloaded document."
      - "The pinned actions/download-artifact d3f86a106a0bac45b974a628896c90dbdf5c8093 passes the API digest as expectedHash but treats digestMismatch as core.warning at src/download-artifact.ts:172-197; this workflow has no later comparison against an expected artifact digest."
      - ".github/workflows/publish-npm.yml:298-323 uploads the tarball, sidecar, ZIP, checksum, and completed ledger but not candidate-provenance.json. scripts/release-transaction.rb:251-281 and schemas/release-transaction.schema.yaml:25-84 contain no workflow run, run attempt, artifact ID/name/digest, or candidate-provenance digest field."
      - "Independent unavailable and expired artifact fixtures after a matching published npm authority both failed before pack with one npm read and zero candidate bytes, so the no-repack recovery guard itself is fixed; this finding is the missing durable digest binding, not the recovery decision."
    requested_action: >-
      Capture and fail closed on the exact Actions artifact digest for fresh and
      reused candidates, hash candidate-provenance.json outside its self-described
      file map, and carry repository, workflow path, source SHA, original run and
      attempt, artifact ID/name/digest, provenance digest, and sidecar digest into
      the release transaction. Publish the provenance document or an equivalent
      immutable binding as a verified release asset and add tamper fixtures that
      independently mutate the artifact and provenance digests.
