findings:
  - id: FIND-001
    severity: high
    statement: A later CHANGES_REQUESTED review from a different reviewer does not invalidate an earlier recorded reviewer approval, so route evaluation can authorize integration despite a later effective change request.
    evidence:
      - lib/verdify/lane_review_validator.rb:159-176 filters submitted_reviews to expected_reviewer_login before selecting the latest effective review.
      - docs/decisions/ADR-0017-lane-review-evidence-chain.md:38-43 requires live verification to reject a later effective change-request.
      - skills/independent-critic/SKILL.md states that any later change-request review invalidates approval until the chain is rebuilt and re-reviewed.
      - An independent Ruby probe supplied APPROVED by reviewer-a at 00:04 and CHANGES_REQUESTED by reviewer-b at 00:05 for the same report head; validate_submission returned valid=true with no errors.
      - tests/test_lane_review_validator.rb:208-230 covers reversal only when both reviews come from the same reviewer and has no cross-reviewer regression case.
    requested_action: Evaluate the latest effective review state across the pull request, reject a later CHANGES_REQUESTED review regardless of reviewer identity, and add a two-reviewer adversarial regression test before rebuilding I, E, and critic review.
