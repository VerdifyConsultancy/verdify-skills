schema_ref: lane-contract.schema.yaml
kind: LaneContract
schema_version: "1.0"
sprint_id: 2026-07-10-npm-oidc-recovery
lane_id: issue-207-npm-oidc-cli
title: Pin an OIDC-capable npm CLI for trusted publishing
status: approved
issue_ids: [207]
coupling_justification: null
objective: Ensure both npm publication jobs use the same exact reviewed npm 11 CLI that satisfies trusted-publishing authentication requirements.
desired_outcome: Candidate and privileged publish jobs install npm 11.15.0, and regression tests reject drift below the official npm 11.5.1 minimum.
non_goals:
  - Change the release-PR workflow npm pin, Node version, package version, package contents, provenance, release transaction, or rollback behavior.
  - Mutate main, npm, tags, releases, branch protection, credentials, or retained artifacts from the worker.
baseline_sha: "b5c106c3ee62f8530f85a00b4576c8e28cbfb92c"
branch: lane/207-npm-oidc-cli
module_contracts: [release-package, quality-enablement]
worktree_policy:
  one_coding_session_per_worktree: true
  lock_required: true
lease_policy:
  worker_ttl_hours: 8
  critic_ttl_hours: 4
runtime_namespace:
  strategy: derived_at_dispatch
ownership:
  domains: [release-package, quality-enablement]
  owned_paths:
    - .github/workflows/publish-npm.yml
    - MANIFEST.sha256
    - tests/test_packed_artifact.sh
    - .agent-workflow/sprints/2026-07-10-npm-oidc-recovery/sprint-plan.yaml
    - .agent-workflow/sprints/2026-07-10-npm-oidc-recovery/release/wave-release-plan.yaml
    - .agent-workflow/sprints/2026-07-10-npm-oidc-recovery/lanes/contracts/issue-207-npm-oidc-cli.contract.yaml
    - .agent-workflow/sprints/2026-07-10-npm-oidc-recovery/lanes/closeout/issue-207-npm-oidc-cli.closeout.yaml
  prohibited_paths:
    - VERSION
    - package.json
    - CHANGELOG.md
    - .github/workflows/release-pr.yml
    - .github/workflows/delivery-gate.yml
    - .github/workflows/delivery-policy.yml
    - scripts/build-release-candidate.sh
    - scripts/release-transaction.rb
    - scripts/release-preflight.rb
    - schemas/**
    - skills/**
    - packs/**
  coordination_required_paths: []
  owned_interfaces:
    - Exact npm CLI bootstrap used by candidate and privileged publish jobs.
dependencies:
  hard:
    - lane_id: issue-204-publish-tarball
      required_output: Privileged tarball path recovery is integrated to dev and the later OIDC publish failure remains safely pre-mutation.
  soft: []
acceptance_criteria:
  - id: LANE-AC-01
    statement: publish-npm.yml contains exactly two identical npm 11.15.0 global-install pins, one in each publish job.
    sprint_acceptance_ids: [SPR-AC-01]
    evidence_required: [workflow diff, exact pin count, identical pin values]
  - id: LANE-AC-02
    statement: The packed-artifact regression parses publish-npm.yml, enforces exact 11.15.0 pins at or above Gem::Version 11.5.1, and preserves the latest and next prohibition.
    sprint_acceptance_ids: [SPR-AC-01, SPR-AC-02]
    evidence_required: [packed artifact suite, semantic version assertion, deterministic pin assertion]
  - id: LANE-AC-03
    statement: Repository validation and secret scanning pass while npm 1.3.0, tag v1.3.0, and release v1.3.0 remain absent.
    sprint_acceptance_ids: [SPR-AC-02, SPR-AC-03]
    evidence_required: [repository validation, actionlint, full suite, gitleaks, registry tag and release queries]
validation_commands:
  - id: repository-validation
    command: ruby scripts/validate-repo.rb
    purpose: Validate repository and manifest shape.
    required: true
  - id: publish-workflow-actionlint
    command: actionlint .github/workflows/publish-npm.yml
    purpose: Validate the changed GitHub Actions workflow.
    required: true
  - id: packed-artifact-suite
    command: bash tests/test_packed_artifact.sh
    purpose: Prove exact identical OIDC-capable npm pins and preserve packed candidate behavior.
    required: true
  - id: full-suite
    command: make test
    purpose: Run every repository, package, delivery, and release regression.
    required: true
  - id: secret-scan
    command: gitleaks git --no-banner --redact --log-opts="b5c106c3ee62f8530f85a00b4576c8e28cbfb92c..HEAD"
    purpose: Scan every lane commit.
    required: true
required_evidence:
  - Failed publish run 29092480672 job 86361021802 and OIDC CLI root-cause evidence.
  - Official npm trusted-publishing minimum at https://docs.npmjs.com/trusted-publishers/.
  - Exact two-pin assertion and semantic version floor regression.
  - Full packed artifact and repository test results at I.
  - npm, tag, and GitHub release absence immediately before closeout.
  - Closeout-only E and fresh report-only S with current GitHub checks.
git_policy:
  pull_request_required: true
  github_checks_required: true
  self_merge_allowed: false
  clean_worktree_required: true
escalation_conditions:
  - The fix requires changing the release-PR workflow, Node version, package contents, release transaction, provenance, credentials, or any prohibited path.
  - Any npm, tag, release, or retained artifact authority appears before controller recovery.
definition_of_done:
  - D contains only the approved sprint plan, wave plan, and lane contract.
  - I changes only publish-npm.yml, the packed-artifact regression, and manifest.
  - E adds only the canonical closeout and a fresh critic commits only S.
  - Exact S receives a commit-bound non-author maintainer APPROVED review and passes protected dev checks before integration.
  - ROOT separately repromotes, approves, publishes, verifies, and records the recovered release.
approval:
  status: approved
  approver: Jason Vallery
  approved_at: "2026-07-10T12:28:43Z"
