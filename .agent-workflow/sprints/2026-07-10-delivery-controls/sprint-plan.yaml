---
schema_ref: sprint-plan.schema.yaml
kind: SprintPlan
schema_version: '1.0'
sprint_id: 2026-07-10-delivery-controls
status: complete
goal: Enforce protected dev integration and reviewed release-only main promotion in
  code and live GitHub state without publishing version 1.3.0 from the worker lane.
baseline_sha: 91828dd4f0b632a2833a3d4f62cf4f92c1e35901
github:
  repository: VerdifyConsultancy/verdify-skills
  milestone:
  project:
issue_ids:
- 121
scope:
- Replace placeholder CODEOWNERS with effective Jason and James ownership.
- Enforce ordinary pull requests to dev and reserve main for the exact same-repository
  dev-to-main release route.
- Add a current-head transport-neutral critic check for dev implementation pull requests.
- Require a real current-head non-author release-owner approval for main promotion.
- Add a candidate-side delivery-policy check that can bootstrap the open 1.3.0 release
  while main still contains 1.2.1 policy code.
- Add idempotent dry-run, apply, and verify tooling for pre-release and steady-state
  branch protection.
- Reconcile lifecycle documentation and routing so machine critic status replaces
  impossible author approval on dev without weakening release approval.
non_goals:
- 'Merge PR #189, publish npm, push v1.3.0, create the GitHub release, or complete
  the release ledger from the worker.'
- Change North Star lock authority, npm credentials, npm environment reviewers, or
  external Agent Platform behavior.
- Implement deferred route-transition, vacuous-evidence, eval-runner, historian-digest,
  or platform-loop issues.
- Apply live branch protection from the worker worktree; ROOT applies it only after
  reviewed code reaches dev.
acceptance_criteria:
- id: SPR-AC-01
  statement: Ordinary repository pull requests target dev, while only the exact same-repository
    dev-to-main release route may target main.
  lane_ids:
  - issue-121-delivery-controls
  evidence_expected:
  - allowed and denied route matrix
  - fork rejection
  - marker validation
  - policy workflow check
- id: SPR-AC-02
  statement: A dev pull request passes critic-gate only when its current head is a
    valid report-only S commit with independent worker and critic identity and an
    approving critic outcome.
  lane_ids:
  - issue-121-delivery-controls
  evidence_expected:
  - valid D/I/E/S fixture
  - stale head rejection
  - self-critic rejection
  - missing or non-approving report rejection
- id: SPR-AC-03
  statement: A main release pull request passes critic-gate only with a current-head
    APPROVED review by jvallery or jrvallery who is not the pull request author.
  lane_ids:
  - issue-121-delivery-controls
  evidence_expected:
  - review history matrix
  - stale approval rejection
  - author rejection
  - unapproved workflow-token boundary
- id: SPR-AC-04
  statement: 'Pre-release main protection uses candidate-side delivery-policy for
    PR #189, and steady-state protection restores trusted pull-request-policy after
    1.3.0 reaches main.'
  lane_ids:
  - issue-121-delivery-controls
  evidence_expected:
  - phase-specific desired-state fixtures
  - dry-run diff
  - idempotent second apply
  - bootstrap check workflow
- id: SPR-AC-05
  statement: Dev and main protections require pull requests, strict current checks,
    conversation resolution, admin enforcement, no force push, no deletion, and phase-appropriate
    review and CODEOWNERS rules.
  lane_ids:
  - issue-121-delivery-controls
  evidence_expected:
  - branch API request fixtures
  - live pre-release GET verification
  - steady-state desired state
- id: SPR-AC-06
  statement: Full repository validation, focused delivery tests, workflow linting,
    secret scanning, and required GitHub checks pass on exact implementation and critic
    heads.
  lane_ids:
  - issue-121-delivery-controls
  evidence_expected:
  - make test
  - focused tests
  - actionlint
  - gitleaks
  - check URLs
  - clean worktree
risks:
- id: RISK-01
  severity: critical
  statement: Incorrect branch protection can lock out all integration or allow unreviewed
    main promotion.
  mitigation: Use phase-specific declarative desired state, dry-run first, idempotent
    apply, immediate GET verification, and a tested rollback snapshot.
- id: RISK-02
  severity: high
  statement: 'Main''s current 1.2.1 policy cannot certify PR #189, creating a bootstrap
    deadlock.'
  mitigation: Require a distinct candidate-side delivery-policy check pre-release
    and restore pull-request-policy in steady state after 1.3.0 is on main.
- id: RISK-03
  severity: high
  statement: A stale critic report or stale human review could satisfy a protection
    check after the pull request changes.
  mitigation: Bind both gates to the live 40-character head SHA and fail every later
    commit until rerun or reapproval.
- id: RISK-04
  severity: high
  statement: Workflow identity could be mistaken for human release approval.
  mitigation: Read GitHub review history, require an allowed owner login distinct
    from author, and never enable workflow review approval.
lanes:
- lane_id: issue-121-delivery-controls
  issue_ids:
  - 121
  contract_path: ".agent-workflow/sprints/2026-07-10-delivery-controls/lanes/contracts/issue-121-delivery-controls.contract.yaml"
  branch: lane/121-delivery-controls
  owner: delivery-controls-worker
  reviewer: fresh-independent-critic
  summary: Implement and test repository policy, critic/release checks, CODEOWNERS,
    declarative branch rules, and lifecycle reconciliation without live mutation.
dependency_order:
- - issue-121-delivery-controls
deployment_expectations:
- The worker makes no live GitHub branch-protection, main, npm, tag, release, environment,
  or credential mutation.
- After fresh criticism and the bootstrap admin exception, ROOT integrates the lane
  to dev, applies pre-release rules, and verifies live GET state.
- 'PR #189 remains open until Jason supplies a genuine current-head approval and every
  pre-release required check passes.'
- After verified 1.3.0 promotion, ROOT applies steady-state main protection and separately
  verifies npm, tag, release assets, and the completed ledger.
review_plan:
  qa_milestones:
  - id: QA-01
    name: Route and critic identity matrix
    due: before worker closeout
    evidence_expected:
    - Ordinary, release, fork, stale-head, self-critic, non-approving, author-review,
      and stale-review fixtures fail or pass exactly as specified.
  - id: QA-02
    name: Declarative live-control simulation
    due: before critic review
    evidence_expected:
    - Pre-release and steady-state dry-run payloads are exact, idempotent, reversible,
      and verified against API response fixtures.
  - id: QA-03
    name: Live pre-release rule reconciliation
    due: after dev integration
    evidence_expected:
    - 'Live dev and main protection GETs equal the approved pre-release configuration
      and PR #189 reports all required contexts.'
  human_review_milestones:
  - id: HR-01
    name: Independent delivery-control implementation review
    owner: Fresh critic plus user-authorized bootstrap integration controller
    trigger: Exact D/I/E/S chain and current checks pass.
    review_packet_path: ".agent-workflow/sprints/2026-07-10-delivery-controls/review/review-inbox-packet.yaml"
  - id: HR-02
    name: Final version 1.3.0 release approval
    owner: 'Jason Vallery as non-author reviewer of James-authored PR #189'
    trigger: 'Issue #121 is integrated and live pre-release rules plus current checks
      cover the final dev head.'
    review_packet_path: ".agent-workflow/sprints/2026-07-10-delivery-controls/review/release-approval-packet.yaml"
  user_stories_for_review:
  - id: US-01
    statement: As a maintainer, I can prove ordinary code reaches protected dev only
      after current-head criticism and main advances only through a real owner-approved
      release.
    issue_ids:
    - 121
    lane_ids:
    - issue-121-delivery-controls
    acceptance_refs:
    - SPR-AC-01
    - SPR-AC-02
    - SPR-AC-03
    - SPR-AC-04
    - SPR-AC-05
    - SPR-AC-06
  reporting_summary:
    included:
    - 'Issue #121 CODEOWNERS, route policy, critic and release review checks, bootstrap
      delivery policy, declarative branch protection, tests, docs, and live pre-release
      reconciliation.'
    deferred:
    - 'Final PR #189 approval/merge, npm/tag/GitHub release verification, steady-state
      post-release apply, and rescue cleanup.'
    - Deferred quality, historian, platform, Orbit, and Gravity work.
    ownership:
    - lane_id: issue-121-delivery-controls
      owner: delivery-controls-worker
      responsibility: Implement and prove delivery controls without mutating live
        branch rules or release authorities.
    next_review: 'Fresh critic on the exact lane chain, then controller bootstrap
      integration and live pre-release rule verification before Jason reviews PR #189.'
approval:
  status: approved
  approver: Jason Vallery
  approved_at: '2026-07-10T09:38:46Z'
