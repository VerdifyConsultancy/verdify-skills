integration_risks:
  - >-
    Merging PR #196 would install a dev rule whose independent-critic signal can
    be supplied by the candidate it is meant to constrain. This defeats the
    lane objective and can transitively admit malicious workflow changes to dev
    before dev is promoted to main.
  - >-
    The final report-only S head will make validate, policy, and delivery jobs
    rerun, but critic-gate must remain non-approving because this report outcome
    is request_fixes. Passing unrelated checks must not override the report.
  - >-
    Dev and main live branch protection still differ from both desired phases.
    Applying either payload before FIND-001 is corrected would convert an
    acknowledged forgeable context into a protected-branch requirement without
    creating trustworthy authorization.
residual_risks:
  - >-
    Organization-required workflow rules are unavailable on the current GitHub
    plan. The fix therefore needs a separately controlled check producer, an
    account-plan change, or an explicit human-review compensating control; the
    critic does not choose or authorize that protected design decision.
  - >-
    Snapshot rollback normalizes protection documents to the fields owned by
    this tool. The independently tested and live current configurations fit
    that model, but a controller should inspect future unmodeled GitHub
    protection fields before applying or rolling back.
