integration_risks:
  - >-
    PR #196 itself bootstraps the effective CODEOWNERS file while current dev is
    unprotected and its base CODEOWNERS contains placeholders. Before integration
    it still requires a real current-head approval from jrvallery, the allowed
    non-author owner, plus the controller's recorded bootstrap exception; this
    critic report is not that GitHub approval.
  - >-
    The report-only S2 commit must become the exact PR head and rerun validate,
    pull-request-policy, compliance, delivery-policy, and critic-gate. Any later
    commit invalidates the evidence chain and owner approval.
  - >-
    Declarative pre-release controls are not live. A separately authorized
    controller must snapshot, apply, and verify both branches after reviewed dev
    integration, then apply steady-state controls only after the 1.3.0 release.
  - >-
    PR #189 must remain unmerged until Jason supplies its separate real
    current-head approval and release verification owns final promotion.
residual_risks:
  - >-
    GitHub Free provides no immutable organization-required workflow here, so
    future protected control-plane changes depend on the selective human
    code-owner gate in addition to exact-head critic status.
  - >-
    A pre-release dev-push delivery-gate failure may need rerunning after the
    real PR #189 approval because candidate-only pull_request_review discovery is
    unavailable on the non-PR event path.
  - >-
    Snapshot rollback intentionally normalizes the modeled branch-protection
    fields. Expanded restriction objects preserve their user/team/app identities,
    but a controller should inspect future unmodeled GitHub protection fields
    before apply or rollback.
