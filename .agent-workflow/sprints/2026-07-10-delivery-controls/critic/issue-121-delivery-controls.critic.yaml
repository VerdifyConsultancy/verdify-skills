findings:
  - id: FIND-001
    severity: high
    statement: >-
      The required delivery-policy and critic-gate contexts are emitted by a
      pull-request candidate-controlled workflow, so a candidate can redefine
      the jobs and report success without running the protected-base policy or
      critic validators. Requiring those context names therefore does not
      enforce independent critic approval or release approval.
    evidence:
      - >-
        Live PR #196 Actions runs 29086576157 and 29086529103 executed
        .github/workflows/delivery-gate.yml at candidate head
        4d566a0cfdb768f04face50301037f030a03b0bf and emitted the
        delivery-policy and critic-gate jobs. The workflow file is added by PR
        #196 and is absent from its base SHA
        0f3ca61fcae4362bd90cd19f0986806ed5a79d0f, current dev before this
        lane, and main. This is direct live proof that the candidate supplied
        the required-context job definition.
      - >-
        .github/workflows/delivery-gate.yml:64-143 places the protected-base
        checkout and engine selection inside the same candidate-supplied
        critic-gate job. A candidate can replace or omit those steps while
        preserving the critic-gate job name; delivery-policy at lines 18-62 is
        likewise entirely candidate-defined.
      - >-
        config/github-delivery-controls.yaml:8-21 requires the plain
        critic-gate context on dev while setting required approvals to zero.
        The live branch-protection API also represents required checks as
        context/app pairs rather than binding them to this workflow revision;
        GitHub Actions jobs from a modified candidate workflow use the same
        GitHub Actions app identity.
      - >-
        VerdifyConsultancy reports GitHub plan free, and the live organization
        rulesets API returns HTTP 403 with Upgrade to GitHub Team to enable this
        feature. An organization-required immutable workflow is therefore not
        an available compensating control in the current environment.
      - >-
        scripts/validate-repo.rb:600-610 checks tokens, read permissions,
        bootstrap text, and immutable action pins but has no adversarial
        assertion that required contexts are produced by authority outside the
        candidate. All local tests pass despite the live candidate-provenance
        counterexample.
    requested_action: >-
      Replace the candidate-defined required contexts with an authority the
      candidate cannot modify, such as a separately controlled GitHub App/check
      producer or an available required-workflow mechanism. Until that exists,
      require a real current-head non-author owner approval as a compensating
      dev control for workflow/control-plane changes. Add an adversarial test
      proving a PR that rewrites delivery-gate.yml to no-op cannot satisfy the
      protected dev or main rules. Re-run the full D/I/E/S review after the fix.
