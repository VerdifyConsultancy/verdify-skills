---
schema_ref: lane-contract.schema.yaml
kind: LaneContract
schema_version: '1.0'
sprint_id: 2026-07-10-issue-215-receipt-ci-auth
lane_id: issue-215-receipt-ci-auth
title: Authenticated bounded GitHub evidence reads for terminal receipts
status: approved
issue_ids: [215]
coupling_justification: null
objective: Authenticate the exact policy steps that validate terminal-receipt GitHub evidence, bound workflow-run metadata reads, and preserve fail-closed check identity.
desired_outcome: Valid multi-receipt evidence passes GitHub Actions using the job token and least-privilege reads, while invalid, ambiguous, unauthenticated, or rate-limited evidence fails clearly without token exposure or anonymous fallback.
non_goals:
- Add a GitHub write permission, personal token, credential copy, or persisted token.
- Remove live evidence or weaken highest-check-ID, workflow, event, app, head, conclusion, base, or protected-path validation.
- Refactor unrelated GitHub operations or implement issue 70 risk classes and lightweight critic routing.
- Modify package version, publish npm, promote main, or change application runtime.
baseline_sha: fbe821899caf546e9b7b8daa718ea2ec74918091
branch: lane/215-receipt-ci-auth
module_contracts: [governance-routing, execution-control, lane-assurance, release-package]
worktree_policy:
  one_coding_session_per_worktree: true
  lock_required: true
lease_policy:
  worker_ttl_hours: 24
  critic_ttl_hours: 8
runtime_namespace:
  strategy: derived_at_dispatch
ownership:
  domains: [github-evidence-authentication, receipt-policy-ci, check-run-identity, api-failure-diagnostics]
  owned_paths:
