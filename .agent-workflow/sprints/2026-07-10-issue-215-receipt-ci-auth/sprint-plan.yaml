    acceptance_refs:
    - SPR-AC-01
    - SPR-AC-02
    - SPR-AC-03
    - SPR-AC-04
    - SPR-AC-05
  reporting_summary:
    included:
    - least-privilege workflow token scopes
    - bounded check and workflow evidence reads
    - fail-closed authenticated API errors
    - six-receipt and policy regressions
    deferred:
    - general change classes and lightweight critic-gate routing in issue 70
    - provider authentication or GitHub client replacement
    - package release or cross-project work
    ownership:
    - lane_id: issue-215-receipt-ci-auth
      owner: codex-issue215-worker
      responsibility: Implement and validate the bounded GitHub evidence authentication
        repair.
    next_review: One fresh critic at exact evidence head, then protected-dev integration
