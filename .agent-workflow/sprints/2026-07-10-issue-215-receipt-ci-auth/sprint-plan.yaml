    - authenticated failure behavior
    - highest-check selection
    - request-count bound
  - id: QA-02
    name: Full repository and policy gate
    due: at implementation head
    evidence_expected:
    - validate-repo
    - make test
    - actionlint
    - manifest check
    - redacted secret scan
  human_review_milestones:
  - id: HR-01
    name: One independent implementation criticism
    owner: Fresh critic
    trigger: Exact implementation and closeout heads pass every required local validation.
    review_packet_path: ".agent-workflow/sprints/2026-07-10-issue-215-receipt-ci-auth/review/review-inbox-packet.yaml"
  - id: HR-02
    name: Preauthorized protected-path integration exception
    owner: Jason Vallery
    trigger: Use only if exact approving S has green CI and GitHub still cannot satisfy
      non-author CODEOWNERS review with an available identity.
    review_packet_path: ".agent-workflow/sprints/2026-07-10-issue-215-receipt-ci-auth/gates/protected-path-merge-exception.yaml"
  user_stories_for_review:
  - id: US-01
    statement: As ROOT, I can terminalize completed sprints through authenticated
      CI without valid evidence failing at the anonymous GitHub API ceiling.
    issue_ids:
    - 215
