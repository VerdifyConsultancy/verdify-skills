integration_risks:
  - >-
    This approving report is not a GitHub review or merge authorization. The
    exact S3 head must pass validate, pull-request-policy, delivery-policy,
    compliance, and critic-gate after the controller updates required PR head
    metadata.
  - >-
    Because I3 modifies CODEOWNERS-protected workflows and validator policy, a
    current non-author code-owner approval and an allowed owner update to
    protected dev remain mandatory before integration.
  - >-
    Merge does not authorize main promotion, npm publication, GitHub release,
    branch-protection mutation, deployment, or any credential expansion.
