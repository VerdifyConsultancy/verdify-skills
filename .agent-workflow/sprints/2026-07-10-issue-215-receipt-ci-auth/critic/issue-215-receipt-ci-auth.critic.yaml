integration_risks:
  - >-
    PR 217 must not integrate while candidate-controlled code can receive or
    recover the job token, while authenticated resource diagnostics can echo
    token material, or while malformed fractional IDs can satisfy trusted check
    identity.
  - >-
    A fix worker must create a new implementation and closeout chain, followed
    by a fresh independent critic. This report-only S is durable request-fixes
    evidence and is not an approval or merge authorization.
residual_risks:
  - >-
    The job token is read-only, which limits but does not remove the impact of
    exposing private repository contents, checks, workflow-run metadata, or
    actions resources to candidate-controlled code during the job.
  - >-
    Whole-repository actionlint retains the approved baseline-only SC2012
    exception; any new diagnostic in policy.yml or delivery-gate.yml remains
    blocking.
  - >-
    A normal post-integration terminal receipt with green authenticated policy,
    delivery, and critic checks remains required after a corrected lane merges.
