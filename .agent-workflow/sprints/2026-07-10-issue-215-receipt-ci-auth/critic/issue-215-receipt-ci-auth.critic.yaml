acceptance_assessment:
  - criterion_id: LANE-AC-01
    assessment: satisfied
    evidence:
      - >-
        policy.yml and delivery-gate.yml declare exactly read-only actions,
        checks, contents, and pull-request permissions. The three receipt
        validation steps receive github.token only through step-scoped GH_TOKEN,
        no write scope exists, and all six checkout invocations explicitly set
        persist-credentials: false.
      - >-
        PR jobs are filtered and job-gated before their first step to exact
        same-repository dev or main bases. Each token-bearing script repeats the
        repository/ref guard before assigning a trusted-policy engine; no PR
        branch can assign a candidate engine. Non-PR jobs and discovery steps
        require exact github.ref refs/heads/dev before gh or candidate code.
  - criterion_id: LANE-AC-02
    assessment: satisfied
    evidence:
      - >-
        github_check_run_evidence retains every matching required check,
        performs no hydration when any per-name ID set is malformed or
        duplicate, selects only the unique highest valid check per name, and
        deduplicates shared workflow-run IDs. The five-run per-lane bound and
        48-read six-receipt ceiling remain fail closed.
      - >-
        Focused highest-ID, full-set retention, shared-run, and request-ledger
        tests passed. A live authenticated PR 213 probe retained 11 matching
        checks and hydrated five selected checks through four shared runs using
        five total API reads.
  - criterion_id: LANE-AC-03
    assessment: satisfied
    evidence:
      - >-
        Loader and validator share parse_positive_check_id and reject
        fractional Float/String, leading-zero, explicit-plus, zero, negative,
        nil, boolean, array, object, malformed, and duplicate IDs without
        hydration. Positive Integer and canonical decimal String IDs remain
        valid.
      - >-
        Required workflow path, pull-request event, exact head SHA, GitHub
        Actions app, completed status, successful conclusion, and unique
        highest-ID checks are unchanged and passed against live PR 213 data.
  - criterion_id: LANE-AC-04
    assessment: satisfied
    evidence:
      - >-
        With GH_TOKEN present, status failure, CLI absence, and invalid JSON
        never invoke curl. Resource/path, message, rate, reset, resource, and
        request-ID fields are control-character stripped, exact-token redacted,
        and bounded to 256 characters; arbitrary headers and stderr text are not
        copied into diagnostics.
  - criterion_id: LANE-AC-05
    assessment: satisfied
    evidence:
      - >-
        Without GH_TOKEN, the compatibility tests still attempt gh then the
        existing bounded anonymous curl read, and failure of both paths raises
        CommandError rather than accepting absent evidence.
  - criterion_id: LANE-AC-06
    assessment: satisfied
    evidence:
      - >-
        The six-receipt equivalent remains at 42 reads: 12 pull-request, six
        check-list, and 24 deduplicated workflow-run requests, below the 48-read
        ceiling. Both protected policy entrypoint suites, the full suite, and
        the authenticated live evidence probe passed.
  - criterion_id: LANE-AC-07
    assessment: satisfied
    evidence:
      - >-
        Independent focused receipt, PR-policy, delivery-gate, repository,
        manifest, changed-workflow actionlint, gitleaks, diff, and full-suite
        validation passed at E3. The live exact-E3 validate and compliance
        checks pass; policy and critic checks fail only because the preserved S2
        report still binds I2/E2 and requests fixes, as required before this
        report-only S3.
