findings:
  - id: FIND-004
    severity: high
    statement: >-
      Token-bearing validation still treats every pull-request base SHA as a
      protected policy source and uses a short ref-name check for non-PR dev
      execution, so unprotected refs can still supply code that receives
      GH_TOKEN.
    evidence:
      - >-
        .github/workflows/policy.yml:3-4 has no protected-base branch filter or
        job guard, while lines 14-21 check out github.event.pull_request.base.sha
        as trusted-policy and lines 34-42 execute it with GH_TOKEN. A pull
        request targeting an unprotected repository branch therefore executes
        that branch's policy code with the token before policy validation can
        reject the route.
      - >-
        .github/workflows/delivery-gate.yml:4-7 likewise accepts pull_request and
        pull_request_review events for any base. Lines 22-30 and 87-95 check out
        the event base SHA, while the token-scoped engine selection at lines
        73-80 and 156-168 depends only on the event-name prefix and never proves
        base.ref is dev or main.
      - >-
        The non-PR token paths at delivery-gate.yml:43-82 and 108-171 check only
        github.ref_name == dev. GitHub's official workflow-dispatch API contract
        permits ref to be either a branch or tag, so the short name does not
        prove refs/heads/dev; the workflow contains no exact full-ref guard.
      - >-
        An independent parsed-workflow audit reported no pull_request branch
        filter in either workflow, no pull_request_review branch filter, and no
        refs/heads/dev guard. scripts/validate-repo.rb:621-656 verifies engine
        ordering and persisted-credential settings but does not reject these
        unprotected base/ref cases.
    requested_action: >-
      Gate every token-bearing PR job before checkout or execution to the exact
      allowed protected base refs, and require the exact full refs/heads/dev
      identity before any non-PR candidate code runs. Add validator and
      adversarial workflow regressions for a PR targeting an unprotected base,
      pull_request_review on that base, workflow_dispatch on a non-dev branch,
      and workflow_dispatch on a tag whose short name is dev.
acceptance_assessment:
  - criterion_id: LANE-AC-01
    assessment: not_satisfied
    evidence:
      - >-
        The workflows retain exactly actions, checks, contents, and
        pull-requests read permissions; all six checkout invocations now set
        persist-credentials: false; policy.yml has no candidate-engine fallback;
        and the live PR 217 delivery jobs executed protected dev policy code.
        FIND-004 nevertheless shows that the same token steps are not restricted
        to protected base/full-ref identities.
  - criterion_id: LANE-AC-02
    assessment: satisfied
    evidence:
      - >-
        The loader retains every matching required check, selects only a unique
        highest valid ID per name, hydrates only selected checks, deduplicates
        shared runs, and enforces the five-workflow-run per-lane bound. Focused
        tests and the authenticated live PR 213 probe passed.
  - criterion_id: LANE-AC-03
    assessment: satisfied
    evidence:
      - >-
        Loader and validator now share parse_positive_check_id. Committed tests
        reject fractional floats and strings, leading-zero and explicit-plus
        forms, malformed and duplicate sets without hydration. An independent
        12-value matrix also rejected zero, negative, nil, boolean, array, and
        object IDs while preserving positive Integer and canonical decimal
        String handling.
      - >-
        Workflow path, pull-request event, exact head SHA, GitHub Actions app,
        completion, success, and uniquely highest check-ID validation remain
        unchanged and passed against live PR 213 evidence.
  - criterion_id: LANE-AC-04
    assessment: satisfied
    evidence:
      - >-
        Every explicit authenticated failure branch now passes resource/path
        text through the same control-character stripping, exact-token
        redaction, and 256-character bound. Status failure, CLI-unavailable, and
        invalid-JSON regressions prove no curl fallback, token or arbitrary
        header disclosure; an independent adversarial fixture reproduced the
        same result at the maximum bound.
  - criterion_id: LANE-AC-05
    assessment: satisfied
    evidence:
      - >-
        The no-GH_TOKEN compatibility tests still use gh then bounded anonymous
        curl and raise CommandError when both fail, preserving fail-closed public
        read behavior.
  - criterion_id: LANE-AC-06
    assessment: satisfied
    evidence:
      - >-
        The six-receipt regression remains at 42 reads: 12 pull-request, six
        check-list, and 24 deduplicated workflow-run requests, below the 48-read
        ceiling. Both local policy entrypoint suites and the exact-I2 validate
        workflow passed; a live PR 213 check probe used five reads and validated
        all trusted checks.
  - criterion_id: LANE-AC-07
    assessment: not_satisfied
    evidence:
      - >-
        Independent focused, repository, workflow, manifest, secret-scan, and
        full-suite validation passed at E2, but FIND-004 leaves the credential
        trust boundary incomplete and this request_fixes S2 cannot produce an
        approving critic gate.
