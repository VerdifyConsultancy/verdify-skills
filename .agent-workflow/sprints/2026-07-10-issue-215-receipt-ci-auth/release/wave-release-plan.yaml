risks:
- id: RISK-01
  severity: high
  statement: A job token or response metadata could leak through diagnostics.
  mitigation: Keep the token step-scoped, never persist it, and allowlist diagnostic fields with explicit redaction tests.
- id: RISK-02
  severity: high
  statement: Optimizing API reads could weaken trusted check selection.
  mitigation: Validate the complete matching check set first, then hydrate only unique highest IDs and retain every negative identity test.
- id: RISK-03
  severity: medium
  statement: Protected workflow paths cannot receive an ordinary self-authored CODEOWNERS approval.
  mitigation: Require exact-head critic and CI evidence, use only the recorded one-PR admin exception if needed, and restore and verify every protection immediately.
