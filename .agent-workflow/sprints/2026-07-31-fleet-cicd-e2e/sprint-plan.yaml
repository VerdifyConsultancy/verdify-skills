scope:
- Add the directive-mandated CI/CD section to root AGENTS.md outside the managed
  Agent Fleet sentinel.
- Document the rotating exact-repository GitHub App authentication boundary, local
  validation commands, scheduler rejection semantics, repository delivery disposition,
  durability evidence, and destructive-action gate.
- Replace every explicit ubuntu-latest runner assignment with validation-standard
  while preserving workflow triggers, permissions, jobs, and release behavior.
- Regenerate the package manifest and run the complete local suite.
- Push the lane through broker Git authentication, open the issue-backed pull request,
  and prove that the pushed head executes on a live validation-standard ARC runner.
- Record literal probes, UTC timestamps, conclusions, the no-build disposition, and
  a re-probe at least ten minutes after the initial green observation.
non_goals:
- Change package behavior, version, npm release semantics, workflow permissions, or
  required-check names.
- Add a PAT, print a token, configure repository-local credentials, or broaden cross-repository
  access.
- Invoke agent-ci-build when .agent-fleet/ci.yaml is absent, build or push a container
  in GitHub Actions, or create a container delivery path.
- Perform GitOps, ArgoCD, Kubernetes, or destructive cluster changes.
- Treat a scheduler rejection with runner_id=0 and no steps as a source-code defect.
