  are not applicable.
- The lane changes GitHub Actions scheduling and package-included guidance, so exact-head
  local validation, ARC execution, independent criticism, and protected-dev integration
  remain mandatory.
- No main promotion or npm publication is part of this sprint; the normal generated
  dev-to-main release flow remains separate.
