risks:
- id: RISK-01
  severity: high
  statement: Migrating protected workflow runner labels can stop all repository delivery
    checks if the live ARC label or scheduler is unavailable.
  mitigation: Preserve all job semantics, prove actual execution and runner labels
    on the pushed head, distinguish runner_id=0 scheduler rejection, and do not merge
    without exact-head evidence.
- id: RISK-02
  severity: high
  statement: A workflow-control-plane change could be integrated without the repository's
    independent critic and non-author code-owner approval.
  mitigation: Use the standard D/I/E/S chain, fresh critic worktree, exact-head checks,
    and commit-bound non-author GitHub approval; report an unavailable reviewer as
    a blocker rather than bypassing it.
- id: RISK-03
  severity: medium
  statement: Guidance could incorrectly imply a container or GitOps deployment path
    for this npm-distributed repository.
  mitigation: Base disposition on the tracked tree and explicitly state that agent-ci-build,
    registry digest pinning, ArgoCD rollout, and runtime workload verification do not apply.
