schema_ref: lane-contract.schema.yaml
kind: LaneContract
schema_version: "1.0"
sprint_id: 2026-08-03-issue-239-ci-contract
lane_id: issue-239-ci-contract
title: Adopt and prove the managed agent-fleet CI/CD contract
status: approved
issue_ids: [239]
coupling_justification: null
objective: >-
  Make the Verdify Skills repo agent carry the centrally managed CI/CD
  instructions and prove its declared validation path from its own fleet pod at
  the exact implementation head.
desired_outcome: >-
  The repo contains byte-exact durable fleet guidance and an exact
  .agent-fleet/ci.yaml contract, its repo pod completes exact-head validation,
  and the estate ledger records this repo as validation-only with no undeclared
  image or deployment path.
non_goals:
  - Change application code, package contents, release versions, or publishing behavior.
  - Add repository-specific credentials, runners, workflows, or deployment identities.
  - Declare an image or deployment path that the repository does not own.
baseline_sha: d226b7f244fd4612ab44739fd275b8158e1d9159
branch: fleet/ci-cd-contract-3507
module_contracts:
  - agent-fleet-ci-contract-v0
  - repository-validation
worktree_policy:
  one_coding_session_per_worktree: true
  lock_required: true
lease_policy:
  worker_ttl_hours: 24
  critic_ttl_hours: 8
runtime_namespace:
  strategy: derived_at_dispatch
ownership:
  domains:
    - repository-agent-guidance
    - fleet-ci-validation-contract
  owned_paths:
    - .agent-fleet/ci.yaml
    - AGENTS.md
    - CLAUDE.md
    - MANIFEST.sha256
  prohibited_paths:
    - .github/**
    - bin/**
    - config/**
    - lib/**
    - package.json
    - schemas/**
    - scripts/**
    - skills/**
    - VERSION
  coordination_required_paths: []
  owned_interfaces:
    - Managed CI/CD instruction block generated by jvallery/agents.
    - Repo-local validation declaration consumed by agent-ci-validate.
dependencies:
  hard: []
  soft:
    - lane_id: agents-issue-3507
      coordination: >-
        The Agents platform owns the broker, admission contract, repo-build and
        repo-validate WorkflowTemplates, and estate-wide proof ledger.
acceptance_criteria:
  - id: LANE-AC-01
    statement: >-
      AGENTS.md and CLAUDE.md carry the byte-exact centrally managed CI/CD
      instructions and .agent-fleet/ci.yaml declares the repo validation
      contract without a repo-local override.
    sprint_acceptance_ids: [SPR-AC-01]
    evidence_required:
      - central repo-guidance audit
      - changed-path diff
  - id: LANE-AC-02
    statement: >-
      The owning Verdify Skills repo pod submits and completes
      agent-ci-validate against the exact implementation head.
    sprint_acceptance_ids: [SPR-AC-02]
    evidence_required:
      - exact head SHA
      - repo-validate Workflow name and terminal result
  - id: LANE-AC-03
    statement: >-
      The repository is explicitly disposed as validation-only: it declares no
      build image and no deployment target, and no delivery credential is
      introduced.
    sprint_acceptance_ids: [SPR-AC-03]
    evidence_required:
      - parsed .agent-fleet/ci.yaml
      - changed-path and secret-scan evidence
  - id: LANE-AC-04
    statement: >-
      Repository validation, manifest integrity, contract parsing, diff
      hygiene, and the managed fleet guidance audit pass at the implementation
      head.
    sprint_acceptance_ids: [SPR-AC-04]
    evidence_required:
      - make validate result
      - make manifest-check result
      - agent-ci-validate --print result
      - git diff --check result
validation_commands:
  - id: repository-validation
    command: make validate
    purpose: Validate all repository skills, schemas, and policy structure.
    required: true
  - id: manifest-check
    command: make manifest-check
    purpose: Prove package manifest integrity after adding managed files.
    required: true
  - id: contract-parse
    command: agent-ci-validate --print
    purpose: Parse the repo-local fleet CI contract without submitting work.
    required: true
  - id: exact-head-repo-pod-validation
    command: agent-ci-validate --wait
    purpose: Submit and await exact-head validation from the owning repo pod.
    required: true
  - id: diff-check
    command: git diff --check d226b7f244fd4612ab44739fd275b8158e1d9159..HEAD
    purpose: Reject whitespace and patch-hygiene defects.
    required: true
  - id: changed-commit-secret-scan
    command: gitleaks git --no-banner --redact --log-opts="d226b7f244fd4612ab44739fd275b8158e1d9159..HEAD"
    purpose: Scan every lane commit without exposing detected values.
    required: true
required_evidence:
  - Immutable approved dispatch contract followed by a separate implementation commit.
  - Byte-exact central guidance audit and parsed .agent-fleet/ci.yaml.
  - Exact-head terminal repo-validate Workflow proof from the Verdify Skills pod.
  - Manifest, repository validation, diff, and redacted secret-scan results.
  - Worker closeout and fresh independent critic report bound to the D/I/E/S chain.
git_policy:
  pull_request_required: true
  github_checks_required: true
  self_merge_allowed: false
  clean_worktree_required: true
escalation_conditions:
  - The scoped Verdify GitHub App installation cannot mint the repo-read token required by repo-validate.
  - Any fix would require a repository-specific credential, runner, workflow, or deployment identity.
  - The managed guidance cannot remain byte-identical to the Agents registry output.
definition_of_done:
  - The approved dispatch contract remains byte-identical after its dispatch commit.
  - All required validation commands pass at the exact implementation head.
  - The worker closeout records exact D, I, E, validation, and validation-only disposition.
  - A fresh independent critic approves the exact evidence head and required checks pass at the report-only head.
  - The PR merges to protected dev and issue 239 reflects the delivered result.
approval:
  status: approved
  approver: Jason Vallery
  approved_at: "2026-08-03T12:34:39Z"
