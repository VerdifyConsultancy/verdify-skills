    owner: Fresh critic
    trigger: Exact implementation and closeout heads pass every required local validation.
    review_packet_path: ".agent-workflow/sprints/2026-07-12-issue-70-change-classes/review/review-inbox-packet.yaml"
  user_stories_for_review:
  - id: US-01
    statement: As the controller, I can advance planning-only and lightweight changes
      with proportional typed evidence instead of fabricating implementation lanes
      or recording policy exceptions.
    issue_ids:
    - 70
    lane_ids:
    - issue-70-change-classes
    acceptance_refs:
    - SPR-AC-01
    - SPR-AC-02
  - id: US-02
    statement: As the controller, I can trust that any diff touching protected paths
      always traverses the full standard chain regardless of its declared class.
    issue_ids:
    - 70
    lane_ids:
    - issue-70-change-classes
    acceptance_refs:
    - SPR-AC-03
  - id: US-03
    statement: As the operator, I can rely on typed no-op promotion and typed merge
      authority instead of chronic red pushes and unguarded admin merges, and I audit
      machine-merged lanes through the weekly sampling sweep.
    issue_ids:
    - 70
    lane_ids:
    - issue-70-change-classes
    acceptance_refs:
    - SPR-AC-04
    - SPR-AC-05
  reporting_summary:
    included:
    - typed change classes across both policy entrypoints and the router
    - protected-path single source with force-standard override
    - typed no-op promotion and typed merge-authority table
    - reconciled authority docs and the weekly human sampling sweep
    deferred:
    - issue 225 lifecycle-phase schema
    - issues 75 and 74 evaluation floor
    - issues 43 and 76 route simplification
    ownership:
    - lane_id: issue-70-change-classes
      owner: claude-issue70-worker
      responsibility: Implement and prove typed change classes and typed merge authority
        end to end.
    next_review: One fresh critic at the exact evidence head, then protected-dev integration
      with the recorded non-author code-owner review and the deterministic terminal
      receipt.
approval:
