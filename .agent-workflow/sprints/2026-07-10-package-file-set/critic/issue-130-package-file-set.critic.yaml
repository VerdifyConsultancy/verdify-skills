integration_risks:
  - A local package or release run from a contaminated checkout can stage bytes reached through an untracked parent symlink, including external host data, under an allowed tracked archive path.
  - Local permission drift can change executable or other Unix mode metadata in the archive while content hashes and the current tests remain unchanged.
  - This request-fixes report must remain draft and must not receive an advancing approval; fixes require a new substantive implementation head, closeout-only evidence head, fresh critic report, and exact-head required checks.
residual_risks:
  - The exported-tree two-argument manifest compatibility path intentionally lacks a Git index and therefore retains exclusion-list semantics for already-exported input; it should remain explicitly bounded and should not become the release archive source.
  - No npm publication, GitHub release, dev integration, runtime deployment, or deployment verification was performed in this lane or critic session.
  - A future approving report head will still require an APPROVED review from a repository admin or maintainer other than PR author jvallery; this critic is not that external approval authority.
