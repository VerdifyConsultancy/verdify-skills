  workflows:
    - name: validate
      required: true
      event_triggers: [pull_request, push]
      timeout_minutes: 30
      evidence_expected: [full package test result, recovered skill/pack validation, release-preflight result]
    - name: policy
      required: true
      event_triggers: [pull_request]
      timeout_minutes: 15
      evidence_expected: [issue/lane/contract/current-head policy result]
    - name: compliance-selftest
      required: true
      event_triggers: [pull_request, push]
      timeout_minutes: 15
      evidence_expected: [compliance workflow result]
  artifacts:
    - Timeline-historian and CRM/pack validation output.
    - Evidence registry/source hash audit.
    - Recovery ledger and Git ref/worktree snapshot.
    - Manifest/package/npm exact-set evidence.
