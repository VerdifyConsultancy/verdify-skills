  issue_ids: [126]
  lane_ids: [issue-126-recovery-publication]
  northstar_ids: [FR-007, FR-012, AC-007, AC-012]
  summary: Selectively recover unpublished skill, pack, evidence, and ledger work into dev without publishing a package or mutating runtime services.
  non_goals:
    - Publish npm, tag Git, create a GitHub release, or promote dev to main.
    - Delete rescue refs or clean the shared live runner checkout.
