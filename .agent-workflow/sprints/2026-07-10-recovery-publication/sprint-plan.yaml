      statement: As a maintainer, I can retrieve and use the previously unpublished timeline, CRM, pack, and North Star evidence work from accepted current-baseline code rather than rescue branches.
      issue_ids: [126]
      lane_ids: [issue-126-recovery-publication]
      acceptance_refs: [SPR-AC-01, SPR-AC-02, SPR-AC-03, SPR-AC-04, SPR-AC-05]
  reporting_summary:
    included:
      - "Issue #126 selective recovery from fe1f94e, f425515, and 22f81bd plus the checked-in disposition ledger."
    deferred:
      - "Issue #120 exact packed-artifact publication and recovery transaction."
      - "Issue #121 branch protection, approval transport, and router policy-exception support."
      - "New-version main/npm/GitHub release and destructive rescue-ref cleanup."
    ownership:
      - lane_id: issue-126-recovery-publication
