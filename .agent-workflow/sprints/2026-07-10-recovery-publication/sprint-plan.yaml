deployment_expectations:
  - No runtime, CRM, email, npm, or production deployment is authorized for this sprint.
  - The lane targets dev only after fresh criticism, exact-head checks, and either non-author review or a recorded user-authorized admin-merge exception.
  - The three rescue refs remain until a later new-version main release and final cleanup audit.
review_plan:
