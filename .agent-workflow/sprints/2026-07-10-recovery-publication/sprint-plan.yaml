        - Immutable index staging, manifest, npm install, and exact archive verification remain green.
    - id: QA-03
      name: Recovery ledger and cleanliness proof
      due: before critic review
      evidence_expected:
        - Every named ref/worktree has a checked-in disposition and exact retrieval handle.
        - No rescue ref or shared runner worktree is destructively cleaned in this lane.
