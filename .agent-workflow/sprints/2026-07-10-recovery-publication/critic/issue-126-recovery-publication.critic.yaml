findings:
  - id: FIND-001
    severity: low
    statement: >-
      The timeline bundle validator accepts any 64-character content_sha256 value,
      including non-hexadecimal text, and does not bind asset_id to the declared digest.
      The recovered Sunshine fixture uses valid hashes, so this does not invalidate the
      reviewed evidence, but malformed future bundles can receive valid=true.
    evidence:
      - "skills/timeline-historian/scripts/validate_timeline_bundle.py:54 checks presence and line 62 checks only string length despite the line 63 error calling the value hexadecimal."
      - "An independent critic probe replaced a seeded asset digest with 64 lowercase z characters and updated its references; validate_timeline_bundle.py returned valid=true with an empty errors array."
    requested_action: >-
      Track a follow-up hardening change that enforces exactly 64 lowercase hexadecimal
      characters and verifies asset_id equals sha256:<content_sha256>; keep this lane's
      exact recovered source and current acceptance evidence unchanged.
  - id: FIND-002
    severity: low
    statement: >-
      Pack installation is not transactional when an existing target conflicts without
      --force: links created before the conflict remain even though the command exits 2
      and no installed-pack manifest is written.
    evidence:
      - "lib/verdify/cli.rb:2449-2472 mutates each selected link as it iterates and discovers later conflicts only after earlier links have been created; the manifest is written afterward at lines 2474-2499."
      - "An independent research-analysis install probe placed a conflict at the second required Codex link; the command exited 2, preserved the conflicting operator directory, left the first new skill link active, and wrote no .agent-skills/verdify-packs/research-analysis.yaml manifest."
    requested_action: >-
      Track a follow-up installer hardening change that preflights every selected host
      target and manifest destination before mutation, or rolls back all created links
      when installation fails.
