dependencies:
  hard:
    - lane_id: issue-130-package-file-set
      required_output: Preserve the integrated immutable Git-index shipped-file selector and exact archive behavior from dev commit 17b3762.
  soft:
    - lane_id: issue-120-release-safety
      coordination: Leave exact publication, provenance, release ledger, and recovery transaction behavior for the following release-safety sprint.
acceptance_criteria:
  - id: LANE-AC-01
    statement: All timeline-historian skill/eval/link files and the timeline claims/provenance evidence entry are selectively recovered from fe1f94e and validate on the current baseline.
    sprint_acceptance_ids: [SPR-AC-01]
    evidence_required: [source-to-target path ledger, skill/script validation, registry ID and SHA audit, read-only Sunshine smoke or explicit source-unavailable result]
  - id: LANE-AC-02
    statement: The four delivery-loop evidence packages and AGENTIC_LOOP_SKILL_AUDIT.md from f425515 are registered as historical evidence without replaying alternate architecture/schema work.
    sprint_acceptance_ids: [SPR-AC-02]
    evidence_required: [four registry entries, copied source hash verification, prohibited-path diff audit]
  - id: LANE-AC-03
    statement: "crm-email and skill packs from 22f81bd are ported semantically, validate/install in isolated targets, preserve package version 1.2.1, and retain issue #130 index-object staging."
    sprint_acceptance_ids: [SPR-AC-03]
    evidence_required: [pack schema/list/install/dl tests, CRM no-live-write tests, package version/archive audit]
  - id: LANE-AC-04
    statement: The checked-in recovery ledger accounts for fe1f94e, f425515, 22f81bd, mapped merged branches, superseded refs, shared runner state, and cleanup eligibility without destructive cleanup.
    sprint_acceptance_ids: [SPR-AC-04]
    evidence_required: [docs/recovery-ledger-2026-07-10.md, git branch/worktree/ref snapshot, "issue #126 cross-links"]
  - id: LANE-AC-05
    statement: Exact implementation and report heads pass secret scan, repository validation, focused recovery tests, make test, package verification, and live GitHub checks.
    sprint_acceptance_ids: [SPR-AC-05]
    evidence_required: [gitleaks changed-path summary, make test, manifest/package results, required check URLs]
validation_commands:
  - id: repository-validation
    command: ruby scripts/validate-repo.rb
    purpose: Validate recovered skills, packs, schemas, evidence, references, discovery links, and repository invariants.
    required: true
  - id: pack-cli-list
    command: bin/verdify pack list --json
    purpose: Prove every pack manifest validates and references known skills.
    required: true
  - id: cli-lifecycle-suite
    command: bash tests/test_cli.sh
    purpose: Exercise pack list/install and existing lifecycle CLI behavior.
    required: true
  - id: installed-package-suite
    command: bash tests/test_npm_install.sh
    purpose: Prove npm-distributed pack and skill surfaces install without changing version identity.
    required: true
  - id: full-suite
    command: make test
    purpose: Run manifest, schema, skill, package, policy, release-preflight, and npm tests together.
    required: true
  - id: changed-path-secret-scan
    command: gitleaks git --no-banner --redact --log-opts="17b3762f024186a336556f60c27268006a8d59b6..HEAD"
    purpose: Scan the final changed artifact set without exposing matched values.
    required: true
required_evidence:
  - Exact rescue commit IDs, source paths, selected target paths, and rejected stale paths.
  - Evidence registry queries and source SHA-256 validation for all five recovered evidence records.
  - Timeline skill and deterministic helper outputs plus read-only Sunshine smoke result when the source manifest exists.
  - Pack schema/list/install/dl and CRM fixture/help validation with no live service mutation.
  - Current package version, immutable index staging, manifest, archive exact-set, and npm install proof.
  - Checked-in branch/worktree/ref disposition ledger and retained rescue-ref proof.
  - Clean implementation worktree, worker closeout, fresh critic report, and exact-head GitHub checks.
git_policy:
  pull_request_required: true
  github_checks_required: true
  self_merge_allowed: false
  clean_worktree_required: true
escalation_conditions:
  - "A source file conflicts with current behavior and intent cannot be resolved from issue #126, source evidence, or current tests."
  - Recovery requires protected North Star/product/architecture changes rather than evidence registration.
  - crm-email validation requires live credentials, service mutation, or unredacted secret handling.
  - Pack support requires changing VERSION, publish workflows, archive identity, or scripts/package-file-list.rb.
  - Any rescue ref or shared checkout would need destructive mutation before accepted current-baseline recovery.
definition_of_done:
  - Every selected source artifact and every intentionally rejected source artifact has a durable ledger entry with an exact ref.
  - All acceptance criteria have exact implementation evidence and the worktree is clean at I.
  - Evidence head E adds only the canonical closeout after substantive implementation.
  - A different critic agent/session commits only the critic report at S with approve or approve_with_risks outcome.
  - Validate, pull-request-policy, and compliance checks pass at S.
  - Integration uses a non-author review when available or a user-authorized, recorded admin-merge policy exception.
  - "Release publication, main promotion, and destructive cleanup remain separate controller steps after issues #120 and #121."
approval:
  status: approved
  approver: Jason Vallery
  approved_at: "2026-07-10T04:50:00Z"
