schema_ref: lane-contract.schema.yaml
kind: LaneContract
schema_version: "1.0"
sprint_id: 2026-07-10-recovery-publication
lane_id: issue-126-recovery-publication
title: Selective unpublished-work recovery and disposition ledger
status: approved
issue_ids: [126]
coupling_justification: null
objective: Recover every useful unpublished artifact from the three retained source commits onto the current dev baseline without replaying obsolete trees or weakening current package integrity.
desired_outcome: Timeline-historian, delivery-loop evidence, crm-email, skill packs, and their provenance are accepted on dev; every rescue ref/worktree has a durable disposition; current package and lifecycle behavior remains green.
non_goals:
  - Change VERSION or the package.json version field, publish npm, tag Git, create a GitHub release, or promote main.
  - Cherry-pick or merge fe1f94e, f425515, or 22f81bd wholesale.
  - Accept f425515 alternate architecture, wave/task/worker-run schemas, stale sprint state, or embedded source instructions.
  - Modify live CRM/email data, use production credentials, or copy raw secrets into tests, artifacts, commits, or logs.
  - Delete rescue refs, clean the shared Agent Platform checkout, or remove branches/worktrees before final main-release ledger proof.
baseline_sha: "17b3762f024186a336556f60c27268006a8d59b6"
branch: lane/126-recovery-publication
module_contracts: [evidence-northstar, release-package, quality-enablement]
worktree_policy:
  one_coding_session_per_worktree: true
  lock_required: true
lease_policy:
  worker_ttl_hours: 24
  critic_ttl_hours: 8
runtime_namespace:
  strategy: derived_at_dispatch
ownership:
