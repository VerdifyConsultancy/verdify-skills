integration_risks:
  - >-
    The unreviewed implementation is already present on protected dev at merge
    commit cfaedfe60a1910b86725c2d5abea27aecbb9b5e3. A crafted approved State of
    Union can currently bypass sprint planning and route directly to a worker.
  - >-
    This report-only S is durable request-fixes evidence on the lane branch; it
    is not an approval, cannot retroactively authorize merge commit cfaedfe,
    and must not be used to generate a normal terminal receipt.
  - >-
    Main, npm publication, GitHub release, runtime deployment, and credential or
    permission changes remain outside this lane and must not advance from the
    unauthorized dev merge.
residual_risks:
  - >-
    Existing initialized repositories do not receive the two new ignore entries
    from a non-forced init. They may need an explicit .gitignore update and git
    index cleanup before generated route views are purely local cache; fresh
    initialization and the tested forced upgrade install the entries.
  - >-
    The candidate tests validate skill/mode membership but do not derive or
    assert producer-specific workflow transitions. Any fix must cover other
    dynamic producer handoffs, not only the reproduced StateOfUnion pair.
  - >-
    Any implementation commit after this report requires a new closeout and
    independent exact-head review; the current merged E and later request-fixes
    S are not an approving chain.
