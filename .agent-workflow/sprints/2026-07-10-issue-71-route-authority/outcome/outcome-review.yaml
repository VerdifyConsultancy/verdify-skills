lessons_learned:
- A schema-valid status is not sufficient authority; routing also needs a producer-owned legal transition graph.
- Derived route output must remain observable but untracked so cache generation cannot become global lifecycle authority.
- One independent critic with fix-forward re-review exposed the semantic gap without requiring repeated approval layers.
- Merge authority needs a typed automated guard because administrative UI actions can race controller-owned evidence sequencing.
