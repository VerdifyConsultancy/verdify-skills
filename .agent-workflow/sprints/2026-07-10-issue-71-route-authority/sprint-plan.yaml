  contract_path: ".agent-workflow/sprints/2026-07-10-issue-71-route-authority/lanes/contracts/issue-71-route-authority-validation.contract.yaml"
  branch: lane/71-route-authority-validation
  owner: codex-issue71-worker
  reviewer: fresh-independent-critic
  summary: Validate every upstream route authority input before use and remove committed
    route cache from the authority surface.
dependency_order:
- - issue-71-route-authority-validation
deployment_expectations:
- The lane changes package routing, validation, tests, docs, and derived-cache tracking
  only; it has no application runtime deployment.
- Exact-head CI must exercise the installed/package form as well as source-tree routing
  and validation.
- Protected library and validation paths require one fresh critic and the declared
  exact-head protected-path integration decision.
- After integration, ROOT must complete the deterministic normal terminal receipt
  and verify global routing before issue 73 starts.
