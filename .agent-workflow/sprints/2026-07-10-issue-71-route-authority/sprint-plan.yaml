schema_ref: sprint-plan.schema.yaml
kind: SprintPlan
schema_version: '1.0'
sprint_id: 2026-07-10-issue-71-route-authority
status: complete
goal: Make every upstream lifecycle authority input fail closed through named schema
  and semantic validation, and make live routing the sole authority instead of committed
  route-cache files.
baseline_sha: af3e6b7e7b23b600e62c1aedf042ab9a5d244deb
github:
  repository: VerdifyConsultancy/verdify-skills
  milestone:
  project:
issue_ids:
- 71
scope:
- Add one reusable route artifact loader that selects the expected schema in code,
  applies schema plus semantic validation, and returns bounded typed errors before
  callers consume authority fields.
- Apply the loader to transcript intake, evidence registry, North Star plan and artifact
  state, project definition, architecture, module contracts, state of union, and repository
  hygiene.
- Route invalid or impossible upstream artifacts back to their producing skill without
  crashing or advancing the lifecycle.
- Validate dynamic handoff skill and mode pairs while preserving every currently legal
  handoff.
- Define route-decision YAML and Markdown as ignored local derived cache, keep route
  --write generation, and reject re-tracking the cache paths.
- Add malformed-foundation, illegal-handoff, stale-cache, YAML/Markdown agreement,
  valid-handoff, and cache-ignore regressions.
non_goals:
- Rebuild the existing critic, release, outcome, or terminal-receipt validators.
- Implement criterion-complete critic evidence from issue 73, the eval runner from
  issue 75, consumer CI from issue 74, or risk classes and human-gate policy from
  issue 70.
- Change schemas, North Star, project definition, architecture, strategy, sprint history,
  GitHub delivery controls, or runtime infrastructure.
- Add a live or network-dependent route parity check to every repository validation
  run.
- Begin any Agent Platform, Gravity, Orbit, provider, correlated-transaction, or durability
  lane.
acceptance_criteria:
- id: SPR-AC-01
  statement: Every named upstream route-authority artifact is schema and semantic
    validated through a caller-selected expected schema before any status, handoff,
    or authority field is consumed.
  lane_ids:
  - issue-71-route-authority-validation
  evidence_expected:
  - loader unit tests
  - malformed artifact matrix
  - caller mapping assertions
- id: SPR-AC-02
  statement: Invalid YAML, wrong kind or schema, missing fields, semantic violations,
    and impossible handoffs produce bounded typed evidence and route to the owning
    producer without advancing or crashing.
  lane_ids:
  - issue-71-route-authority-validation
  evidence_expected:
  - producer route matrix
  - sanitized error assertions
  - negative handoff tests
- id: SPR-AC-03
  statement: Existing specialized sprint, lane, critic, review, release, outcome,
    and terminal-receipt validation behavior remains intact, and a complete valid
    fixture reaches its current legal handoff.
  lane_ids:
  - issue-71-route-authority-validation
  evidence_expected:
  - full regression suite
  - valid lifecycle fixture
  - terminal receipt preservation
- id: SPR-AC-04
  statement: Route-decision YAML and Markdown are untracked ignored derived caches;
    route --write still generates an agreeing pair, repository validation rejects
    re-tracking them, and generated_at is not authority.
  lane_ids:
  - issue-71-route-authority-validation
  evidence_expected:
  - git index assertions
  - ignore assertions
  - generated pair comparison
  - stale cache regression
- id: SPR-AC-05
  statement: Focused and full tests, manifest and repository validation, redacted
    secret scan, one fresh critic, exact-head CI, protected-dev integration, and a
    normal terminal receipt all pass.
  lane_ids:
  - issue-71-route-authority-validation
  evidence_expected:
  - D/I/E/S chain
  - test logs
  - fresh critic report
  - GitHub checks
  - terminal receipt
risks:
- id: RISK-01
  severity: critical
  statement: A partial loader migration could leave one raw authority field able to
    bypass validation.
  mitigation: Enumerate every authority artifact and caller, require a named schema
    mapping, and test a malformed approved fixture for each producer.
- id: RISK-02
  severity: high
  statement: Broad exception handling or artifact diagnostics could hide programmer
    faults or expose unbounded untrusted content.
  mitigation: Catch only parse and validation failures, cap and sanitize error evidence,
    and retain unexpected exceptions as failures.
- id: RISK-03
  severity: medium
  statement: Removing tracked route caches could break examples, packaged artifacts,
    or operators that mistake snapshots for authority.
  mitigation: Keep route --write behavior, update examples and docs, assert ignore/index
    state, and run install plus manifest regressions.
lanes:
- lane_id: issue-71-route-authority-validation
  issue_ids:
