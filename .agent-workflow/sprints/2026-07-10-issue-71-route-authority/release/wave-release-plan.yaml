  - name: valid route preservation
    source: focused and full route suites
    threshold: Every declared legal handoff and complete valid fixture retains its expected route.
    blocking: true
  - name: cache authority removal
    source: Git index, ignore, generated-pair, and repository validation checks
    threshold: Both route cache files are untracked and ignored, route --write generates an agreeing pair, and re-tracking fails validation.
    blocking: true
  - name: terminal convergence
    source: normal terminal receipt and project-router
    threshold: Receipt checks are green, integrated_unterminated is zero, and routing advances to issue 73 planning.
    blocking: true
review_handoff:
