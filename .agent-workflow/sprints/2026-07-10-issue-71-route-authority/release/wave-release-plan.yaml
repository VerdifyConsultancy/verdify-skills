risks:
- id: RISK-01
  severity: critical
  statement: One unmigrated raw route-authority read would preserve the bypass.
  mitigation: Require a complete caller matrix and malformed fixture for every named producer.
- id: RISK-02
  severity: high
  statement: Fail-closed handling could accidentally suppress code defects or disclose untrusted artifact data.
  mitigation: Bound validation errors, distinguish expected artifact failures from programmer exceptions, and test redaction.
- id: RISK-03
  severity: medium
  statement: Derived-cache removal could break package or operator expectations.
  mitigation: Preserve route --write, update documented consumers, and gate on installed-package and generated-pair tests.
