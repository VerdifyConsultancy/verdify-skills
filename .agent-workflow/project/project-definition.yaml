  architecture_inputs:
    system_context:
    - Verdify Skills is the method and planning layer between human intent, GitHub delivery state, Agent Platform execution, Orbit context, Gravity evidence, package distribution, and target-repository runtime verification.
    - Each owning project remains authoritative for its source, runtime, data, security, and operational state; cross-project behavior flows through versioned contracts and evidence.
    architecture_decision_areas:
    - Canonical lifecycle graph, artifact authority, route validation, and derivative-view generation.
    - Durable controller versus sprint-orchestrator ownership and resumable event/session storage.
    - Agent Platform provider capability discovery, session identity, isolation, and failure contracts.
    - Gravity API/MCP versioning, tenancy, citation, authorization, pagination, and availability contracts.
    - Orbit connector identity, classification, audit, retention, privacy, and human-control contracts.
    - Exact-artifact package build, integrity, provenance, release ledger, rollback, and recovery.
    - GitHub branch protection, reviewer identity, current-head review mapping, and generated release promotion.
    quality_attributes:
    - Traceability and provenance.
    - Determinism and reproducibility.
    - Least privilege, privacy, and auditability.
    - Resumability and failure isolation.
    - Portability and maintainability.
    - Operability and runtime verifiability.
    - Fast safe progress without legacy compatibility drag.
    constraints:
    - GitHub and versioned repository artifacts retain typed authority.
    - One issue/lane/branch/worktree/session/PR remains the default delivery unit.
    - Workers do not self-certify and do not receive unbounded production credentials.
    - Main receives reviewed release promotion, not ordinary implementation work.
    - Approved replacements need not preserve deprecated compatibility.
    assumptions:
    - Owning projects will publish the provider, connector, and evidence contracts required by the four-project pilot.
    - GitHub and npm continue to support the current internal distribution path during this milestone.
  delivery_operations:
    environments:
    - Source/local validation uses isolated worktrees and lane-scoped resources.
    - Dev is the accepted integration branch; main is the release branch; installed and vendored consumers are distinct validation environments.
    - Runtime dev/stage/prod environments remain owned and verified by their target repositories and deployment controllers.
    infrastructure:
    - GitHub hosts source and delivery control; npm hosts immutable packages; Agent Platform hosts execution; project-specific GitOps owns runtime infrastructure.
    configuration:
    - Repository configuration, schemas, templates, provider capabilities, consumer vendoring config, and secret references are versioned; raw secrets are external.
    deployment:
    - Integration, release publication, target deployment, runtime health, and outcome acceptance are separate transitions with separate evidence.
    rollback:
    - Source changes are reverted through Git; immutable packages roll forward with a newer version; runtime rollback follows the owning release plan; partial publication resumes from a ledger.
    migrations:
    - Package upgrades test supported source/install/vendor transitions; deprecated contracts are removed after approval; project data migrations remain in owning repos.
    observability:
    - Controllers emit status events and session identity; release and deployment evidence names exact revisions; owning runtimes expose required logs, metrics, traces, health, and diagnostics.
    support:
    - Maintainers own package and workflow support; project owners support their runtime/data surfaces; review packets and runbooks provide reproduction and escalation handles.
    incident_response:
    - Incident bypass requires an authorized recorded gate; affected issues and delivery/deployment state remain open until identical re-probes prove durability.
    documentation:
    - Canonical artifacts, generated views, README/workflow/lifecycle docs, per-skill guidance, schemas, changelog, release notes, and recovery ledgers must agree.
  open_gaps:
  - id: GAP-001
    area: release_safety
    question: When will exact packed-artifact testing and the resumable publication ledger be implemented?
    impact: Blocks the next trusted npm promotion but does not block project-definition or architecture handoff.
    owner: GitHub issue #120
    blocking: false
    status: open
  - id: GAP-002
    area: delivery_control
    question: When will dev protection, effective reviewers, release-only main policy, and current-head review submission be enforced live?
    impact: Raises integration deadlock and bypass risk; owned by delivery-control implementation.
    owner: GitHub issue #121
    blocking: false
    status: open
  - id: GAP-003
    area: recovery
    question: Which exact historian, evidence, and historical-control artifacts from fe1f94e and f425515 remain authoritative on the current baseline?
    impact: Blocks final repository cleanup and default-branch completeness, not project-definition approval.
    owner: GitHub issue #126
    blocking: false
    status: open
  - id: GAP-004
    area: agent_platform
    question: Which supported provider capabilities and runtime readiness evidence satisfy the four-project pilot?
    impact: Blocks Agent Platform dispatch readiness and dependent pilot execution.
    owner: Agent Platform owning issues and platform-readiness
    blocking: false
    status: open
  - id: GAP-005
    area: gravity
    question: Which API/MCP implementation and readiness evidence satisfy the approved versioned cited-evidence contract?
    impact: Blocks Gravity integration and pilot readiness, not Skills architecture work.
    owner: Gravity owning issue and gravity-readiness
    blocking: false
    status: open
  - id: GAP-006
    area: orbit
    question: Which connector identities, classification rules, retention policies, and human controls authorize the approved Orbit scope?
    impact: Blocks governed Orbit connector activation, not Skills architecture work.
    owner: Orbit owning issue and product/security owners
    blocking: false
    status: open
  - id: GAP-007
    area: package_integrity
    question: How will manifest and archive generation select one reproducible shipped-file set independent of ignored or untracked host state?
    impact: Blocks trusted local package generation on contaminated worktrees and is owned by issue #130; it does not block project-definition approval.
    owner: GitHub issue #130
    blocking: false
    status: open
  handoff_readiness:
    architecture_contracts:
    - "Ready: approved North Star and project definition provide system context, ownership, interfaces, decision areas, quality attributes, constraints, and owner-routed gaps with no blocking unknown."
    - Architecture must not absorb Agent Platform, Orbit, or Gravity implementation ownership and must retain exact-artifact and current-head review constraints.
    sprint_planning:
    - "Not yet ready: architecture/module contracts, current state-of-union strategy, and required repo-hygiene evidence remain downstream prerequisites."
    - Issue #126 remains a candidate recovery outcome after those prerequisites or an explicitly authorized hygiene handoff.
    release_verification:
    - "Not ready: issue #120 release-safety implementation, a genuinely new version, required checks, independent release approval, and exact-artifact evidence are required before main promotion."
