decisions:
- id: DEC-001
  statement: GitHub Issues are backlog truth, pull requests and checks are delivery truth, the default branch is accepted code truth, and deployment evidence separately owns runtime truth.
  status: approved
  rationale: The operating contract and authority matrix assign these responsibilities explicitly.
  source_ids: [SRC-002, SRC-003, SRC-009]
- id: DEC-002
  statement: Verdify Skills is an internal-first, minimal lifecycle and agent-method layer that drives the outer planning loop across four co-equal active projects.
  status: approved
  rationale: Iteration 25 replaces the earlier package-only framing with the approved four-project self-building platform outcome.
  source_ids: [SRC-005, SRC-007, SRC-008]
- id: DEC-003
  statement: Verdify Skills owns method and planning contracts; Agent Platform owns runtime execution; Orbit owns governed personal and engineering context; Gravity owns cited evidence processing and access.
  status: approved
  rationale: Explicit ownership prevents the method repository from absorbing runtime, connector, or evidence-service responsibilities.
  source_ids: [SRC-005, SRC-006, SRC-008]
- id: DEC-004
  statement: One issue, lane, branch, worktree, worker session, and pull request remains the default implementation unit; normal work integrates to dev and main receives generated release promotions.
  status: approved
  rationale: This preserves attributable execution and makes release identity distinct from implementation integration.
  source_ids: [SRC-002, SRC-004, SRC-009]
- id: DEC-005
  statement: Jason owns North Star lock authority; Jason or James may approve releases; workers do not self-certify and current-head criticism/review evidence is required before integration.
  status: approved
  rationale: Iteration 25 distinguishes product authority from release authority and retains independent review.
  source_ids: [SRC-002, SRC-005, SRC-006, SRC-007]
- id: DEC-006
  statement: Accepted replacements have no backward-compatibility obligation; deprecated capabilities are removed rather than retained as shims unless a later decision says otherwise.
  status: approved
  rationale: Internal-first distribution and the approved fastest-safe-path policy favor one current contract over parallel legacy behavior.
  source_ids: [SRC-005, SRC-006]
- id: DEC-007
  statement: Package publication must operate on one exact tested artifact and reconcile source, package, integrity, provenance, tag, release, and recovery state as one transaction.
  status: approved
  rationale: Source-only tests and non-resumable publication are insufficient for the trusted package boundary.
  source_ids: [SRC-005, SRC-006, SRC-011]
- id: DEC-008
  statement: Unpublished historical work is recovered selectively from exact Git refs, with accepted content ported forward and obsolete alternatives retained only as historical evidence.
  status: approved
  rationale: Whole-tree replay would regress newer authority and delivery work while deletion without disposition would lose knowledge.
  source_ids: [SRC-003, SRC-013]
- id: DEC-009
  statement: The prior draft project-definition claims about sixteen skills, joint North Star approval, one branch per wave, Onyx uncertainty, and package-only scope are superseded by iteration 25.
  status: superseded
  rationale: The locked North Star and current repository state provide newer explicit authority.
  source_ids: [SRC-005, SRC-006, SRC-007, SRC-008]
assumptions:
- id: ASM-001
  statement: VerdifyConsultancy/verdify-skills is the canonical source repository for the method package and its protected lifecycle artifacts.
  status: validated
- id: ASM-002
  statement: Agent Platform capabilities are negotiated through supported APIs or MCP surfaces and owning-repository issues rather than invented locally.
  status: validated
- id: ASM-003
  statement: Orbit and Gravity implementation details may evolve independently while preserving the PilotProject and evidence-interface contracts approved by the North Star.
  status: open
- id: ASM-004
  statement: GitHub and npm remain the current source and package control planes until an approved migration changes them.
  status: validated
contradictions:
- id: CON-001
  statement: The old draft proposed one branch per wave, while the operating contract and locked North Star require per-issue delivery units with wave-level coordination.
  source_ids: [SRC-002, SRC-005, SRC-009]
  status: resolved
- id: CON-002
  statement: The old draft required Jason and James jointly for North Star changes, while iteration 25 assigns North Star lock to Jason and release approval to Jason or James.
  source_ids: [SRC-005, SRC-007, SRC-008]
  status: resolved
- id: CON-003
  statement: The old draft treated Gravity and Onyx status as unresolved, while iteration 25 identifies current Gravity as authoritative and the retired deployment as history.
  source_ids: [SRC-005, SRC-006]
  status: resolved
- id: CON-004
  statement: Generated release PRs repeatedly attempted to republish version 1.2.1, while the exact-artifact policy requires a new, unpublished version.
  source_ids: [SRC-007, SRC-011, SRC-013]
  status: resolved
requirements:
  functional:
  - id: FR-001
    statement: The package must deterministically route a repository to the earliest incomplete lifecycle skill and mode from validated GitHub and artifact state.
    source_ids: [SRC-001, SRC-004, SRC-005]
    acceptance_ids: [AC-001]
  - id: FR-002
    statement: Transcript, research, review, and planning evidence must be copied, hashed, registered, queryable, and synthesized before protected downstream artifacts consume it.
    source_ids: [SRC-005, SRC-007, SRC-008]
    acceptance_ids: [AC-002]
  - id: FR-003
    statement: Approved product and architecture North Stars must flow through project definition, architecture contracts, strategy, sprint planning, execution, review, release verification, and outcome acceptance.
    source_ids: [SRC-004, SRC-005, SRC-006]
    acceptance_ids: [AC-003]
  - id: FR-004
    statement: Every implementation outcome must normally map to one GitHub issue, executable lane contract, branch, leased worktree, worker session, and pull request.
    source_ids: [SRC-002, SRC-003, SRC-009]
    acceptance_ids: [AC-004]
  - id: FR-005
    statement: Controller and orchestrator workflows must persist lifecycle state, child sessions, gates, events, dependencies, waves, and resumable handoffs outside model conversation history.
    source_ids: [SRC-004, SRC-005, SRC-006]
    acceptance_ids: [AC-005]
  - id: FR-006
    statement: Worker closeout, fresh criticism, current-head review evidence, checks, issue state, and PR state must reconcile before integration.
    source_ids: [SRC-002, SRC-003, SRC-006]
    acceptance_ids: [AC-006]
  - id: FR-007
    statement: Release automation must build and test one exact package artifact, promote only a new version from dev to main, and reconcile provenance, tag, release, and resumable transaction state.
    source_ids: [SRC-006, SRC-009, SRC-011, SRC-012]
    acceptance_ids: [AC-007]
  - id: FR-008
    statement: Verdify Skills must consume Agent Platform execution through capability-negotiated provider contracts and preserve platform-owned runtime and session authority.
    source_ids: [SRC-005, SRC-006]
    acceptance_ids: [AC-008]
  - id: FR-009
    statement: Gravity must expose cited, tenant-scoped evidence through a versioned read-only HTTP API with an MCP adapter and explicit readiness gates.
    source_ids: [SRC-005, SRC-006]
    acceptance_ids: [AC-009]
  - id: FR-010
    statement: Orbit must support governed personal-assistant and engineering-chief-of-staff workflows through least-privilege connectors, classification, audit, privacy, retention, and human controls.
    source_ids: [SRC-005, SRC-006]
    acceptance_ids: [AC-010]
  - id: FR-011
    statement: Repository recovery must inventory every local and remote work ref, preserve authoritative content, record a durable disposition, and remove only proven redundant residue.
    source_ids: [SRC-003, SRC-013]
    acceptance_ids: [AC-011]
  - id: FR-012
    statement: Consumers must be able to install or vendor the package, validate the installed shape, invoke documented skills and CLI commands, and identify the exact package version and source revision.
    source_ids: [SRC-001, SRC-010, SRC-011]
    acceptance_ids: [AC-012]
  non_functional:
  - id: NFR-001
    category: traceability
    statement: Sources, decisions, requirements, issues, contracts, commits, reviews, releases, deployments, and outcomes must remain linked by stable identifiers.
    source_ids: [SRC-002, SRC-003, SRC-005]
    acceptance_ids: [AC-003, AC-006]
  - id: NFR-002
    category: governance
    statement: Typed authority and human gates must fail closed for protected intent, security, production, publication, destructive operations, and unresolved material decisions.
    source_ids: [SRC-002, SRC-003, SRC-005]
    acceptance_ids: [AC-004, AC-006, AC-007]
  - id: NFR-003
    category: security
    statement: Worker execution must be least-privilege, secret-safe, namespace-isolated, auditable, and resistant to instruction-bearing untrusted content.
    source_ids: [SRC-002, SRC-006]
    acceptance_ids: [AC-004, AC-008]
  - id: NFR-004
    category: privacy
    statement: Orbit and cross-project evidence access must enforce identity, classification, minimization, retention, deletion, and human approval boundaries.
    source_ids: [SRC-005, SRC-006]
    acceptance_ids: [AC-010]
  - id: NFR-005
    category: operability
    statement: Every delivery and deployment phase must provide deterministic checks, observable state, rollback or recovery instructions, support ownership, and exact stop conditions.
    source_ids: [SRC-002, SRC-006, SRC-011]
    acceptance_ids: [AC-005, AC-006, AC-007]
  - id: NFR-006
    category: portability
    statement: Skills, schemas, templates, and CLI behavior must work from source, installed package, and supported vendored consumer repositories without hidden local paths.
    source_ids: [SRC-001, SRC-010]
    acceptance_ids: [AC-012]
  - id: NFR-007
    category: reproducibility
    statement: Exact inputs, baseline and head SHAs, hashes, commands, environments, and outputs must be sufficient to reproduce validation and review evidence.
    source_ids: [SRC-002, SRC-006, SRC-011]
    acceptance_ids: [AC-002, AC-006, AC-007]
  - id: NFR-008
    category: maintainability
    statement: One canonical lifecycle model and generated or validated derivative views must prevent skill, schema, documentation, and artifact drift.
    source_ids: [SRC-001, SRC-004, SRC-005]
    acceptance_ids: [AC-001, AC-003]
  - id: NFR-009
    category: resilience
    statement: Controller and release transactions must resume safely after interruption without duplicate work, ambiguous ownership, or corrupted accepted state.
    source_ids: [SRC-005, SRC-006, SRC-011]
    acceptance_ids: [AC-005, AC-007]
  - id: NFR-010
    category: cost
    statement: New paid services, privileged dependencies, quotas, and vendor commitments require issue-backed justification and explicit approval.
    source_ids: [SRC-002, SRC-005]
    acceptance_ids: [AC-008]
  constraints:
  - id: CST-001
    statement: GitHub remains the backlog and delivery control plane; private chat is not authoritative project state.
    source_ids: [SRC-002, SRC-003]
  - id: CST-002
    statement: Accepted implementation reaches dev through issue-linked PRs; main receives only reviewed release promotion.
    source_ids: [SRC-009, SRC-012]
  - id: CST-003
    statement: One issue/lane/branch/worktree/session/PR is the default unit, and active coding worktrees are never shared.
    source_ids: [SRC-002]
  - id: CST-004
    statement: Workers cannot self-certify, and merge success cannot substitute for deployment or outcome verification.
    source_ids: [SRC-002, SRC-003]
  - id: CST-005
    statement: Raw credentials, private keys, tokens, and sensitive reproduction detail must not enter Git, issues, PRs, logs, or chat.
    source_ids: [SRC-002, SRC-006]
  - id: CST-006
    statement: Gravity and Agent Platform implementation remain subject to their owning readiness and repository gates.
    source_ids: [SRC-005, SRC-006]
  - id: CST-007
    statement: Deprecated behavior has no compatibility guarantee after an approved replacement.
    source_ids: [SRC-005, SRC-006]
  - id: CST-008
    statement: Historical recovery refs are not accepted code until selectively reconciled through reviewed delivery.
    source_ids: [SRC-003, SRC-013]
  acceptance_criteria:
  - id: AC-001
    statement: The router selects exactly the earliest incomplete validated lifecycle state and committed route records agree with a fresh route run.
    evidence_expected: [tests/test_cli.sh, bin/verdify route --repo ., schema-valid route-decision.yaml]
  - id: AC-002
    statement: Evidence ingestion produces hashed collateral, a schema-valid registry entry, and queryable results before planning synthesis.
    evidence_expected: [bin/verdify northstar ingest-research, bin/verdify northstar evidence list, evidence registry validation]
  - id: AC-003
    statement: Approved lifecycle artifacts validate, derivative views agree with their canonical YAML, and the next role receives a complete traceable handoff.
    evidence_expected: [ruby scripts/validate-repo.rb, bin/verdify artifact validate, traceability audit]
  - id: AC-004
    statement: Lane creation rejects missing or stale contracts, duplicate leases, ambiguous worktrees, prohibited paths, and unsafe runtime namespaces.
    evidence_expected: [tests/test_cli.sh, lane inspect output, contract and lease validation]
  - id: AC-005
    statement: Controller state and release ledgers recover deterministically after interruption and identify exactly one next action.
    evidence_expected: [controller recovery tests, session ledger, status events, release transaction tests]
  - id: AC-006
    statement: Integration is blocked unless the exact implementation/evidence/review chain, required checks, critic decision, GitHub review state, and PR head reconcile.
    evidence_expected: [tests/test_lane_review_validator.rb, tests/test_pr_policy.sh, critic report, GitHub checks and review]
  - id: AC-007
    statement: CI installs, upgrades, corrupts, verifies, and publishes the one exact packed artifact only when version, source, integrity, provenance, tag, release, and ledger state agree.
    evidence_expected: [release preflight tests, packed-artifact tests, publish workflow, release ledger, npm and GitHub release probes]
  - id: AC-008
    statement: Platform execution uses declared capabilities, scoped credentials and namespaces, persistent session identity, and explicit unsupported-capability errors.
    evidence_expected: [platform readiness artifact, provider contract tests, session and authorization probes]
  - id: AC-009
    statement: Gravity API and MCP responses are versioned, tenant-scoped, read-only, citation-bearing, permission-checked, and readiness-approved.
    evidence_expected: [Gravity contract tests, platform/gravity readiness artifacts, citation and authorization probes]
  - id: AC-010
    statement: Orbit connector workflows prove identity, least privilege, classification, audit, retention, privacy, and human-control behavior before activation.
    evidence_expected: [Orbit connector contracts, permission tests, audit evidence, privacy and retention review]
  - id: AC-011
    statement: Every divergent work ref has a checked-in disposition and useful unpublished content is present on the accepted branch before redundant refs are removed.
    evidence_expected: [recovery ledger, Git ref audit, accepted-tree path and hash comparison, clean worktree audit]
  - id: AC-012
    statement: Source, packed, installed, upgraded, and vendored package shapes expose only documented commands and pass their declared validation surface.
    evidence_expected: [make test, tests/test_npm_install.sh, package verifier, consumer repository validation]
product:
  primary_users:
  - id: USR-001
    name: Jason
    needs:
    - Convert spoken and written intent into approved, durable, traceable project authority.
    - Delegate broad execution while retaining material product, security, production, and North Star control.
    - Review concrete outcomes and evidence rather than reconstruct hidden session context.
  - id: USR-002
    name: James
    needs:
    - Review exact current heads, release evidence, and customer-facing implications with clear authority boundaries.
    - Publish and support trusted package releases without ambiguous source or recovery state.
  - id: USR-003
    name: Repository controller
    needs:
    - Resume from GitHub and versioned artifacts, select one next lifecycle action, and coordinate bounded lanes without chat memory.
  - id: USR-004
    name: Lane worker or critic
    needs:
    - Receive immutable scope, owned paths, isolated resources, validation obligations, and unambiguous stop conditions.
    - Produce or assess evidence without inheriting controller, production, or approval authority.
  - id: USR-005
    name: Verdify consultant or internal consumer
    needs:
    - Install or vendor a versioned method package and apply the same governed lifecycle to a customer-scoped repository.
  problem_statement: Verdify needs one durable method layer that converts incomplete human intent and distributed project evidence into approved, executable, independently reviewed, releasable, and verifiable work across Skills, Agent Platform, Orbit, and Gravity without collapsing product authority, runtime authority, data authority, and delivery state into one opaque agent session.
  jobs_to_be_done:
  - Ingest transcripts, research, reviews, and live-state evidence into a queryable planning record.
  - Lock product and architecture intent, define the project end to end, and route one next lifecycle action.
  - Turn GitHub backlog problems into bounded contracts, isolated worktrees, supervised sessions, and reviewable pull requests.
  - Criticize exact heads, reconcile reviews and checks, publish exact artifacts, verify deployment separately, and capture outcome acceptance.
  - Coordinate Agent Platform execution, Orbit context, and Gravity evidence through owned interfaces rather than repository leakage.
  - Recover interrupted or unpublished work without losing knowledge or regressing accepted state.
  scope:
  - Lifecycle and standalone skills, their trigger rules, references, assets, and evaluation packs.
  - CLI routing, validation, evidence ingestion, sprint and lane coordination, leases, prompts, and compliance assessment.
  - Canonical .agent-workflow schemas and approved project/delivery artifacts.
  - GitHub-native issue, PR, check, review, release, deployment, and reconciliation conventions.
  - Package build, install, vendoring, release identity, provenance, rollback, and recovery contracts.
  - Cross-project PilotProject ownership and interfaces for Agent Platform, Orbit, and Gravity.
  - Internal-first use with later customer-consulting reuse under the same typed authority model.
  non_goals:
  - Owning Agent Platform runtime implementation, Orbit connector implementation, or Gravity evidence-service implementation in this repository.
  - Replacing GitHub, npm, target-repository GitOps, or owning-project data stores without a later approved migration.
  - Maintaining deprecated compatibility shims after an approved replacement.
  - Granting autonomous agents unbounded credentials, production authority, product authority, or approval authority.
  - Treating merge, local tests, or narrative confidence as proof of deployment or user outcome.
  success_metrics:
  - id: MET-001
    measure: Canonical package integrity
    target: Repository validation, manifest verification, full tests, packed install tests, and declared skill/schema counts agree on every accepted head.
  - id: MET-002
    measure: Lifecycle determinism
    target: Every validated repository state produces one earliest next skill/mode and no protected stage is skipped without an authorized recorded gate.
  - id: MET-003
    measure: Delivery traceability
    target: Every integrated implementation change links an issue, approved contract, lease/session, exact head, closeout, critic decision, checks, and PR outcome.
  - id: MET-004
    measure: Release trust
    target: Every published version maps one-to-one to a tested tarball, source commit, integrity record, provenance statement, tag, GitHub release, and completed release ledger.
  - id: MET-005
    measure: Recovery safety
    target: Interrupted controller and publication transactions resume without duplicate release records, ambiguous ownership, or lost accepted work.
  - id: MET-006
    measure: Review quality
    target: Required exact-head criticism and GitHub review evidence are current, nonempty, identity-valid, and resolved before integration.
  - id: MET-007
    measure: Cross-project contract compliance
    target: Agent Platform, Orbit, and Gravity exchanges use versioned owned interfaces with scoped identity, citations where applicable, and readiness evidence.
  - id: MET-008
    measure: Cleanup completeness
    target: All divergent local and remote work refs have checked-in dispositions; accepted content is on main; surviving worktrees are clean and intentional.
  risks:
  - Lifecycle rigor can become ceremonial if artifacts are accepted without current evidence or if emergency bypasses are normalized.
  - Exact-head review can deadlock when only the PR author is available; delivery-control work must provide effective authorized reviewers without weakening independence.
  - Release automation can create duplicate invalid promotions until version and transaction state become first-class inputs.
  - Cross-project scope can drift unless every gap remains in its owning repository and interface contracts remain versioned.
  - Governed personal context creates significant privacy and retention risk if connector identity or classification boundaries are vague.
  - Historical recovery can reintroduce obsolete architecture if exact refs are merged wholesale rather than selectively reconciled.
design:
  surfaces:
  - id: SURF-001
    type: skill
    actor: Human-triggered or routed agent session
    purpose: Execute one bounded lifecycle or standalone workflow with progressive disclosure and explicit stop conditions.
    inputs: [user intent, repository state, GitHub state, approved artifacts, evidence]
    outputs: [canonical artifacts, issue or PR actions, validation evidence, handoff]
    requirement_ids: [FR-001, FR-002, FR-003]
  - id: SURF-002
    type: cli
    actor: Controller, planner, worker, critic, or operator
    purpose: Route, validate, ingest evidence, assess compliance, manage sprints and leases, and compile immutable prompts.
    inputs: [repository path, command arguments, Git refs, artifact files]
    outputs: [structured decisions, validations, leases, worktrees, prompt manifests, errors]
    requirement_ids: [FR-001, FR-002, FR-004, FR-005]
  - id: SURF-003
    type: artifact
    actor: Lifecycle roles and reviewers
    purpose: Persist approved intent, scope, decisions, state, evidence, gaps, and handoffs outside conversation history.
    inputs: [evidence IDs, decisions, GitHub links, exact SHAs, validation results]
    outputs: [schema-valid YAML and aligned Markdown views]
    requirement_ids: [FR-002, FR-003, FR-005, NFR-001]
  - id: SURF-004
    type: github_control_plane
    actor: Maintainer, controller, worker, critic, release operator
    purpose: Own backlog, proposed code, checks, current-head reviews, accepted merges, releases, and durable coordination.
    inputs: [issues, branches, commits, PR metadata, reviews, checks, releases]
    outputs: [authoritative delivery state and immutable links]
    requirement_ids: [FR-004, FR-006, FR-007, NFR-002]
  - id: SURF-005
    type: agent_platform_provider
    actor: Verdify controller or orchestrator
    purpose: Negotiate worker/session capabilities and dispatch isolated execution without assuming a specific runtime adapter.
    inputs: [capability request, scoped prompt, repo/worktree identity, resource policy]
    outputs: [session ID, status events, terminal or MCP handles, evidence references, unsupported-capability error]
    requirement_ids: [FR-005, FR-008, NFR-003]
  - id: SURF-006
    type: gravity_api_mcp
    actor: Orbit, Verdify, or an authorized evidence consumer
    purpose: Query versioned tenant-scoped evidence and citations without granting write access to Gravity internals.
    inputs: [tenant identity, query, filters, pagination, citation request]
    outputs: [versioned result, citations, provenance, authorization or availability error]
    requirement_ids: [FR-009, NFR-003]
  - id: SURF-007
    type: orbit_connector_plane
    actor: Jason or an authorized assistant workflow
    purpose: Read and synthesize governed personal and engineering context under least-privilege human controls.
    inputs: [connector identity, authorized scope, query or scheduled workflow, classification policy]
    outputs: [cited brief or action proposal, audit event, approval request, denied-scope error]
    requirement_ids: [FR-010, NFR-004]
  - id: SURF-008
    type: package_release
    actor: Release automation and authorized release approver
    purpose: Build, test, publish, tag, release, recover, and verify one exact package artifact.
    inputs: [dev revision, new version, exact tarball, checks, approval, release ledger]
    outputs: [npm package, provenance, tag, GitHub release, completed or resumable transaction]
    requirement_ids: [FR-007, FR-012, NFR-009]
  - id: SURF-009
    type: review_inbox
    actor: Human reviewer or outcome owner
    purpose: Present exact user stories, environments, human test steps, risks, evidence, and approval actions without hidden chat context.
    inputs: [critic report, checks, deployment evidence, review packet]
    outputs: [approval, changes requested, rejected outcome, accepted outcome]
    requirement_ids: [FR-006, NFR-001, NFR-005]
  - id: SURF-010
    type: observability_support
    actor: Operator, controller, or deployment verifier
    purpose: Distinguish repository, CI, deployment, runtime, and outcome state and provide actionable diagnostics.
    inputs: [logs, metrics, traces, events, revisions, health probes, support request]
    outputs: [diagnostic packet, status event, incident gate, rollback or remediation action]
    requirement_ids: [FR-005, NFR-005, NFR-009]
  flows:
  - id: FLOW-001
    name: Evidence to approved delivery authority
    steps:
    - Register transcript, research, review, and live-state sources with hashes and trust labels.
    - Synthesize and lock product and architecture North Stars under Jason's authority.
    - Complete project definition and architecture contracts without inventing unresolved intent.
    - Reconcile backlog and strategy, then select an approved sprint transaction.
    acceptance_ids: [AC-001, AC-002, AC-003]
  - id: FLOW-002
    name: Issue to integrated lane outcome
    steps:
    - Select one ready GitHub issue and approve one executable lane contract.
    - Create one leased worktree and dispatch one scoped worker session.
    - Commit implementation, then evidence-only closeout, then obtain fresh exact-head criticism.
    - Reconcile checks, review state, issue state, and PR head before integration to dev.
    acceptance_ids: [AC-004, AC-005, AC-006]
  - id: FLOW-003
    name: Dev to trusted package release
    steps:
    - Build one exact tarball from a new-version dev revision.
    - Exercise install, reinstall, upgrade, corruption, rollback, and declared commands against that artifact.
    - Obtain release approval and merge only the generated dev-to-main promotion.
    - Resume or complete npm publication, provenance, tag, release, and ledger reconciliation.
    acceptance_ids: [AC-007, AC-012]
  - id: FLOW-004
    name: Four-project pilot coordination
    steps:
    - Verdify Skills produces method and planning contracts.
    - Agent Platform provides capability-negotiated execution and durable session evidence.
    - Orbit provides governed context and consumes cited Gravity evidence.
    - Gravity exposes versioned cited evidence through read-only HTTP and MCP contracts.
    - Readiness, security, deployment, and outcome owners approve their respective boundaries.
    acceptance_ids: [AC-008, AC-009, AC-010]
  - id: FLOW-005
    name: Interrupted and unpublished work recovery
    steps:
    - Inventory worktrees, branches, commits, PRs, issues, and remote refs from live authority.
    - Classify every ref as accepted, superseded, archived, recoverable, blocked, or redundant.
    - Port useful content to the current baseline through issue-linked reviewed delivery.
    - Record a checked-in disposition and remove redundant refs only after accepted-tree verification.
    acceptance_ids: [AC-011]
  human_gates:
  - Jason approves North Star lock and material project intent.
  - An authorized non-worker reviewer or deterministic equivalent approves current-head integration evidence.
  - Jason or James approves a release promotion after exact-artifact checks pass.
  - Security, production, destructive, privileged-dependency, scope-change, and readiness decisions require their typed owners.
  - Outcome owners accept deployed user outcomes separately from merge and deployment success.
  error_states:
  - Repository, GitHub, artifact, or deployment authorities contradict each other.
  - A route input or protected artifact is missing, stale, schema-invalid, or falsely self-approved.
  - A worker lacks a valid lease, owns the wrong worktree, touches prohibited paths, or requests privileged credentials.
  - Review evidence is empty, stale, unresolved, authored by the worker, or bound to another head.
  - A release version already exists, the packed artifact differs from the tested artifact, or publication is partially complete without a resumable ledger.
  - A provider, connector, or evidence service lacks a required capability, identity, tenant boundary, citation, or readiness approval.
  - Recovery would overwrite newer accepted state or delete the last retrievable copy of useful work.
