- id: SRC-008
  type: northstar_plan
  location: .agent-workflow/northstar/northstar-plan.yaml
  summary: Provides approved goals, requirements, stories, milestones, risks, issue routing, and cross-project traceability for iteration 25.
  evidence_status: verified
