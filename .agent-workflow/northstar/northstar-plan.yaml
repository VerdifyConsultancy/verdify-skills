gate_recommendations:
- type: northstar
  owner: Jason
  reason: "Approved. Jason separately directed the controller to fix #72 and lock iteration 25; the protected gate and structured approvals record that decision."
  blocking: false
- type: gravity_readiness
  owner: Gravity owner and release approver
  reason: Gravity is an active pilot; the gate applies to trusted cross-project consumption and release promotion until current capability state, citations, API/MCP parity, authorization, and live evidence are proven.
  blocking: false
- type: platform_security_authority
  owner: Jason, platform owner, and security owner
  reason: Broad domain-agent access, credential validation, and self-service storage mount changes require an owning implementation gate before those actions; this recommendation is nonblocking for the approved North Star and project-definition discovery.
  blocking: false
- type: fleet_bootstrap_readiness
  owner: Jason and platform owner
  reason: Running bootstrap across 30+ repo controllers requires an owning readiness gate after namespace naming, inventory shape, safe credential probes, and controller recovery behavior are specified; this recommendation is nonblocking for the approved North Star and project-definition discovery.
  blocking: false
- type: package_publication_trust
  owner: Jason or James
  reason: Publication and installation require a separate owning release gate proving exact packed-artifact tests, trusted validation, atomic promotion, rollback, and no preexisting-target execution; this recommendation is nonblocking for the approved North Star and project-definition discovery.
  blocking: false
- type: orbit_connector_security
  owner: Jason, Orbit owner, and security/privacy owner
  reason: Broad personal and enterprise connectors require a separate owning security gate before fleet-actuation trust, proving principal separation or policy mediation, approved encrypted data storage, source-aware governance, and negative authorization tests; this recommendation is nonblocking for the approved North Star and project-definition discovery.
  blocking: false
