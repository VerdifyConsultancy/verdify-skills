conflicts:
- id: CON-001
  statement: Wave branch proposals conflict with current one issue/lane/branch/worktree/session/PR policy.
  existing_authority: COMMON_OPERATING_CONTRACT.md
  proposed_direction: Treat wave as the CI/CD deployment and review unit; defer exact branch/session/worktree naming to release architecture before automation is encoded.
  blocking: false
- id: CON-002
  statement: Earlier planning described Gravity implementation as blocked, while the current restarted repository is actively developed and deployed.
  existing_authority: Earlier Verdify Skills readiness language and Gravity extraction assumptions.
  proposed_direction: Treat Gravity as an active pilot; keep readiness gates only for trusted integration, capability claims, and release promotion.
  blocking: false
- id: CON-003
  statement: The previous Agent Delivery OS framing is too narrow for Jason's updated source-control, CI/CD, pipeline, k3s, and knowledge operating-plane intent.
  existing_authority: Iteration 7 North Star wording
  proposed_direction: Reframe the product boundary around the self-hosted software-and-knowledge operating plane while preserving the same final-lock gate.
  blocking: false
- id: CON-004
  statement: Older Sunshine-to-Gravity extraction plans could conflict with the restarted Gravity repository and live deployment.
  existing_authority: Historical Sunshine evidence and prior Gravity planning material.
  proposed_direction: Make current Gravity source, accepted decisions, backlog, and runtime authoritative; use Sunshine only as optional historical evidence.
  blocking: false
- id: CON-005
  statement: Broad infrastructure-domain access and repo-controller self-discovery are in tension with existing least-privilege and raw-secret-exclusion rules.
  existing_authority: COMMON_OPERATING_CONTRACT.md, ARQ-003, NSR-023, and secret-injection evidence.
  proposed_direction: Allow broader access only for named infrastructure domain agents with owner, scope, audit, rollback, and approval gates; keep repo agents namespace-scoped by default.
  blocking: false
- id: CON-006
  statement: Repo-controller self-service storage, route, or base-image changes could bypass platform ownership if implemented as local shell actions.
  existing_authority: Platform-readiness, environment GitOps, source-control authority, and GitHub PR/review controls.
  proposed_direction: Treat storage mounts, routes, namespace creation, and base-image changes as platform control requests or PR-reviewed desired-state changes.
  blocking: false
- id: CON-007
  statement: Existing pilot North Stars assign outer-loop authority to Orbit or reduce Gravity to a subordinate pilot cell, conflicting with the four-co-equal-pilot model.
  existing_authority: Locked Agent Platform and Orbit North Star artifacts plus related ADR language.
  proposed_direction: Route review feedback through owning-repository North Star loops and establish the root planner as portfolio outer loop while preserving pilot ownership.
  blocking: false
- id: CON-008
  statement: Orbit's intended broad personal and enterprise information scope conflicts with its current shared engineering-actuation trust domain and raw private material in source Git.
  existing_authority: Current Orbit repo-pod runtime, credentials home, Kubernetes authority, and tracked private data.
  proposed_direction: Separate principals or use a policy broker, move raw material to approved encrypted storage, and enforce source-aware connector governance before broad activation.
  blocking: false
- id: CON-009
  statement: The desired root-planner dispatch model conflicts with the live Agent Platform MCP surface, which exposes neither a root-planner project contract nor a supported semantic worker operation.
  existing_authority: Live Agent Platform MCP capability list and current platform backlog.
  proposed_direction: Implement versioned capability discovery and supported dispatch with typed degradation; remove reliance on retired adapters.
  blocking: false
- id: CON-010
  statement: The requirement for trusted atomic publication conflicts with the current installer and release path identified by the adversarial review.
  existing_authority: Current package scripts, installer behavior, and release workflow.
  proposed_direction: Patch the unsafe trust boundary first, then implement exact-pack validation, protected development integration, release-only main promotion, atomic install, and rollback evidence.
  blocking: false
- id: CON-011
  statement: The approved iteration-25 North Star and repository operating contract make GitHub the delivery control plane and explicitly exclude replacing it, while the July 27 directive requires GitHub to become non-load-bearing.
  existing_authority: Iteration-25 approved North Star, COMMON_OPERATING_CONTRACT.md, config/authority-matrix.yaml, and repository AGENTS.md.
  proposed_direction: Keep iteration 25 authoritative until Jason locks iteration 26; then update every source-control, backlog, review, status, release, receipt, and authority contract atomically around Forgejo primary authority and GitHub mirroring.
  blocking: true
- id: CON-012
  statement: Verdify Skills is a package without a runtime image, while the current Agent Fleet repository CI schema requires at least one image and the acceptance criteria require a real non-production deployment.
  existing_authority: Current Verdify package model and Agent Fleet `.agent-fleet/ci.yaml` schema.
  proposed_direction: Add a first-class package artifact workflow and a minimal digest-pinned consumer image or workload whose sole purpose is installing and exercising the exact package subject under Argo CD.
  blocking: true
- id: CON-013
  statement: Current generic WorkflowTemplates and GitOps sources reference GitHub and public images or charts, conflicting with the clean-node no-public-egress requirement.
  existing_authority: Current Agent Fleet source and deployed chart/source topology.
  proposed_direction: Establish controlled mirror-refresh workflows and immutable internal references before claiming local reproducibility; retain every unresolved origin in the exception ledger.
  blocking: true
- id: CON-014
  statement: The environment briefing names jvallery/agents GitHub issues as the global work source of truth, while iteration 26 proposes an internal provider as the load-bearing repository and portfolio-work authority.
  existing_authority: Managed Agent Fleet operating-environment briefing and jvallery/agents#3044.
  proposed_direction: "Preserve #3044 as the pre-cutover global record, define provider-neutral work IDs and portfolio metadata, migrate authority only through the attended gate, and update the managed operating contract atomically after proof."
  blocking: true
- id: CON-015
  statement: A Git push mirror preserves commits and refs but not issues, pull requests, approvals, required statuses, comments, projects, audit events, or identity state.
  existing_authority: Forgejo mirror capability and current GitHub governance records.
  proposed_direction: Treat GitHub as an output mirror, not failback; export and map governance metadata separately and restore the internal authority from coordinated snapshots.
  blocking: true
- id: CON-016
  statement: "Closed issues #120 and #121 already completed exact-package trust and protected development integration contracts, while the migration introduces a broader release and authority graph."
  existing_authority: "VerdifyConsultancy/verdify-skills#120 and #121."
  proposed_direction: Record their security outcomes as completed absorbed predecessor contracts of NSM-011 and NSM-012; do not redispatch duplicate or contradictory lanes.
  blocking: true
