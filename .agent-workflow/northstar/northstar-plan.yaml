goals:
- id: NSG-001
  statement: Turn registered research, ideation, transcript input, feedback, and requirements into durable North Star planning artifacts before implementation planning.
  priority: must
  source_ids: [SRC-002, SRC-003, SRC-005]
  success_signals:
  - A validated North Star loop record exists.
  - Router sends projects with draft North Star artifacts back to `northstar-planning` and `artifact-loop`.
- id: NSG-002
  statement: Keep product intent and architecture inputs separate but traceably linked.
  priority: must
  source_ids: [SRC-002, SRC-006]
  success_signals:
  - Architecture principles link to goals and requirements.
  - Product requirements explain user or operator value.
- id: NSG-003
  statement: Preserve Gravity readiness and promotion gates around the active in-flight Gravity pilot without misrepresenting the project as blocked, legacy, or not yet implemented.
  priority: must
  source_ids: [SRC-002, SRC-003, SRC-011, SRC-012, SRC-015, SRC-016, SRC-038, SRC-041]
  success_signals:
  - Gravity readiness remains a gate for trusted cross-project consumption and release promotion.
  - Current Gravity repository and live runtime evidence are treated as the active source of truth.
- id: NSG-004
  statement: Preserve CI/CD based wave deployment as a core delivery planning requirement.
  priority: must
  source_ids: [SRC-002, SRC-007, SRC-018, SRC-019, SRC-021, SRC-026]
  success_signals:
  - Wave plans require CI evidence, preview or review deployment, promotion path, rollback evidence, and traceability before review-ready status.
  - Release architecture resolves exact branch/session/worktree/wave naming before automation is encoded.
- id: NSG-005
  statement: Add a repeatable North Star interview loop for human priorities, decisions, and architecture tradeoffs before final lock approval.
  priority: must
  source_ids: [SRC-008]
  success_signals:
  - '`northstar-interview` produces a durable question packet with P0/P1/P2 priorities, proposed defaults, options, tradeoffs, affected IDs, and evidence references.'
  - 'Interview answers route back to `northstar-planning` without being mistaken for final approval.'
- id: NSG-006
  statement: Reframe the owned-IP priority as a self-hosted software-and-knowledge operating plane spanning source control, CI/CD, pipelines, k3s, agents, and evidence workflows.
  priority: must
  source_ids: [SRC-009, SRC-011, SRC-014, SRC-017]
  success_signals:
  - Platform readiness evaluates source-control authority, CI/CD, k3s app state, MCP/API controls, observability, and rollback as one integrated system.
  - The North Star no longer describes the product only as an Agent Delivery OS.
- id: NSG-007
  statement: Treat the current restarted Gravity repository as the active source of truth while retaining Sunshine Club only as optional historical reuse evidence.
  priority: must
  source_ids: [SRC-009, SRC-012, SRC-013, SRC-032, SRC-038, SRC-041]
  success_signals:
  - Gravity planning consumes current repository, runtime, API, MCP, issue, and deployment evidence before older extraction material.
  - Historical Sunshine reuse does not override current Gravity architecture or active backlog authority.
- id: NSG-008
  statement: Make self-improving skills evidence-backed and proposal-only until the configured approval path accepts a change.
  priority: should
  source_ids: [SRC-010, SRC-020, SRC-033]
  success_signals:
  - Learning-capture proposals cite source evidence, verification, proposed destination, risk class, and approval requirement.
  - Proposed lessons route to content, context files, slash commands, skills, hooks, tool/CLI fixes, config, backlog, or no-op.
- id: NSG-009
  statement: Require loop-readiness checks before recurring agent loops are scheduled or delegated.
  priority: must
  source_ids: [SRC-010, SRC-020, SRC-033]
  success_signals:
  - Candidate loops document recurrence, verifier, state record, stop condition, budget, objective done criteria, and one reliable manual run.
  - Loop metrics include proposal acceptance rate or cost per accepted change where cost is material.
- id: NSG-010
  statement: Expose the end-to-end SDLC through a small capability-negotiated workflow facade while treating OpenClaw and Hermes as optional runtime adapters rather than mandatory control authorities.
  priority: must
  source_ids: [SRC-008, SRC-014, SRC-022, SRC-024, SRC-025, SRC-038, SRC-040]
  success_signals:
  - Workflow facades map ideation, research, planning, definition, architecture, backlog, readiness, wave planning, lane work, review, release, production proof, and learning capture to delegated Verdify skills.
  - Each workflow names configured-provider primitives, mirror state, durable artifacts, human gates, stop conditions, and evidence needed before advancing.
- id: NSG-011
  statement: Make review-ready status a validated evidence packet rather than an unstructured claim.
  priority: must
  source_ids: [SRC-021, SRC-025, SRC-027]
  success_signals:
  - '`schemas/review-inbox-packet.schema.yaml` validates the review inbox packet contract.'
  - Review packets record PR/MR identity, exact head SHA, checks, preview/review deployment, telemetry, security, rollback, evidence completeness, recommendation, and feedback route.
- id: NSG-012
  statement: Make deployment-affecting waves validate a release plan before worker dispatch.
  priority: must
  source_ids: [SRC-021, SRC-026]
  success_signals:
  - '`schemas/wave-release-plan.schema.yaml` validates branch/merge model, checks, workflows, environments, GitOps desired state, deployment strategy, observability, rollback, release health, and review handoff.'
  - Sprint planning treats the wave release plan as part of the plan approval transaction when deployment or preview evidence is in scope.
- id: NSG-013
  statement: Make observability diagnostics a validated evidence packet for review, release, readiness, incident, and feedback decisions.
  priority: must
  source_ids: [SRC-027]
  success_signals:
  - '`schemas/observability-diagnostic-packet.schema.yaml` validates correlation, hypotheses, telemetry links, signal assessments, runtime checks, deployment markers, findings, missing instrumentation, recommendation, and feedback route.'
  - Review and release decisions distinguish runtime health evidence from CI/check success.
- id: NSG-014
  statement: Make session and wave history reconstructable from an append-oriented ledger.
  priority: must
  source_ids: [SRC-028]
  success_signals:
  - '`schemas/session-ledger.schema.yaml` validates parent/child session graph, event envelope fields, correlation IDs, artifact/evidence/external refs, checksums, exceptions, and handoff.'
  - Controller reconstruction does not rely on hidden chat history.
- id: NSG-015
  statement: Make Agent Platform MCP/API operations explicit request, authorization, policy, target, and evidence records before execution.
  priority: must
  source_ids: [SRC-029]
  success_signals:
  - '`schemas/agent-platform-control-request.schema.yaml` validates operation identity, requester, target, authorization, policy verdict, mutation level, expected effects, result refs, review gate, and handoff.'
  - Protected or production-affecting operations remain blocked until the configured authorization, policy, human review, rollback, and evidence requirements are satisfied.
- id: NSG-016
  statement: Make source/backlog sync a typed reconciliation record that names the configured authority and mirror roles; keep the current GitHub-specific schema valid through coexistence.
  priority: must
  source_ids: [SRC-030]
  success_signals:
  - '`schemas/github-backlog-sync.schema.yaml` validates source authority, snapshot freshness, issue findings, PR findings, lane findings, delivery findings, actions, and handoff.'
  - State-of-union and sprint orchestration distinguish the configured provider authority, output mirrors, and local snapshots or strategy notes.
- id: NSG-017
  statement: Make environment GitOps reconciliation a typed readiness and release evidence record before environment-dependent work advances.
  priority: must
  source_ids: [SRC-031]
  success_signals:
  - '`schemas/environment-gitops-reconciliation.schema.yaml` validates desired state, observed controller state, namespace controls, deployment evidence, runtime health, drift, remediation, review, and handoff.'
  - Platform readiness, wave planning, and release verification do not infer environment health from merge or CI success alone.
- id: NSG-018
  statement: Make current Gravity capability, readiness, and evidence-interface reconciliation typed before cross-project consumption or release promotion.
  priority: must
  source_ids: [SRC-032, SRC-013, SRC-009, SRC-038, SRC-041]
  success_signals:
  - '`schemas/gravity-core-extraction-plan.schema.yaml` validates source-object inventory, reuse matrix, pack assumptions, contracts, migration risks, pilot criteria, readiness updates, handoff, and approval.'
  - Gravity readiness distinguishes implemented, deployed, exposed, integrated, cited, and release-verified capability states.
- id: NSG-019
  statement: Make repo-controller bootstrap and self-discovery a standard fleet workflow before broad autonomous rollout.
  priority: must
  source_ids: [SRC-034, SRC-011, SRC-030, SRC-031]
  success_signals:
  - A repo-bootstrap workflow can produce a standard inventory, AGENTS.md update, namespace map, credential-reference validation summary, storage mount inventory, package recommendations, gap backlog, and PR proposal.
  - Bootstrap output routes through configured-provider work/change records and `.agent-workflow` artifacts rather than private controller memory.
- id: NSG-020
  statement: Standardize repo, namespace, environment, storage, route, and credential boundaries across the controller fleet.
  priority: must
  source_ids: [SRC-034, SRC-016, SRC-031]
  success_signals:
  - Platform readiness defines owner/repo/environment namespace naming, scoped mounts, route propagation, domain-agent authority, and secret-reference validation without raw secret exposure.
  - Repo agents remain least-privilege by default while approved infrastructure domain agents have explicit owner, scope, audit, and gate records.
- id: NSG-021
  statement: Make controller loops observable, recoverable, and measurable at fleet scale.
  priority: must
  source_ids: [SRC-034, SRC-027, SRC-028]
  success_signals:
  - Grafana/Prometheus dashboards show pod availability, controller availability, loop counts, stop reasons, ledger events, resource pressure, and cost or token signals where material.
  - Alertmanager or equivalent alerts can route to the responsible controller or recovery path with durable outstanding-work rehydration.
- id: NSG-022
  statement: Make Orbit the governed personal-assistant and engineering-chief-of-staff information layer across authorized email, calendar, enterprise documents, transcripts, notes, conversations, meetings, and engineering state.
  priority: must
  source_ids: [SRC-034, SRC-014, SRC-022, SRC-038, SRC-040]
  success_signals:
  - Orbit can ingest and cite authorized personal, enterprise, and engineering sources through a governed connector plane.
  - Personal-context access is separated from fleet actuation with explicit privacy, tenancy, retention, provenance, and human-control boundaries.
- id: NSG-023
  statement: Give every repo-associated controller or long-lived agent a typed scope, ownership, responsibility, authority, runtime, and escalation charter tied to repo discovery.
  priority: must
  source_ids: [SRC-034, SRC-036]
  success_signals:
  - '`schemas/repo-agent-scope.schema.yaml` validates the repo-agent scope contract.'
  - Repo hygiene/bootstrap can create `.agent-workflow/hygiene/repo-agent-scope.yaml` from a reusable template before a controller claims operational ownership.
- id: NSG-024
  statement: Operate Verdify Skills, Agent Platform, Orbit, and Gravity as four co-equal active pilots connected by one shared planning and evidence model.
  priority: must
  source_ids: [SRC-037, SRC-038, SRC-039, SRC-040, SRC-041]
  success_signals:
  - Each pilot retains product, backlog, runtime, deployment, and outcome ownership.
  - Cross-project dependencies and gates are represented through versioned contracts and owning-repository work records in the configured authority, with mirror refs during coexistence.
- id: NSG-025
  statement: Make Verdify Skills an internal-first, minimal, trusted planning and agent-method layer with no backward-compatibility burden.
  priority: must
  source_ids: [SRC-037, SRC-038]
  success_signals:
  - Deprecated capabilities are removed instead of carried as compatibility shims.
  - Distribution defaults to internal use while keeping a future open-source decision possible.
- id: NSG-026
  statement: Make the root planning agent the durable portfolio outer loop for shared vision, cross-project prioritization, dependencies, gates, evidence, and handoffs.
  priority: must
  source_ids: [SRC-038, SRC-039]
  success_signals:
  - Root-planner authority is explicit and does not displace pilot ownership or the configured source/backlog authority.
  - Agent Platform exposes supported capability discovery and dispatch rather than requiring hard-coded adapters.
- id: NSG-027
  statement: Publish and install Verdify Skills only through a trusted, atomic, recoverable package transaction while keeping pre-lock safety work narrowly scoped.
  priority: must
  source_ids: [SRC-037, SRC-038]
  success_signals:
  - The exact packed artifact is validated before publication and is the artifact installed.
  - Installation stages, verifies, atomically promotes, and can roll back without executing preexisting target content.
- id: NSG-028
  statement: Make Gravity's first shared consumer surface a versioned tenant-scoped read-only HTTP API with an MCP adapter and resolvable evidence citations.
  priority: must
  source_ids: [SRC-038, SRC-041]
  success_signals:
  - API and MCP return authorization-consistent results with equivalent evidence references.
  - Capability state distinguishes implementation, deployment, exposure, integration, and release verification.
- id: NSG-029
  statement: Reuse the proven self-building platform for customer consulting projects without creating a second lifecycle or transferring internal/private authority.
  priority: must
  source_ids: [SRC-038]
  success_signals:
  - A customer repository can adopt the same project-owned planning, PilotProject, capability, evidence, delivery, review, deployment, and outcome contracts.
  - Customer identity, tenancy, data, credentials, and approvals remain scoped and do not inherit Jason-private Orbit context.
- id: NSG-030
  statement: Treat Jason's complete ten-answer July 9 decision set as one locked planning authority and deliver its first integrated outcome as soon as safely possible without an artificial deadline.
  priority: must
  source_ids: [SRC-037, SRC-038, SRC-039, SRC-040, SRC-041, SRC-042]
  success_signals:
  - Every July 9 adversarial-review recommendation is the planning default unless new evidence and explicit authority approve an exception.
  - Pre-lock safety work stays narrow while exact-artifact publication and installation use trusted staging, integrity and conflict checks, atomic promotion, and rollback.
  - Verdify Skills remains proprietary and internal-first; possible future open source or reference use creates no current community-growth objective. The exact public-rights, off-platform/package-use, and contributor-intake contract is a proposed iteration-26 delta under NSR-047 and NSQ-017, not part of the locked July 9 decision set.
  - No backwards compatibility is promised; deprecated or redundant capability is deleted after atomic consumer convergence.
  - Verdify Skills, Agent Platform, Orbit, and Gravity operate as four co-equal active pilots under the root planning outer loop while retaining project-local authority.
  - Jason records North Star lock; Jason or James may approve a release; James is the npm publisher; independent PR review remains separately evidenced.
  - The restarted current Gravity repository and runtime are source truth; the prior instance is retired history.
  - Gravity exposes a versioned tenant-scoped read-only HTTP evidence API plus consumer MCP adapter with equivalent authorization, resolvable citations, typed denials, durability, health, identity, and audit.
  - Orbit spans authorized email, calendars, enterprise documents, transcripts, notes, conversations, meetings, and engineering context through governed connectors separated from fleet actuation.
  - Delivery has no artificial calendar deadline, optimizes for the earliest safely complete four-project self-building slice, files verified gaps in owning repositories, and then supports customer consulting through the same contracts.
- id: NSG-031
  statement: Make Verdify Skills build, validation, review, promotion, package distribution, non-production acceptance, rollback, and recovery reproducible on the local k3s platform without any load-bearing GitHub Actions, GitHub-hosted runner, public package registry, public release asset, or GitHub-only authority.
  priority: must
  source_ids: [SRC-043, SRC-044, SRC-045, SRC-046, SRC-050, SRC-051]
  success_signals:
  - An internal Git/review/status authority can receive source and events, enforce equivalent protected-branch and independent-review policy, and remain usable while GitHub is unavailable.
  - Argo Events and Argo Workflows execute repository-owned validation, policy, build, package, provenance, promotion, rollback, and recovery contracts from immutable local dependencies.
  - Zot stores the exact immutable package artifact plus checksums, provenance, SBOM, signature, and attestations, and GitOps alone promotes its digest into a dedicated non-production consumer proof.
  - A cold-node run with public egress denied succeeds from documented local mirrors and caches, and a complete exception ledger names every remaining external dependency.
  - GitHub Actions and public publication remain coexistence mirrors until a human-attended cutover proves parity, rollback, post-cutover durability, and explicit retirement authority.
requirements:
- id: NSR-005
  kind: functional
  statement: The CLI must ingest research files into `.agent-workflow/northstar/collateral/`, update `.agent-workflow/northstar/evidence-registry.yaml`, and expose stable `northstar://evidence/<id>` references.
  source_ids: [SRC-005]
  acceptance_signals:
  - '`bin/verdify northstar ingest-research` creates an evidence item and registry entry.'
  - '`bin/verdify northstar evidence list` returns matching registered evidence.'
- id: NSR-006
  kind: functional
  statement: The North Star planning loop must create and iterate `.agent-workflow/northstar/NORTHSTAR_PRODUCT.md`, `.agent-workflow/northstar/NORTHSTAR_ARCHITECTURE.md`, and `.agent-workflow/northstar/northstar-artifacts.yaml` through evidence, research, questions, design, and feedback until final lock approval is recorded.
  source_ids: [SRC-006, SRC-007]
  acceptance_signals:
  - '`skills/northstar-planning/SKILL.md` defines `artifact-loop`, `human-review`, and `signoff` modes.'
  - '`schemas/northstar-artifacts.schema.yaml` validates the loop status, questions, cross-links, review state, and approvals.'
  - Router does not proceed to downstream lifecycle skills when the paired North Star artifacts are missing or unsigned.
- id: NSR-001
  kind: functional
  statement: The North Star planning skill must synthesize source evidence into goals, requirements, user stories, architecture principles, milestones, risks, conflicts, proposed issues, research proposals, and final lock approval state.
  source_ids: [SRC-002, SRC-003, SRC-007]
  acceptance_signals:
  - '`skills/northstar-planning/SKILL.md` defines the loop modes.'
  - '`schemas/northstar-plan.schema.yaml` validates the artifact.'
- id: NSR-002
  kind: functional
  statement: The router must stop at `northstar-research-ingest` for unregistered research and at `northstar-planning` after evidence is routed or registered before project definition consumes the plan.
  source_ids: [SRC-003, SRC-005]
  acceptance_signals:
  - '`bin/verdify route` returns `northstar-research-ingest` when raw research exists but no matching evidence registry entry exists.'
  - '`bin/verdify route` returns `northstar-planning` when intake is routed but North Star planning is missing or draft.'
- id: NSR-003
  kind: non_functional
  statement: Every planning record must trace to evidence or remain marked as a question, idea, risk, or proposed change.
  source_ids: [SRC-002]
  acceptance_signals:
  - Goals, requirements, stories, and principles include source IDs.
- id: NSR-004
  kind: constraint
  statement: North Star planning must not mark `DESIGN_COMMITTED`, edit protected artifacts, start implementation, or hand off authority to downstream lifecycle skills until final lock approval is recorded.
  source_ids: [SRC-002, SRC-003, SRC-042]
  acceptance_signals:
  - Ordinary evidence, research, questions, design proposals, and review feedback continue through the loop without a human gate.
  - Final lock approval is the only North Star planning gate for advancing to the next milestone.
  - Jason's iteration-25 approval is recorded in the structured plan, loop record, and North Star gate before downstream handoff.
- id: NSR-007
  kind: functional
  statement: The North Star loop must support a reusable Q&A/interview skill that prepares prioritized questions, proposed defaults, options, tradeoffs, affected IDs, evidence references, and answer-capture rules.
  source_ids: [SRC-008]
  acceptance_signals:
  - '`skills/northstar-interview/SKILL.md` defines review, question-pack, answer-capture, and feedback-routing behavior.'
  - '`.agent-workflow/northstar/NORTHSTAR_INTERVIEW.md` exists and contains P0/P1/P2 questions.'
  - Interview answers route to `northstar-planning` / `review-feedback` or `artifact-loop` and do not self-record final approval.
- id: NSR-008
  kind: functional
  statement: The North Star must model Verdify Skills, Agent Platform, Orbit, and Gravity as four co-equal pilots in an integrated self-hosted operating plane for source control, CI/CD, pipelines, k3s, agent orchestration, personal and enterprise context, and evidence workflows.
  source_ids: [SRC-009, SRC-011, SRC-017, SRC-038, SRC-039, SRC-040, SRC-041]
  acceptance_signals:
  - Product and architecture North Stars include the four-project boundary, ownership split, and root-planner outer loop.
  - Platform readiness scope includes source-control, CI/CD, k3s, API/MCP controls, and observability.
- id: NSR-009
  kind: functional
  statement: Agent Platform planning must be API/MCP-first and expose versioned capability discovery and authorized dispatch for the root planner, with UI scoped to inspection, review, recovery, and operator-console workflows.
  source_ids: [SRC-009, SRC-011, SRC-014, SRC-038, SRC-039]
  acceptance_signals:
  - Architecture artifacts define Agent Platform MCP/control APIs and typed degradation as the primary interface.
  - UI surfaces are not treated as the only or primary routine orchestration path.
- id: NSR-010
  kind: functional
  statement: Gravity planning must use the current restarted Gravity repository and live runtime as the active source of truth; Sunshine Club remains optional historical reuse evidence only.
  source_ids: [SRC-009, SRC-012, SRC-013, SRC-032, SRC-038, SRC-041]
  acceptance_signals:
  - Gravity readiness reconciles current source, issues, accepted decisions, deployment, API, MCP, citation, and live health state.
  - Older extraction plans cannot override current Gravity product and architecture authority.
- id: NSR-011
  kind: functional
  statement: The North Star loop must capture validated lessons as proposed improvements rather than silently rewriting skills or relying on chat memory.
  source_ids: [SRC-010, SRC-020, SRC-033]
  acceptance_signals:
  - Learning-capture output records source evidence, observed issue or opportunity, verification performed, proposed destination, risk class, approval requirement, and routing decision.
  - '`skills/northstar-planning/references/learning-capture.md` defines source eligibility, redaction, verifier, stop, budget, permissions, and scheduling boundaries.'
  - The default action is to stage proposals without mutation.
- id: NSR-012
  kind: constraint
  statement: Recurring agent loops must pass a loop-readiness check before scheduling or automated delegation.
  source_ids: [SRC-010, SRC-020, SRC-033]
  acceptance_signals:
  - Candidate loops identify recurrence, verifier, state record, stop condition, budget, objective done criteria, permissions, and one reliable manual run.
  - Unverified loops remain manual prompts or unscheduled skills.
- id: NSR-013
  kind: functional
  statement: Optional OpenClaw, Hermes, Codex, and Claude workflow adapters must remain thin orchestration facades over Verdify lifecycle skills, negotiated Agent Platform capabilities, configured-provider primitives, mirror state, and durable `.agent-workflow` records.
  source_ids: [SRC-008, SRC-014, SRC-022, SRC-024, SRC-025, SRC-038, SRC-040]
  acceptance_signals:
  - '`.agent-workflow/northstar/OPENCLAW_SDLC_WORKFLOW_SKILLS.md` defines workflow skills from ideation to production with delegated skills, stakeholders, configured-provider primitives, mirror state, milestones, stop conditions, and proof requirements.'
  - The North Star product and architecture artifacts treat runtime adapters as replaceable capabilities rather than product authority.
  - No adapter can replace the configured source/backlog authority, final human approval, or deployment verification.
- id: NSR-014
  kind: non_functional
  statement: Review-ready lane, wave, and release work must produce a validated review inbox packet before human approval or release verification.
  source_ids: [SRC-021, SRC-025, SRC-027]
  acceptance_signals:
  - '`schemas/review-inbox-packet.schema.yaml` defines the packet contract.'
  - '`skills/release-verification/references/review-inbox.md` defines completeness and stop conditions.'
  - The minimal project includes a validating review inbox packet example.
- id: NSR-015
  kind: functional
  statement: Deployment-affecting sprint plans must include a validated wave release plan before `sprint-orchestrator` dispatches worker sessions.
  source_ids: [SRC-021, SRC-026]
  acceptance_signals:
  - '`schemas/wave-release-plan.schema.yaml` defines the wave release plan contract.'
  - '`skills/sprint-planning/references/wave-release-planning.md` defines completeness and stop conditions.'
  - The minimal project includes a validating wave release plan example.
- id: NSR-016
  kind: non_functional
  statement: Runtime-sensitive review, release, readiness, incident, and feedback decisions must use a validated observability diagnostic packet when telemetry materially affects the decision.
  source_ids: [SRC-027]
  acceptance_signals:
  - '`schemas/observability-diagnostic-packet.schema.yaml` defines the diagnostic packet contract.'
  - '`skills/release-verification/references/observability-diagnostics.md` defines completeness and stop conditions.'
  - The minimal project includes a validating observability diagnostic packet example.
- id: NSR-017
  kind: non_functional
  statement: Controller-managed lifecycle sessions and waves must produce a validated session ledger that survives model context loss.
  source_ids: [SRC-028]
  acceptance_signals:
  - '`schemas/session-ledger.schema.yaml` defines the session ledger contract.'
  - '`skills/controller-loop/references/session-ledger.md` defines event coverage, completeness, and stop conditions.'
  - The minimal project includes a validating controller session ledger example.
- id: NSR-018
  kind: functional
  statement: Proposed Agent Platform MCP/API operations must validate as an Agent Platform control request before execution is trusted.
  source_ids: [SRC-029]
  acceptance_signals:
  - '`schemas/agent-platform-control-request.schema.yaml` defines the request, authorization, policy, target, expected effects, result, review, and handoff contract.'
  - '`skills/platform-readiness/references/agent-platform-control.md` defines completeness and stop conditions.'
  - The minimal project includes a validating Agent Platform control request example.
- id: NSR-019
  kind: functional
  statement: GitHub backlog sync must validate issue, PR, lane, delivery, dependency, project, action, and source-freshness findings before state-of-union depends on them.
  source_ids: [SRC-030]
  acceptance_signals:
  - '`schemas/github-backlog-sync.schema.yaml` defines the backlog sync contract.'
  - '`skills/state-of-union/references/github-backlog-sync.md` defines completeness and stop conditions.'
  - The minimal project includes a validating GitHub backlog sync example.
- id: NSR-020
  kind: non_functional
  statement: Environment-sensitive readiness, wave planning, and release verification must validate desired-state, observed-state, health, drift, remediation, rollback, and cleanup evidence.
  source_ids: [SRC-031]
  acceptance_signals:
  - '`schemas/environment-gitops-reconciliation.schema.yaml` defines the environment GitOps reconciliation contract.'
  - '`skills/platform-readiness/references/environment-gitops.md` defines completeness and stop conditions.'
  - The minimal project includes a validating environment GitOps reconciliation example.
- id: NSR-021
  kind: functional
  statement: Gravity readiness must validate current capability state and the versioned evidence interface before another pilot treats Gravity as an integrated or release-verified provider.
  source_ids: [SRC-032, SRC-013, SRC-038, SRC-041]
  acceptance_signals:
  - '`schemas/gravity-core-extraction-plan.schema.yaml` defines the Gravity core extraction plan contract.'
  - '`skills/gravity-readiness/references/gravity-core-extraction.md` defines completeness and stop conditions.'
  - Readiness distinguishes implemented, deployed, exposed, integrated, cited, and release-verified states.
- id: NSR-022
  kind: functional
  statement: Repo bootstrap must produce a standard self-discovery inventory covering repository structure, Git history, documentation, configured-provider work/change records and mirror state, deployed Kubernetes resources, logs, metrics, routes, storage mounts, secret references, credential validation status, CI/CD shape, package needs, and planning gaps.
  source_ids: [SRC-034, SRC-011, SRC-030, SRC-031]
  acceptance_signals:
  - A bootstrap packet records evidence, limitations, missing access, and proposed issues without copying raw secrets.
  - The packet updates or proposes `AGENTS.md`, project inventory, namespace map, gap backlog, and a PR where repo-local changes are needed.
- id: NSR-023
  kind: constraint
  statement: Credential discovery and validation must record secret references, auth modes, scopes, owners, validation result, and failure mode without logging raw secret values.
  source_ids: [SRC-034, SRC-016]
  acceptance_signals:
  - Bootstrap and platform-readiness artifacts contain no raw tokens, passwords, refresh tokens, API keys, client secrets, or private keys.
  - Credential checks run through scoped probes and record only safe metadata plus pass/fail/needs-reauth status.
- id: NSR-024
  kind: functional
  statement: Platform readiness must define repo-to-namespace naming, environment namespace sets, route propagation, storage mount requests, and domain-agent authority before fleet bootstrap runs broadly.
  source_ids: [SRC-034, SRC-031]
  acceptance_signals:
  - Namespace naming covers owner, organization, repository, dev, preview, staging, and production identity.
  - Self-service storage or route changes are mediated by approved platform/storage/network control APIs or human gates.
- id: NSR-025
  kind: non_functional
  statement: Controller loops must expose fleet observability and recovery signals, including pod health, controller health, loop counts, stop reasons, session-ledger events, alerts, recovery attempts, and outstanding-work rehydration.
  source_ids: [SRC-034, SRC-027, SRC-028]
  acceptance_signals:
  - Dashboards and diagnostic packets can identify which controller, repo, issue, lane, namespace, pod, or alert needs action.
  - Controller or pod restarts reconstruct pending work from durable state rather than hidden chat memory.
- id: NSR-026
  kind: functional
  statement: Planning review must support adversarial Codex/Claude review, lane-owner review, and stakeholder lenses before final plan consensus when a plan materially affects fleet operations.
  source_ids: [SRC-034, SRC-008, SRC-033]
  acceptance_signals:
  - North Star review packets identify reviewer lenses, objections, dispositions, evidence quality, and open questions.
  - Brave/API-backed research is used when external evidence is needed to defend skill boundaries or architecture choices.
- id: NSR-027
  kind: functional
  statement: Repo hygiene/bootstrap must create a typed scope and responsibility contract for each repo-associated controller or long-lived agent before that agent claims operational ownership.
  source_ids: [SRC-034, SRC-036]
  acceptance_signals:
  - '`schemas/repo-agent-scope.schema.yaml` defines repository identity, scope, ownership, responsibilities, authority boundaries, discovery inputs, runtime context, escalation paths, review, handoff, and approval.'
  - '`skills/repo-hygiene/assets/repo-agent-scope.template.yaml` provides a starter artifact for target repositories.'
  - '`skills/repo-hygiene/references/repo-agent-scope.md` defines completion and safety rules.'
- id: NSR-028
  kind: functional
  statement: The shared planning model must define a versioned `PilotProject` contract for lifecycle state, revision, capabilities, supported operations, gates, health, evidence, tenancy, idempotency, audit, and typed failure states.
  source_ids: [SRC-037, SRC-038, SRC-039, SRC-040, SRC-041]
  acceptance_signals:
  - Product and architecture artifacts define one common contract without hard-coding any pilot as globally authoritative.
  - Pilot adapters can report unsupported, degraded, blocked, and stale states without inventing success.
- id: NSR-029
  kind: constraint
  statement: Verdify Skills must remain internal-first and carry no backward-compatibility requirement; deprecated capabilities must be removed from active package, documentation, validation, and routing surfaces.
  source_ids: [SRC-037, SRC-038]
  acceptance_signals:
  - Compatibility shims require a new explicit decision rather than being retained by default.
  - Package inventory and docs contain only supported capabilities.
- id: NSR-030
  kind: non_functional
  statement: Publication and installation must operate on one exact packed artifact through a trusted, atomic, recoverable transaction.
  source_ids: [SRC-037, SRC-038]
  acceptance_signals:
  - Tests validate the exact artifact that is published.
  - The installer stages into a fresh location, validates trusted code and manifest content, atomically promotes, and rolls back on failure.
  - Preexisting target content is never executed as installer validation logic.
- id: NSR-031
  kind: functional
  statement: The root planning agent must coordinate cross-project vision, priorities, dependencies, gates, evidence, issue routing, and handoffs while each pilot retains local product and delivery ownership.
  source_ids: [SRC-038, SRC-039, SRC-040, SRC-041]
  acceptance_signals:
  - Cross-project gaps are filed in their owning repository through the configured work authority, with coexistence mirror references where required.
  - Root-planner actions remain traceable to issues, contracts, evidence, and human gates.
- id: NSR-032
  kind: functional
  statement: Agent Platform must expose capability discovery and supported dispatch contracts that the root planner can negotiate without relying on a removed or hard-coded worker adapter.
  source_ids: [SRC-037, SRC-038, SRC-039]
  acceptance_signals:
  - A planner can discover supported operation versions and choose a valid adapter.
  - Unsupported capabilities return explicit typed degradation and an issue or gate route.
- id: NSR-033
  kind: functional
  statement: Orbit must provide a governed connector plane for authorized email, calendars, enterprise documents, transcripts, notes, conversations, meetings, and engineering context.
  source_ids: [SRC-038, SRC-040]
  acceptance_signals:
  - Connectors preserve tenant/account identity, provenance, freshness, classification, source ACL, retention, and read/write authority.
  - Personal-context principals and fleet-actuation principals are separated or mediated by policy-enforced scoped capabilities.
- id: NSR-034
  kind: functional
  statement: Gravity must expose a versioned tenant-scoped read-only HTTP evidence API with a consumer MCP adapter and equivalent resolvable citations.
  source_ids: [SRC-038, SRC-041]
  acceptance_signals:
  - HTTP and MCP results are authorization-consistent and cite resolvable evidence spans.
  - Missing, suppressed, deleted, stale, or cross-tenant evidence fails closed.
- id: NSR-035
  kind: constraint
  statement: Jason and James may approve Verdify Skills releases, while Jason alone records final North Star lock unless a later governance decision changes that authority.
  source_ids: [SRC-038]
  acceptance_signals:
  - Release approval and North Star lock are represented as separate authority decisions.
  - James's npm publisher role is recorded without silently broadening North Star lock authority.
- id: NSR-036
  kind: functional
  statement: Customer consulting projects must onboard through the same governed lifecycle and PilotProject contracts with customer-owned identity, backlog, data, evidence, runtime, deployment, review, and outcome authority.
  source_ids: [SRC-038]
  acceptance_signals:
  - Repo bootstrap, project definition, architecture, readiness, capability discovery, delivery, evidence, and review require no parallel customer-only lifecycle.
  - Internal pilot authority and Jason-private personal context do not cross into the customer trust domain by default.
- id: NSR-037
  kind: constraint
  statement: Delivery sequencing must optimize for the earliest safely complete four-project self-building slice; no artificial calendar deadline may override trusted publication, authorization, review, or runtime evidence, and the absence of a deadline may not justify avoidable delay.
  source_ids: [SRC-038, SRC-039, SRC-040, SRC-041]
  acceptance_signals:
  - The critical path prioritizes one end-to-end integrated slice over unrelated feature breadth.
  - Verified cross-project gaps are filed in their owning repositories and sequenced by dependencies and safety gates.
  - Customer consulting reuse follows proof of the internal four-pilot loop rather than a separate platform build.
- id: NSR-038
  kind: functional
  statement: A capability-qualified, digest-pinned supported Forgejo release must become the internal source, backlog, pull-request, review, required-status, protected-branch, identity, and audit authority for Verdify Skills and its load-bearing portfolio work before GitHub can become an output-only mirror.
  source_ids: [SRC-017, SRC-043, SRC-044, SRC-045, SRC-047, SRC-050, SRC-051]
  acceptance_signals:
  - The provider contract proves supported-release and upgrade policy, topology, internal IdP/MFA, immutable subjects, service identities, CODEOWNERS translation, stale-review invalidation, conversation resolution, trusted statuses, protection, audit, backup, restore, RPO/RTO, and operator ownership.
  - Metadata migration covers issues, pull requests, comments, reviews, statuses, relationships, audit refs, and the `jvallery/agents` portfolio work record; imported decisions remain historical and open changes are re-reviewed and rechecked internally.
  - GitHub code/package mirrors are output-only after cutover; new GitHub issues or pull requests are non-authoritative intake or explicitly unsupported, and split-brain detection blocks delivery.
  - GitHub stays authoritative until final lock, cross-repository owner acceptance, coexistence, an isolated outage rehearsal, and the attended cutover all pass.
- id: NSR-039
  kind: functional
  statement: A trusted Forgejo event-admission service must verify and normalize raw webhooks, persist a delivery transaction and effect ledger, and then drive a persistent Argo Events bus and repository-owned Argo Workflows for validation, policy, packaging, promotion proposals, recovery, and evidence.
  source_ids: [SRC-028, SRC-043, SRC-044, SRC-045, SRC-047, SRC-050]
  acceptance_signals:
  - Admission verifies the raw-body signature, key version, provider/repository/event/ref allowlist, delivery ID, payload hash and size, rotation overlap, and authoritative re-fetch before every protected effect.
  - A PostgreSQL-backed or separately approved equivalent ledger owns atomic uniqueness, payload hash, monotonic attempts, compare-and-set states, Workflow/status/publish/promote/rollback/mirror receipts, replay authorization, retention, and recovery.
  - The EventBus is persistent and replicated; retry, dead-letter, out-of-order, duplicate, partition, restart, and authorized replay tests cannot duplicate an effect.
  - A transport-neutral state machine preserves `validate`, `pull-request-policy`, `compliance / compliance`, `delivery-policy`, and `critic-gate`, binding canonical check ID, provider mapping, exact head/base, trusted producer, protected-base/policy/template digests, attempt, currentness, evidence digest, supersession, and cancellation.
  - Candidate validation and policy execute from a protected base checkout or trusted digest-pinned package, never only from validator code supplied by the candidate revision.
- id: NSR-040
  kind: functional
  statement: "Verdify package publication must produce an immutable OCI package subject in Zot plus a signed immutable release envelope that pins the complete pre-promotion graph: subject, source and protected-policy identity, checksums, provenance, SBOM, signing material, attestations, exact tests, and critic evidence."
  source_ids: [SRC-037, SRC-038, SRC-043, SRC-044, SRC-045, SRC-047]
  acceptance_signals:
  - Package and real-consumer tests run against the exact bytes in the package subject; the signed release-envelope digest is the sole promotion identity and cannot be rebound to another subject or version.
  - Media types, file manifest, checksums, provenance predicate and builder/materials, SBOM format, signature trust root and rotation, attestation policy, and two-clean-build or explicitly approved reproducibility criterion are versioned contracts.
  - Zot staging, accepted, and mirror prefixes use least-privilege create-only accepted ACLs, tag immutability, quarantine, retention, referrer-completeness verification, garbage-collection protection, replication, backup, restore, and old-digest preservation.
  - The immutable ledger, rather than a mutated envelope, advances the fixed envelope through staged, verified, approved-for-nonproduction, consumer-verified, released, mirrored, rolled-back, and retired states and records approval, GitOps, consumer, rollback, and mirror receipts.
  - Public mirrors are derived only from a consumer-verified release envelope and never supply local validation or promotion.
- id: NSR-041
  kind: functional
  statement: A stable non-production Deployment owned by one Argo CD Application must use a digest-pinned harness and init step to pull and independently verify the release envelope and package subject into fresh storage, install through the real consumer interface, run representative lifecycle probes, and expose readiness only after success.
  source_ids: [SRC-007, SRC-031, SRC-037, SRC-043, SRC-044, SRC-047]
  acceptance_signals:
  - Desired state in the internal authoritative forge pins both the harness image and release-envelope digests; AppProject, namespace, resource, RBAC/admission, tracking identity, acceptable field managers, break-glass, sync, drift, orphan, and `prune:false` cleanup policies are explicit.
  - The init step pulls and verifies the envelope and subject without embedding package bytes in a second image; the main container installs into fresh storage and covers CLI help, doctor, route, schema validation, representative lifecycle behavior, upgrade, and previous-revision removal.
  - Workflows cannot mutate environment resources; reviewed Git is the only ordinary promotion and rollback path.
  - Rollback restores the prior envelope and harness digests, proves Argo Synced and Healthy state, cleans or detects orphans, and passes a UTC delayed durability probe with its literal command.
- id: NSR-042
  kind: non_functional
  statement: Every build-time and runtime dependency required for local validation, packaging, promotion, recovery, and acceptance must resolve from an internal mirror or Zot by immutable digest or checksum.
  source_ids: [SRC-043, SRC-044, SRC-047, SRC-050]
  acceptance_signals:
  - The inventory includes Git remotes, controller/worker/base/tool/harness images, Forgejo/Argo charts, OS/Ruby/Node packages, Kaniko/build tools, ORAS/signing tools, release downloads, generated assets, bootstrap and recovery inputs, origin, internal mirror, immutable identity, refresh owner, and exception status.
  - A dedicated acceptance node starts with empty CRI and task caches; node/gateway and participating controller/repo-server/worker/consumer egress deny public Git, registries, package endpoints, and release assets while internal DNS/forge/Zot/telemetry allowlists remain auditable.
  - Admission requires internal digest references; registry audit proves no pull-through fallback; kube API/metadata access is denied to candidate pods; isolated mirror refresh cannot be triggered by candidate events.
  - A signed offline bootstrap/recovery bundle avoids circular dependence among Forgejo, Argo, Zot, GitOps, identity, and mirrors.
- id: NSR-043
  kind: non_functional
  statement: The local delivery path must preserve or strengthen current review, identity, authorization, secret, provenance, evidence-retention, and audit controls.
  source_ids: [SRC-016, SRC-028, SRC-029, SRC-037, SRC-043, SRC-044, SRC-047]
  acceptance_signals:
  - An internal GitHub-independent IdP enforces MFA, immutable subject mapping, role/protection snapshots, service identities, SSH/PAT policy, deprovisioning, audited break-glass, and historical-only imported approvals.
  - Only a dedicated minimally scoped status principal or independently signed merge guard can satisfy a required status; if the provider cannot prove issuer binding without push/merge/review/protection authority, the provider is rejected.
  - Candidate, builder, publisher, status reporter, signer, and GitOps principals use isolated namespaces/workspaces and credentials; candidate pods receive no service-account token, kube API, forge writer, Zot writer, signer, or GitOps authority.
  - Restricted Pod Security or an approved equivalent admits candidate pods only as non-root with RuntimeDefault seccomp, all capabilities dropped, no privilege escalation, host namespaces, hostPath, devices, or privileged containers, and a read-only root filesystem where compatible; ResourceQuota, LimitRange, isolated ephemeral workspace, TTL cleanup, and rejection fixtures prove enforcement.
  - Signing uses a non-exportable trust root or short-lived workload identity with verifier separation, rotation/revocation, compromise recovery, and refusal to sign arbitrary candidate-provided digests.
  - Tamper-evident append-only evidence, synchronized time, access/deletion audit, retention/GC, backup/restore, and one correlation identity survive controller and identity recovery.
- id: NSR-044
  kind: constraint
  statement: Migration must use staged coexistence and an attended cutover; no GitHub Action, required check, runner, credential, npm publication, GitHub Release, or GitHub authority may be disabled or removed until local parity and rollback are independently proven.
  source_ids: [SRC-043, SRC-044, SRC-046, SRC-047, SRC-050, SRC-051]
  acceptance_signals:
  - An isolated imported repository first completes a cold, credential-denied GitHub-unavailable rehearsal before live dual-run; live parity then reaches every approved threshold with zero false acceptance.
  - A coordinated snapshot covers forge Git and collaboration metadata, IdP/team/protection/webhook state, delivery ledger and Workflow archive, Zot subjects/referrers, GitOps source, signing trust, evidence, and mirrors; restore is the post-cutover rollback path because Git push mirroring is not metadata failback.
  - The attended cutover names exact reversible mutations, human APPLY, dead-man deadline, post-switch canary, rollback deadline, post-verification, mirror reconciliation, delayed re-probe, and completion reconciliation.
  - Destructive retirement requires separate explicit human authority after the objective observation window; open changes are re-reviewed/rechecked rather than trusting imported decisions.
- id: NSR-045
  kind: functional
  statement: The local path must support deterministic failure injection and recovery for invalid or rotated webhook signatures, duplicates, replay, out-of-order events, EventBus loss or partition, stale heads, invalid or changed approvals, status-writer conflict, credential expiry, clock skew, failed validation, poisoned/missing mirrors, DNS failure, disk/quota exhaustion, registry interruption/GC/referrer loss, signing failure/revocation, GitOps drift/sync failure, unhealthy probes, rollback, controller/leader restart, backup restore, and alert-path failure.
  source_ids: [SRC-028, SRC-031, SRC-043, SRC-044, SRC-047]
  acceptance_signals:
  - Every injected failure stops at the correct boundary without promoting unaccepted bytes or mutating production.
  - Recovery is idempotent from the durable ledger, uses compare-and-set transitions and effect receipts, and cannot turn an old event, stale approval, missing referrer, or revoked signature into success.
  - Runbooks, alerts, literal probes, evidence and service objectives identify the owner, deadline, exact recovery action, and escalation without hidden chat context.
- id: NSR-046
  kind: constraint
  statement: A versioned exception ledger must classify load-bearing and cutover-blocking dependencies; no exception or human waiver may satisfy completion while internal source, backlog, review, status, package, signing, GitOps, cold-node, recovery, or required observed-state independence remains external or unreadable.
  source_ids: [SRC-043, SRC-044, SRC-046, SRC-047, SRC-050]
  acceptance_signals:
  - Every record includes dependency class, `load_bearing`, `cutover_blocking`, owner, reason, scope, risk, expiry, immutable replacement, detection probe, fallback, remediation issue, and closure evidence.
  - The initial ledger includes unknown organization-level GitHub controls, portfolio backlog authority, public source/mirrors, npm/GitHub Releases, public chart/image origins, mutable tool dependencies, and unreadable live identity/Argo/Zot/GitOps state.
  - CI and readiness checks fail when an exception expires, loses an owner, or is silently omitted from dependency discovery.
  - Only non-load-bearing mirror or optional-integration exceptions may remain at completion under explicit risk acceptance; unreadable required state blocks cutover.
- id: NSR-047
  kind: functional
  statement: Post-cutover GitHub, npm, and GitHub Release surfaces must have an explicit proprietary/source-available GitHub-versus-project license posture, separate-user, contributor-IP, distribution, retention, security-advisory, mirror-lag, consumer-migration, failure-communication, and support contract.
  source_ids: [SRC-043, SRC-044, SRC-047, SRC-048, SRC-049]
  acceptance_signals:
  - The proposed default is discoverability and compatibility mirroring, not authority or an open-source grant; public docs preserve GitHub users' in-Service view, use, display, perform, reproduce, and fork rights under GitHub's Terms.
  - Public docs state that `UNLICENSED` makes no additional project grant beyond GitHub's Terms and applicable law for off-platform use, modification, redistribution, derivative works, or package use, identify any separate staff/contractor/customer terms, and require legal/IP approval of the exact statement.
  - Issue and vulnerability reports remain accepted, but external code is rejected until Skills governance and the legal/IP owner approve a CLA or copyright-assignment policy and intake.
  - GitHub issues/comments are non-authoritative intake and cannot trigger delivery; public pull requests cannot enter the protected path while external code intake is disabled.
  - Public package/release bytes verify against the accepted release envelope, mirror lag and security-fix deadlines are measured, divergence is alerted, and mirror failure never blocks internal delivery.
  - A license grant, external-code intake, permanent removal, issue disabling, repository archiving, or consumer channel termination each requires its own separately authorized policy or attended destructive/communication gate.
- id: NSR-048
  kind: non_functional
  statement: Platform, source-control, security, SRE, backup, finance, and release owners must accept a measurable operating envelope before final lock and exact implementation SLOs before dual-run.
  source_ids: [SRC-043, SRC-044, SRC-047, SRC-050]
  acceptance_signals:
  - The review assigns stable `OWN-001` through `OWN-010` roles to accountable humans by immutable subject and versioned authority reference, then records one `accept`, `revise`, or `reject` entry for every applicable `NSQ-*`/`OWN-*` decision pair and every applicable `OWN-*`/`OE-*` threshold pair in `OE-001` through `OE-034`; missing assignments or rows, any rejection, unresolved conflicting revisions, or generic approvals keep the affected question and gate open.
  - Initial proposed scope is one isolated rehearsal repository plus the live Verdify Skills repository, at most 500 admitted events per day and 20 per minute burst, and a ten-minute maximum ordinary event age unless an authorized replay record exists.
  - Resource and cost bounds are two concurrent workflows, one release per day, 16 vCPU, 32 GiB memory, 200 GiB incremental retained storage, USD 250 per month incremental infrastructure spend, at most four attended operator-hours per rolling seven days including incident response with any exceedance requiring an explicit threshold revision or extension record, and at most 30 consecutive dual-run days before an explicit extension decision.
  - Availability and support bounds are 99.5 percent monthly internal-path availability excluding approved maintenance, 24x7 automated alerting, and required human attendance for release and cutover windows.
  - Recovery and retention bounds are forge RPO at most 5 minutes and RTO at most 2 hours, Git mirror freshness at most 15 minutes, package mirror freshness at most 4 hours, coordinated encrypted snapshot age at most 24 hours, restore-rehearsal age at most 30 days, raw admitted events and transaction/effect/status/audit/acceptance evidence retained at least 365 days, and each supported package subject, signed release envelope, and immutable graph retained through the later of support end or retirement plus at least 365 days.
  - Cutover thresholds include 100 percent logical-check and failure-fixture parity, zero false acceptance, at least 20 consecutive distinct successful end-to-end change transactions, at least 3 consecutive distinct successful release-and-rollback transaction pairs, p95 queue under 2 minutes, p95 validation under 15 minutes, promotion health under 10 minutes, rollback under 10 minutes, a 4-hour cold GitHub-unavailable window, a UTC durability re-probe 30 minutes after the initial green result, and 14 healthy observation days.
- id: NSR-049
  kind: constraint
  statement: "The migration must record closed issues #120 and #121 as completed absorbed predecessor contracts, preserve their safety outcomes and current four-project waves, and execute one bounded vertical slice before broader platform or customer expansion."
  source_ids: [SRC-037, SRC-038, SRC-043, SRC-044, SRC-046, SRC-047, SRC-051]
  acceptance_signals:
  - "Closed issue #120 exact-package/atomic-install trust and closed issue #121 protected-development/release-only-main outcomes remain completed prerequisites, are absorbed into local parity and lane contracts, and are not redispatched or duplicated; protected `dev` and release-only `main` controls remain coexistence gates until authority cutover."
  - The first slice is one non-destructive Forgejo event -> trusted five-check state -> package subject/envelope -> internal desired-state PR -> consumer health -> rollback transaction on an isolated imported repository.
  - Broader four-project feature work and customer consulting expansion pause only where they compete for the same platform/security owners; critical safety, incident, and unrelated owner-capacity work continues.
user_stories:
- id: NSS-001
  actor: Jason
  story: As a planner, I can register research, feed transcripts and rough requirements into one loop, and receive a structured planning artifact that preserves my intent.
  acceptance_signal: The output contains goals, requirements, user stories, milestones, planning questions, conflicts, research paths, and approval state with source links.
  requirement_ids: [NSR-001, NSR-003, NSR-005]
  source_ids: [SRC-002, SRC-005]
- id: NSS-002
  actor: James
  story: As a reviewer, I can review the product and architecture North Star when the loop is ready for human review and return actionable feedback without being treated as the final-lock authority.
  acceptance_signal: James's feedback routes back to `artifact-loop` or review-feedback; only an explicit Jason decision can record final lock and permit downstream authority.
  requirement_ids: [NSR-004]
  source_ids: [SRC-002, SRC-003]
- id: NSS-003
  actor: Worktree agent
  story: As a future implementation agent, I receive requirements and milestones that are traceable to the North Star rather than ad hoc chat instructions.
  acceptance_signal: Later lane contracts can cite North Star requirement and milestone IDs.
  requirement_ids: [NSR-001, NSR-003]
  source_ids: [SRC-002]
- id: NSS-004
  actor: Jason
  story: As a reviewer, I can answer a prioritized North Star interview packet with proposed defaults and tradeoffs before approving or requesting changes.
  acceptance_signal: The packet lists P0/P1/P2 questions, answer shapes, affected IDs, evidence, and routing rules.
  requirement_ids: [NSR-007, NSR-004]
  source_ids: [SRC-008]
- id: NSS-005
  actor: Root planning agent
  story: As the portfolio outer loop, I can discover and negotiate Agent Platform capabilities through authorized MCP/control APIs instead of relying on a hard-coded worker or direct dashboard operation.
  acceptance_signal: Versioned MCP/API contracts exist for project state, supported dispatch, sessions, readiness, review, evidence, health, and typed degradation.
  requirement_ids: [NSR-009, NSR-008, NSR-031, NSR-032]
  source_ids: [SRC-009, SRC-011, SRC-014, SRC-038, SRC-039]
- id: NSS-006
  actor: Platform operator
  story: As the operator, I can manage source control, CI/CD, pipelines, k3s app state, agent sessions, and review evidence as one coherent operating plane.
  acceptance_signal: Platform readiness and controller artifacts evaluate these surfaces together and expose one traceable status model.
  requirement_ids: [NSR-008]
  source_ids: [SRC-009, SRC-011, SRC-017]
- id: NSS-007
  actor: Gravity owner
  story: As the Gravity owner, I can keep the current restarted repository and live deployment authoritative while safely exposing its evidence capability to the other pilots.
  acceptance_signal: Current readiness distinguishes implemented, deployed, exposed, integrated, cited, and release-verified states and older Sunshine material remains non-authoritative.
  requirement_ids: [NSR-010, NSR-021, NSR-034]
  source_ids: [SRC-009, SRC-012, SRC-013, SRC-032, SRC-038, SRC-041]
- id: NSS-008
  actor: Learning-capture reviewer
  story: As a reviewer, I can inspect proposed improvements mined from sessions and research before they alter skills, hooks, tools, config, or planning artifacts.
  acceptance_signal: Each proposal validates as a learning-capture packet and includes evidence, redaction policy, verifier, destination, risk, approval requirement, and an explicit accept/modify/reject/defer/no-op path.
  requirement_ids: [NSR-011]
  source_ids: [SRC-010, SRC-020, SRC-033]
- id: NSS-009
  actor: Loop operator
  story: As an operator, I can decide whether a candidate recurring task is ready to become a loop.
  acceptance_signal: The loop-readiness checklist passes before scheduling, and failed checks produce either a manual prompt, a research task, or a skill-hardening task.
  requirement_ids: [NSR-012]
  source_ids: [SRC-010, SRC-020, SRC-033]
- id: NSS-010
  actor: Workflow adapter user
  story: As a user of an optional OpenClaw, Hermes, Codex, or Claude adapter, I can invoke a small curated set of workflow skills while configured-provider work items, branches, worktrees, changes, checks, deployments, releases, and mirror refs remain the coordination primitives.
  acceptance_signal: The facade names each delegated Verdify skill, negotiated capability, stakeholder, configured-provider primitive, mirror role, durable artifact, milestone, stop condition, and production-proof evidence.
  requirement_ids: [NSR-013, NSR-014]
  source_ids: [SRC-008, SRC-014, SRC-022, SRC-024, SRC-025, SRC-038, SRC-040]
- id: NSS-011
  actor: Human reviewer
  story: As a reviewer, I can inspect one packet that proves what changed, which SHA was reviewed, what checks and preview deployment ran, what telemetry and rollback evidence exists, and what decision is recommended.
  acceptance_signal: '`review-inbox-packet.yaml` validates and routes to approve, request changes, reject, or escalate.'
  requirement_ids: [NSR-014, NSR-016]
  source_ids: [SRC-021, SRC-025, SRC-027]
- id: NSS-012
  actor: Release planner
  story: As a release planner, I can approve a wave only after branch identity, CI events, checks, environments, GitOps desired state, rollback, release health, and review handoff are explicit.
  acceptance_signal: '`wave-release-plan.yaml` validates before worker dispatch.'
  requirement_ids: [NSR-015]
  source_ids: [SRC-021, SRC-026]
- id: NSS-013
  actor: Release verifier
  story: As a verifier, I can diagnose runtime health with correlated telemetry, deployment markers, hypotheses, findings, and missing instrumentation before accepting review or release claims.
  acceptance_signal: '`observability-diagnostic-packet.yaml` validates and routes to review inbox, release verification, platform readiness, lane delivery, sprint planning, incident handling, or no action.'
  requirement_ids: [NSR-016]
  source_ids: [SRC-027]
- id: NSS-014
  actor: Controller agent
  story: As the durable outer loop, I can reconstruct parent and child sessions, lane dispatch, critic review, review packets, diagnostics, deployments, gates, and handoffs from a typed ledger.
  acceptance_signal: '`session-ledger.yaml` validates and every lifecycle-significant event has a ledger entry or explicit exception.'
  requirement_ids: [NSR-017]
  source_ids: [SRC-028]
- id: NSS-015
  actor: Root planning agent
  story: As the portfolio planner, I can propose negotiated Agent Platform operations with explicit operation identity, target, authorization, policy verdict, mutation level, expected effects, review gate, and result refs before an executor acts.
  acceptance_signal: '`agent-platform-control-request.yaml` validates and blocks unsafe, unauthorized, stale, or ambiguous operations.'
  requirement_ids: [NSR-018, NSR-009]
  source_ids: [SRC-029, SRC-014]
- id: NSS-016
  actor: State-of-union owner
  story: As the strategy owner, I can reconcile GitHub Issues, PRs, dependencies, sub-issues, Projects, checks, deployments, and lane contracts in one typed artifact before recommending the next sprint.
  acceptance_signal: '`github-backlog-sync.yaml` validates and records whether each proposed action belongs in GitHub, a durable gate, state-of-union, sprint-orchestrator, or release-verification.'
  requirement_ids: [NSR-019, NSR-013]
  source_ids: [SRC-030, SRC-024]
- id: NSS-017
  actor: Platform operator
  story: As the platform operator, I can prove a preview, review, staging, or production-like environment is reconciled from desired state to observed runtime health before it supports review or release.
  acceptance_signal: '`environment-gitops-reconciliation.yaml` validates and records controller sync/health, namespace policy, deployment evidence, endpoint health, drift, remediation, rollback, and cleanup.'
  requirement_ids: [NSR-020, NSR-015, NSR-016]
  source_ids: [SRC-031, SRC-026, SRC-027]
- id: NSS-018
  actor: Gravity readiness owner
  story: As the Gravity readiness owner, I can reconcile current source, runtime, API, MCP, citation, and lifecycle state before another pilot depends on Gravity.
  acceptance_signal: Gravity reports capability and evidence-interface state truthfully, including any gap between code, deployment, exposure, integration, and release verification.
  requirement_ids: [NSR-021, NSR-010, NSR-034]
  source_ids: [SRC-032, SRC-013, SRC-038, SRC-041]
- id: NSS-019
  actor: Repo controller agent
  story: As a newly assigned repository controller, I can bootstrap myself by inventorying the repo, configured-provider and mirror state, runtime namespace, credential references, storage, observability, CI/CD, and planning gaps before proposing changes.
  acceptance_signal: A bootstrap packet and PR proposal exist with traceable evidence, missing-access notes, issue recommendations, and safe credential-validation results.
  requirement_ids: [NSR-022, NSR-023, NSR-024]
  source_ids: [SRC-034]
- id: NSS-020
  actor: Platform operator
  story: As the platform operator, I can see every repo controller's pod, loop, namespace, storage, alert, and outstanding-work status in one fleet dashboard.
  acceptance_signal: Grafana/Prometheus and diagnostic packets show controller health, loop activity, stop reasons, resource pressure, alerts, and recovery state by repo/controller.
  requirement_ids: [NSR-025, NSR-020]
  source_ids: [SRC-034, SRC-027, SRC-028]
- id: NSS-021
  actor: Infrastructure domain agent
  story: As a networking, storage, backup, or platform domain agent, I have scoped access to the systems I own while repo-local agents remain constrained to their project namespace and approved mounts/routes/secrets.
  acceptance_signal: Platform readiness records owner, scope, credentials, audit path, allowed operations, prohibited operations, and approval gate for each domain-agent authority class.
  requirement_ids: [NSR-023, NSR-024]
  source_ids: [SRC-034, SRC-016]
- id: NSS-022
  actor: Jason
  story: As Orbit's user, I can use it as both my personal assistant and engineering chief of staff across authorized email, calendars, enterprise documents, transcripts, notes, conversations, meetings, GitHub, and agent state.
  acceptance_signal: Every answer or proposed action identifies source freshness, provenance, privacy boundary, account or tenant, authority, missing connector, and any required human approval.
  requirement_ids: [NSR-026, NSR-025, NSR-033]
  source_ids: [SRC-034, SRC-014, SRC-022, SRC-038, SRC-040]
- id: NSS-023
  actor: Repo controller agent
  story: As a repo-associated agent, I can declare my scope, ownership, responsibilities, allowed and prohibited operations, runtime context, and escalation paths before I operate the repository.
  acceptance_signal: '`repo-agent-scope.yaml` validates and links the agent charter to discovery evidence, configured-provider authority and mirror roles, AGENTS.md, platform boundaries, review, and handoff.'
  requirement_ids: [NSR-027, NSR-022, NSR-024]
  source_ids: [SRC-034, SRC-036]
- id: NSS-024
  actor: Root planning agent
  story: As the outer loop, I can keep all four pilots aligned to one common vision while routing each implementation gap to its owning repository.
  acceptance_signal: Cross-project plans expose dependencies, gates, issue links, evidence, ownership, and handoffs without replacing pilot backlogs.
  requirement_ids: [NSR-028, NSR-031]
  source_ids: [SRC-037, SRC-038, SRC-039, SRC-040, SRC-041]
- id: NSS-025
  actor: Verdify Skills maintainer
  story: As a maintainer, I can remove deprecated capabilities and ship a small internal-first package without carrying compatibility debt.
  acceptance_signal: Supported inventory, docs, routes, tests, and package contents agree and contain no deprecated surface.
  requirement_ids: [NSR-029]
  source_ids: [SRC-037, SRC-038]
- id: NSS-026
  actor: Release approver
  story: As Jason or James, I can approve publication only after the exact packed artifact has passed tests and the transaction is atomic and recoverable.
  acceptance_signal: Release evidence binds test results, artifact digest, publisher identity, atomic install proof, and rollback proof.
  requirement_ids: [NSR-030, NSR-035]
  source_ids: [SRC-037, SRC-038]
- id: NSS-027
  actor: Gravity consumer
  story: As Orbit, Agent Platform, or another authorized consumer, I can query Gravity through a versioned read-only API or MCP adapter and receive resolvable tenant-safe evidence citations.
  acceptance_signal: HTTP and MCP parity tests prove equivalent authorized results, citations, negative leakage behavior, and typed degradation.
  requirement_ids: [NSR-028, NSR-034]
  source_ids: [SRC-038, SRC-041]
- id: NSS-028
  actor: Jason as consultant
  story: As I transition into customer consulting, I can onboard a customer repository through the same proven platform while the customer retains project, data, deployment, and outcome authority.
  acceptance_signal: One customer project validates against the common lifecycle and PilotProject contracts without importing Jason-private context or inventing a second control plane.
  requirement_ids: [NSR-028, NSR-031, NSR-036]
  source_ids: [SRC-038]
- id: NSS-029
  actor: Verdify Skills maintainer
  story: As a maintainer, I can open a change, receive equivalent protected validation and independent review, and integrate it while GitHub and GitHub Actions are unavailable.
  acceptance_signal: An attended GitHub-unavailable test completes source push, pull request, required statuses, critic evidence, approval, merge, and audit through Forgejo, Argo Events, and Argo Workflows without external package or image downloads.
  requirement_ids: [NSR-038, NSR-039, NSR-042, NSR-043]
  source_ids: [SRC-043, SRC-044, SRC-045]
- id: NSS-030
  actor: Release approver
  story: As Jason or James, I can approve the signed envelope for the complete pre-promotion Verdify package graph and see subsequent GitOps, consumer, rollback, release, and mirror receipts bound to that unchanged digest.
  acceptance_signal: The approved envelope digest pins the exact tested subject and evidence, is the sole GitOps promotion input, and the ledger proves that installed and public bytes match it without rebinding the envelope.
  requirement_ids: [NSR-040, NSR-043, NSR-044]
  source_ids: [SRC-037, SRC-038, SRC-043, SRC-045, SRC-047]
- id: NSS-031
  actor: Platform operator
  story: As an operator, I can observe the repository event, Workflow, artifact, GitOps promotion, consumer health, delayed durability probe, and rollback as one correlated transaction.
  acceptance_signal: Dashboards, logs, durable artifacts, and runbooks identify every state transition and prove successful rollback after an injected unhealthy deployment.
  requirement_ids: [NSR-039, NSR-041, NSR-043, NSR-045]
  source_ids: [SRC-027, SRC-028, SRC-031, SRC-043, SRC-044]
- id: NSS-032
  actor: Security and audit reviewer
  story: As a reviewer, I can enumerate every external dependency and privileged boundary, prove that local workloads use immutable internal inputs, and reject cutover while any load-bearing exception is unowned or untested.
  acceptance_signal: Cold-node network-denial evidence, dependency inventory, RBAC and credential probes, provenance verification, and the exception ledger agree at the exact cutover candidate.
  requirement_ids: [NSR-042, NSR-043, NSR-044, NSR-046]
  source_ids: [SRC-015, SRC-016, SRC-043, SRC-044]
- id: NSS-033
  actor: Agent Platform service owner
  story: As the named service owner, I can operate the internal forge, event admission, transaction ledger, workflow, registry, signing, GitOps, and recovery services within an approved capacity and support envelope.
  acceptance_signal: Ownership, escalation, cost, capacity, service objectives, backup, restore, upgrade, and decommission runbooks are accepted and exercised against the approved thresholds.
  requirement_ids: [NSR-038, NSR-039, NSR-040, NSR-044, NSR-048]
  source_ids: [SRC-044, SRC-047]
- id: NSS-034
  actor: Public visitor, authorized consumer, or prospective contributor
  story: As a public visitor, I can discover the mirror, verify bytes, distinguish GitHub's in-Service public-repository rights from any additional project/off-platform/package license, and follow documented issue, security, and support paths.
  acceptance_signal: Public documentation declares authority, GitHub Terms rights, the exact legal/IP-approved additional-project-license posture, separate-user terms, external-code non-acceptance pending an approved CLA/assignment policy, mirror freshness, issue and vulnerability routes, and behavior during outages.
  requirement_ids: [NSR-038, NSR-040, NSR-047, NSR-048]
  source_ids: [SRC-043, SRC-047]
- id: NSS-035
  actor: Identity and audit reviewer
  story: As an auditor, I can prove who authored, reviewed, approved, reported status, published, signed, promoted, restored, and retired each exact change without trusting mutable display names or imported approvals.
  acceptance_signal: Immutable identity subjects, deprovisioning and break-glass tests, scoped machine issuers, audit retention, and historical-import markers reconcile to the delivery transaction and release envelope.
  requirement_ids: [NSR-038, NSR-039, NSR-040, NSR-043, NSR-044]
  source_ids: [SRC-044, SRC-047]
architecture_principles:
- id: NSP-001
  statement: North Star planning artifacts are durable `.agent-workflow` records, not hidden chat state.
  purpose: Allows project-definition, architecture, state-of-union, and controller loops to resume without relying on conversation memory.
  linked_goal_ids: [NSG-001]
  linked_requirement_ids: [NSR-001, NSR-003, NSR-005]
  source_ids: [SRC-001, SRC-002, SRC-005]
- id: NSP-004
  statement: Research evidence is registered with stable IDs, source hashes, tags, claims, and copied source paths before synthesis.
  purpose: Makes research referenceable and queryable while preserving provenance for later requirements, issues, ADRs, tests, and reviews.
  linked_goal_ids: [NSG-001]
  linked_requirement_ids: [NSR-005]
  source_ids: [SRC-005]
- id: NSP-002
  statement: Product goals and architecture inputs remain separate but bidirectionally traceable.
  purpose: Prevents infrastructure choices from drifting away from user, operator, security, delivery, or cost value.
  linked_goal_ids: [NSG-002]
  linked_requirement_ids: [NSR-003]
  source_ids: [SRC-002]
- id: NSP-003
  statement: Planning remains self-improving until final lock approval; ordinary questions and research gaps are loop inputs, not gates.
  purpose: Preserves Jason's final-lock authority while allowing agents to keep improving drafts from evidence and feedback and preserving separate Jason-or-James release approval.
  linked_goal_ids: [NSG-003]
  linked_requirement_ids: [NSR-004]
  source_ids: [SRC-002, SRC-003]
- id: NSP-005
  statement: Human interview answers are feedback inputs, not final approval.
  purpose: Lets the system refine product priorities and architecture tradeoffs while preserving the separate final-lock gate.
  linked_goal_ids: [NSG-005]
  linked_requirement_ids: [NSR-007, NSR-004]
  source_ids: [SRC-008]
- id: NSP-006
  statement: The owned IP is the internal-first Skills method layer and the contracts that bind four co-equal pilots, not commodity infrastructure primitives or compatibility shims.
  purpose: Focuses engineering effort on unique Verdify value while keeping the skill graph small and composing GitHub/Git, Kubernetes, GitOps, databases, connectors, vector stores, and observability tools.
  linked_goal_ids: [NSG-006, NSG-024, NSG-025]
  linked_requirement_ids: [NSR-008, NSR-028, NSR-029]
  source_ids: [SRC-009, SRC-011, SRC-017, SRC-037, SRC-038]
- id: NSP-007
  statement: Agent Platform control is capability-negotiated, API/MCP-first, and UI-assisted.
  purpose: Allows the root planner and replaceable runtime adapters to discover supported operations while preserving UI inspection, review, and recovery workflows for humans.
  linked_goal_ids: [NSG-006, NSG-026]
  linked_requirement_ids: [NSR-009, NSR-032]
  source_ids: [SRC-009, SRC-011, SRC-014, SRC-038, SRC-039]
- id: NSP-008
  statement: Current Gravity source and runtime are authoritative; historical reuse material is advisory.
  purpose: Prevents old Sunshine or prior-Gravity assumptions from displacing the restarted active project while preserving reusable provenance lessons.
  linked_goal_ids: [NSG-007, NSG-028]
  linked_requirement_ids: [NSR-010, NSR-021, NSR-034]
  source_ids: [SRC-009, SRC-012, SRC-013, SRC-032, SRC-038, SRC-041]
- id: NSP-009
  statement: Self-improvement must stage evidence-backed proposals before mutation.
  purpose: Lets skills compound from real lessons while preserving human judgment, redaction, risk review, and source traceability.
  linked_goal_ids: [NSG-008]
  linked_requirement_ids: [NSR-011]
  source_ids: [SRC-010, SRC-020, SRC-033]
- id: NSP-010
  statement: A recurring agent loop is only real when it has a verifier, state, stop condition, budget, and objective done criteria.
  purpose: Prevents scheduled loops from becoming expensive self-approval cycles with no reliable completion signal.
  linked_goal_ids: [NSG-009]
  linked_requirement_ids: [NSR-012]
  source_ids: [SRC-010, SRC-020, SRC-033]
- id: NSP-011
  statement: OpenClaw, Hermes, Codex, and Claude workflow adapters are user-facing orchestration facades, not identities or sources of authority.
  purpose: Lets replaceable runtime adapters provide ergonomic SDLC workflows while preserving configured-provider records, Verdify artifacts, human gates, and deployment proof as the authoritative control plane.
  linked_goal_ids: [NSG-010]
  linked_requirement_ids: [NSR-013, NSR-014]
  source_ids: [SRC-008, SRC-014, SRC-022, SRC-024, SRC-025, SRC-038, SRC-040]
- id: NSP-012
  statement: Review readiness is packetized and schema-validated before human approval.
  purpose: Prevents reviewers from reconstructing evidence from chat, CI pages, or deployment dashboards without a durable completeness verdict and feedback route.
  linked_goal_ids: [NSG-011]
  linked_requirement_ids: [NSR-014, NSR-016]
  source_ids: [SRC-021, SRC-025, SRC-027]
- id: NSP-013
  statement: Release architecture is planned before dispatch, not reverse-engineered during review.
  purpose: Makes CI/CD, preview environments, GitOps reconciliation, rollback, and release-health evidence available to workers, critics, reviewers, and release verifiers from the start of the wave.
  linked_goal_ids: [NSG-012]
  linked_requirement_ids: [NSR-015]
  source_ids: [SRC-021, SRC-026]
- id: NSP-014
  statement: Runtime diagnostics must correlate telemetry, deployment markers, checks, and human feedback before release-health conclusions.
  purpose: Keeps review and release decisions grounded in observable runtime state instead of raw CI success or process-health claims.
  linked_goal_ids: [NSG-013]
  linked_requirement_ids: [NSR-016]
  source_ids: [SRC-027]
- id: NSP-015
  statement: Controller history is an append-oriented event ledger, not chat memory.
  purpose: Makes recovery, audit, learning capture, and cross-session handoff possible without depending on transient model context.
  linked_goal_ids: [NSG-014]
  linked_requirement_ids: [NSR-017]
  source_ids: [SRC-028]
- id: NSP-016
  statement: Agent Platform control starts as a policy-evaluated request artifact before it becomes an executor.
  purpose: Lets planners and controllers prepare API/MCP operations with authorization, target, expected effects, review, and evidence while blocking unsafe mutation until concrete platform operations are approved.
  linked_goal_ids: [NSG-015]
  linked_requirement_ids: [NSR-018, NSR-009]
  source_ids: [SRC-029, SRC-014]
- id: NSP-017
  statement: Backlog sync records findings and mirror state, not authority.
  purpose: Keeps configured-provider work items, changes, checks, deployments, dependencies, portfolio relationships, and audit records authoritative while making strategy and sprint reconciliation durable, reviewable, and schema-validated; the current GitHub schema remains a coexistence adapter.
  linked_goal_ids: [NSG-016]
  linked_requirement_ids: [NSR-019, NSR-013]
  source_ids: [SRC-030, SRC-024]
- id: NSP-018
  statement: Environment proof separates desired state, observed controller state, and runtime health.
  purpose: Prevents merge or CI success from being mistaken for deployment proof, while giving platform readiness, wave planning, and release verification one reusable evidence shape.
  linked_goal_ids: [NSG-017]
  linked_requirement_ids: [NSR-020, NSR-015, NSR-016]
  source_ids: [SRC-031, SRC-026, SRC-027]
- id: NSP-019
  statement: Gravity capabilities and evidence are versioned, provenance-bearing interfaces, not inferred from the presence of code or a healthy pod.
  purpose: Forces cross-project consumers to distinguish implementation, deployment, exposure, integration, citation, authorization, and release verification.
  linked_goal_ids: [NSG-018, NSG-007, NSG-028]
  linked_requirement_ids: [NSR-021, NSR-010, NSR-034]
  source_ids: [SRC-032, SRC-013, SRC-038, SRC-041]
- id: NSP-020
  statement: Repo bootstrap is a cross-skill workflow facade, not a new ungoverned source of authority.
  purpose: Lets controllers get organized across repository, configured-provider and mirror, runtime, storage, credential, and observability dimensions while preserving authoritative provider records and `.agent-workflow` as control planes.
  linked_goal_ids: [NSG-019]
  linked_requirement_ids: [NSR-022, NSR-023]
  source_ids: [SRC-034]
- id: NSP-021
  statement: Namespace, storage, route, and secret boundaries are platform contracts before they are repo-controller powers.
  purpose: Keeps fleet standardization compatible with least privilege, infrastructure-domain ownership, and auditable change control.
  linked_goal_ids: [NSG-020]
  linked_requirement_ids: [NSR-023, NSR-024]
  source_ids: [SRC-034, SRC-016, SRC-031]
- id: NSP-022
  statement: Controller availability is an observable service objective, not an assumed property of a chat session.
  purpose: Makes controller failures, restarts, alert routing, and outstanding-work recovery measurable and reviewable.
  linked_goal_ids: [NSG-021]
  linked_requirement_ids: [NSR-025, NSR-017]
  source_ids: [SRC-034, SRC-027, SRC-028]
- id: NSP-023
  statement: The root planning agent owns the portfolio outer loop; Orbit owns governed personal and engineering information context, while decisions remain durable issues, PRs, gates, and review packets.
  purpose: Separates cross-project planning authority from the personal-assistant and chief-of-staff information role without losing integrated context.
  linked_goal_ids: [NSG-022, NSG-024, NSG-026]
  linked_requirement_ids: [NSR-026, NSR-019, NSR-031, NSR-033]
  source_ids: [SRC-034, SRC-014, SRC-022, SRC-038, SRC-040]
- id: NSP-024
  statement: Repo-agent ownership starts with an explicit scope contract, not with a running session.
  purpose: Prevents controllers from silently expanding their authority and gives downstream skills a durable charter for ownership, responsibilities, runtime context, and escalation.
  linked_goal_ids: [NSG-023, NSG-019]
  linked_requirement_ids: [NSR-027, NSR-022, NSR-024]
  source_ids: [SRC-034, SRC-036]
- id: NSP-025
  statement: Pilot projects are co-equal ownership domains connected through contracts, not a fixed hierarchy of privileged repositories.
  purpose: Lets each pilot evolve independently while the root planner coordinates shared vision, dependencies, gates, and evidence.
  linked_goal_ids: [NSG-024, NSG-026]
  linked_requirement_ids: [NSR-028, NSR-031]
  source_ids: [SRC-037, SRC-038, SRC-039, SRC-040, SRC-041]
- id: NSP-026
  statement: The root planner coordinates but does not absorb pilot product, backlog, runtime, deployment, or outcome ownership.
  purpose: Prevents portfolio orchestration from becoming a hidden monolith or a competing delivery control plane.
  linked_goal_ids: [NSG-024, NSG-026]
  linked_requirement_ids: [NSR-028, NSR-031]
  source_ids: [SRC-038, SRC-039, SRC-040, SRC-041]
- id: NSP-027
  statement: Supported capability is negotiated from a versioned provider contract rather than inferred from names, binaries, pods, or past adapters.
  purpose: Keeps dispatch and integration resilient as Agent Platform, Orbit, Gravity, and runtime adapters change.
  linked_goal_ids: [NSG-026, NSG-028]
  linked_requirement_ids: [NSR-028, NSR-032, NSR-034]
  source_ids: [SRC-037, SRC-038, SRC-039, SRC-040, SRC-041]
- id: NSP-028
  statement: Package publication and installation form one trusted atomic transaction over the exact tested artifact.
  purpose: Prevents tests from certifying different bytes than those published and prevents installer validation from executing untrusted target content.
  linked_goal_ids: [NSG-027]
  linked_requirement_ids: [NSR-030]
  source_ids: [SRC-037, SRC-038]
- id: NSP-029
  statement: Deprecated capability is deleted by default; compatibility is an explicit exception, not an architectural baseline.
  purpose: Keeps an internal-first skills package light, understandable, testable, and inexpensive to evolve.
  linked_goal_ids: [NSG-025]
  linked_requirement_ids: [NSR-029]
  source_ids: [SRC-037, SRC-038]
- id: NSP-030
  statement: Orbit personal context and engineering actuation cross a policy-enforced boundary with source-aware provenance and least privilege.
  purpose: Enables broad personal-assistant and chief-of-staff value without exposing inboxes, documents, or meetings to an overpowered fleet principal.
  linked_goal_ids: [NSG-022]
  linked_requirement_ids: [NSR-033]
  source_ids: [SRC-038, SRC-040]
- id: NSP-031
  statement: Internal dogfooding proves a reusable customer consulting method; it does not make internal pilots or personal context part of the customer trust domain.
  purpose: Lets the platform create consulting leverage while preserving customer ownership, tenancy, privacy, approvals, and delivery accountability.
  linked_goal_ids: [NSG-029]
  linked_requirement_ids: [NSR-036]
  source_ids: [SRC-038]
- id: NSP-032
  statement: Internal authority must stand alone before GitHub becomes a mirror.
  purpose: Prevents a cosmetic workflow migration from leaving source, reviews, required statuses, or promotion stranded on GitHub.
  linked_goal_ids: [NSG-031]
  linked_requirement_ids: [NSR-038, NSR-044]
  source_ids: [SRC-017, SRC-043, SRC-044, SRC-045, SRC-050, SRC-051]
- id: NSP-033
  statement: The repository owns validation and release behavior; the platform owns reusable event, workflow, registry, identity, GitOps, and observability mechanisms.
  purpose: Keeps policy reviewable with the code while avoiding one-off cluster automation and duplicated controllers.
  linked_goal_ids: [NSG-031]
  linked_requirement_ids: [NSR-039, NSR-040, NSR-041, NSR-045]
  source_ids: [SRC-007, SRC-031, SRC-043, SRC-044]
- id: NSP-034
  statement: Every executable dependency and promoted artifact is selected by immutable digest or verified checksum from an internal system.
  purpose: Makes clean-node rebuilds reproducible and separates mirror refresh from candidate validation.
  linked_goal_ids: [NSG-031]
  linked_requirement_ids: [NSR-040, NSR-042, NSR-046]
  source_ids: [SRC-037, SRC-043, SRC-044, SRC-045]
- id: NSP-035
  statement: GitOps is the sole mutator of environment desired state; workflows build evidence and propose digest changes but do not directly deploy.
  purpose: Preserves one field owner, observable reconciliation, drift detection, and reversible promotion.
  linked_goal_ids: [NSG-031]
  linked_requirement_ids: [NSR-041, NSR-044, NSR-045]
  source_ids: [SRC-007, SRC-031, SRC-043]
- id: NSP-036
  statement: Transport-neutral contracts define checks, reviews, approvals, deployments, and releases independently of GitHub, Forgejo, or Argo API shapes.
  purpose: Preserves behavioral parity while allowing control-plane migration and future replacement without duplicating policy.
  linked_goal_ids: [NSG-031]
  linked_requirement_ids: [NSR-038, NSR-039, NSR-043]
  source_ids: [SRC-028, SRC-029, SRC-043, SRC-044]
- id: NSP-037
  statement: Coexistence, failure injection, rollback, delayed re-probe, and exception retirement precede destructive cutover.
  purpose: Keeps the existing path recoverable until the local path has proved operational durability under realistic failure.
  linked_goal_ids: [NSG-031]
  linked_requirement_ids: [NSR-044, NSR-045, NSR-046]
  source_ids: [SRC-031, SRC-043, SRC-044, SRC-046]
- id: NSP-038
  statement: Delivery is a durable idempotent transaction whose event, policy, effects, and replay authority survive Argo controller or EventBus loss.
  purpose: Prevents at-least-once or out-of-order webhook delivery, controller restart, and operator replay from repeating publication, status, merge, promotion, or rollback effects.
  linked_goal_ids: [NSG-031]
  linked_requirement_ids: [NSR-039, NSR-043, NSR-045]
  source_ids: [SRC-028, SRC-043, SRC-047]
- id: NSP-039
  statement: Candidate execution, trusted validation, status reporting, package publication, signing, and GitOps mutation use separate least-privilege principals.
  purpose: Prevents candidate-controlled code from self-certifying, overwriting immutable subjects, using signing material, or mutating desired state.
  linked_goal_ids: [NSG-031]
  linked_requirement_ids: [NSR-039, NSR-040, NSR-041, NSR-043]
  source_ids: [SRC-015, SRC-016, SRC-044, SRC-047]
- id: NSP-040
  statement: Recovery restores the internal authority as one coordinated control plane; a public mirror is not an implicit failback authority.
  purpose: Avoids split-brain source, identity, ledger, artifact, GitOps, and signing state after cutover while preserving a separately gated emergency authority-transfer option.
  linked_goal_ids: [NSG-031]
  linked_requirement_ids: [NSR-038, NSR-040, NSR-044, NSR-047]
  source_ids: [SRC-043, SRC-044, SRC-047]
milestones:
- id: NSM-001
  name: North Star planning loop implemented
  outcome: Triggerable research-ingest and planning skills, schemas, templates, evals, router stops, and docs exist for North Star planning.
  entry_criteria:
  - Transcript evidence has been routed.
  exit_criteria:
  - Validator recognizes the skill and schema.
  - Full package tests pass.
  requirement_ids: [NSR-001, NSR-002, NSR-005]
- id: NSM-002
  name: North Star locks for next milestone
  outcome: Product and architecture North Star artifacts are approved as planning authority for the next milestone.
  entry_criteria:
  - The self-improving North Star loop has produced coherent product and architecture drafts.
  exit_criteria:
  - Final lock approval is recorded in `northstar-artifacts.yaml`.
  requirement_ids: [NSR-003, NSR-004]
- id: NSM-003
  name: Current Gravity integration readiness
  outcome: The active Gravity pilot has current readiness, capability, API/MCP, citation, authorization, and release-promotion evidence.
  entry_criteria:
  - Current Gravity source, runtime, issues, accepted decisions, and deployment evidence are available.
  exit_criteria:
  - The owning Gravity records distinguish implemented, deployed, exposed, integrated, cited, and release-verified states.
  - Jason or James approves a Verdify Skills release that depends on the interface; Jason retains separate North Star lock authority.
  requirement_ids: [NSR-004, NSR-021, NSR-034, NSR-035]
- id: NSM-004
  name: Gravity evidence API and MCP adapter
  outcome: Gravity exposes a versioned tenant-scoped read-only HTTP API and consumer MCP adapter with resolvable citations.
  entry_criteria:
  - Current Gravity implementation and live-runtime evidence are registered.
  exit_criteria:
  - API/MCP parity, authorization, citation hydration, typed degradation, and live consumer proof exist.
  requirement_ids: [NSR-010, NSR-021, NSR-034]
- id: NSM-005
  name: Learning-capture loop design
  outcome: Proposal-only session mining and loop-readiness checks are specified before scheduled automation is enabled.
  entry_criteria:
  - Learning-loop evidence is registered.
  exit_criteria:
  - Proposal format, operator reference, reusable template, routing taxonomy, redaction rules, approval behavior, loop-readiness checklist, and cost-per-accepted-change metric are defined.
  requirement_ids: [NSR-011, NSR-012]
- id: NSM-006
  name: Capability-negotiated workflow facade
  outcome: A minimal workflow facade is specified for ideation through production using replaceable runtime adapters and negotiated Agent Platform capabilities.
  entry_criteria:
  - Runtime-adapter, Agent Platform, and end-to-end SDLC evidence is registered.
  exit_criteria:
  - Workflow skills, capability negotiation, stakeholder map, configured-provider and mirror primitive model, stages, gates, and pilot slice are documented.
  requirement_ids: [NSR-013, NSR-032]
- id: NSM-007
  name: Fleet repo-bootstrap readiness
  outcome: Repo-controller bootstrap is ready to run on a limited pilot repo without unsafe credential, namespace, storage, or approval ambiguity.
  entry_criteria:
  - Repo-controller bootstrap evidence is registered and synthesized into product and architecture drafts.
  exit_criteria:
  - Bootstrap inventory shape, repo-agent scope contract, namespace naming, credential-reference validation, storage mount request flow, controller observability, issue/PR output, and security gates are specified.
  requirement_ids: [NSR-022, NSR-023, NSR-024, NSR-025, NSR-027]
- id: NSM-008
  name: Trusted minimal Skills package
  outcome: Verdify Skills is internal-first, contains no deprecated compatibility surface, and publishes the exact tested artifact through an atomic recoverable transaction.
  entry_criteria:
  - Iteration 25 planning defaults are accepted for implementation planning.
  exit_criteria:
  - Supported inventory is minimal and consistent across package, docs, routing, and tests.
  - Trusted packing, publication, installation, atomic promotion, and rollback proofs exist.
  requirement_ids: [NSR-029, NSR-030, NSR-035]
- id: NSM-009
  name: Four-pilot integrated self-building slice
  outcome: Verdify Skills, Agent Platform, Orbit, and Gravity complete one shared, evidence-backed planning-to-runtime outcome under the root-planner outer loop.
  entry_criteria:
  - The common `PilotProject` and provider capability contracts are approved.
  - Owning-repository blockers and security gates are visible in the configured authority, with GitHub refs retained during coexistence.
  exit_criteria:
  - One cross-project slice has traceable issue, plan, dispatch, runtime, evidence, critic, review, deployment, and feedback records.
  - Each pilot retains local ownership and the root planner can resume the next iteration from durable state.
  requirement_ids: [NSR-028, NSR-031, NSR-032, NSR-033, NSR-034]
- id: NSM-010
  name: Customer consulting onboarding readiness
  outcome: The four-pilot platform can onboard a customer repository through the same governed method with customer-scoped trust and ownership.
  entry_criteria:
  - One internal four-project self-building slice is accepted with durable evidence.
  exit_criteria:
  - A customer project has project-owned planning, PilotProject status, scoped capabilities, tenant-safe evidence, CI/CD, review, deployment, and outcome acceptance without a parallel lifecycle.
  requirement_ids: [NSR-028, NSR-031, NSR-036]
- id: NSM-011
  name: Internal authority and immutable dependency foundation
  outcome: A capability-qualified supported Forgejo release, internal IdP, portfolio-work authority, raw-body event admission, durable delivery ledger, local mirrors, Zot namespaces, signing trust, GitOps authority, and coordinated recovery are approved and operational.
  entry_criteria:
  - Iteration 26 receives final North Star lock.
  - Owning Agent Platform and Verdify Skills issues, lane contracts, service owners, environments, and human gates exist.
  - "Closed issues #120 and #121 are recorded as completed absorbed predecessor contracts whose exact-package, atomic-install, protected-development, and release-only-main outcomes are preserved without redispatch."
  exit_criteria:
  - An isolated rehearsal proves repository, portfolio metadata, issue, pull request, review, required-status, audit, identity, backup, and restore contracts before any authority switch.
  - Delivery-ledger duplicate, replay, restart, and partial-effect tests pass without publishing, reporting, merging, promoting, or rolling back twice.
  - Every required dependency has an immutable local location; no load-bearing exception remains.
  requirement_ids: [NSR-038, NSR-039, NSR-042, NSR-043, NSR-046, NSR-049]
- id: NSM-012
  name: Local validation and package parity
  outcome: Trusted Forgejo event admission drives Argo validation and exact-package OCI publication through separated principals, a durable ledger, and transport-neutral status and evidence parity.
  entry_criteria:
  - NSM-011 is accepted.
  exit_criteria:
  - All five protected checks and deliberately failing fixtures have 100% logical and failure parity, zero false accepts, exact-head currentness, and trusted-issuer evidence on both paths.
  - The exact tested OCI subject and one signed immutable release envelope enumerate the complete pre-promotion package, provenance, SBOM, signing, attestation, source, protected-policy, test, and critic digests; the ledger records later approval, consumer, rollback, release, and mirror receipts.
  - At least twenty consecutive distinct successful end-to-end change transactions and at least three consecutive distinct successful release-and-rollback transaction pairs satisfy the approved queue, validation, health, and rollback objectives.
  requirement_ids: [NSR-039, NSR-040, NSR-043, NSR-045, NSR-048]
- id: NSM-013
  name: GitOps non-production and offline acceptance
  outcome: A stable digest-pinned harness Deployment installs and exercises the exact package subject from a fresh volume and is promoted and rolled back solely through Argo CD using a cold-node, public-egress-denied local supply chain.
  entry_criteria:
  - NSM-012 is accepted.
  exit_criteria:
  - Argo CD is Synced and Healthy at the candidate digest and again at the rollback digest.
  - The init path pulls and verifies the package subject and signed release envelope into a fresh volume; the main container performs a real install and functional probes before readiness.
  - Functional, failure-injection, coordinated recovery, empty-node/CRI-cache, node-and-controller-egress-denial, registry-audit, and delayed durability probes pass with correlated evidence.
  requirement_ids: [NSR-040, NSR-041, NSR-042, NSR-044, NSR-045, NSR-046, NSR-048]
- id: NSM-014
  name: Attended authority cutover and retirement
  outcome: The internal control plane becomes authoritative and GitHub Actions, public publication, and GitHub are retained only as declared output mirrors or explicitly retired dependencies.
  entry_criteria:
  - NSM-013 is accepted by an independent critic and human change-gate owner.
  - Coordinated snapshot/restore, dead-man, emergency authority-transfer, public support, observation-window, and retirement runbooks are approved.
  exit_criteria:
  - A four-hour attended GitHub-unavailable transaction, post-cutover delayed re-probe, and fourteen healthy days pass.
  - Required statuses, source/review authority, credentials, runners, workflows, deployments, issues, pull requests, and exception ledger reconcile to the approved target.
  - Internal Forgejo recovery proves RPO at or below five minutes and RTO at or below two hours; Git and public package mirrors meet their declared recovery/freshness targets.
  - Any destructive retirement has separate explicit human authority and recoverability evidence.
  requirement_ids: [NSR-038, NSR-044, NSR-045, NSR-046, NSR-047, NSR-048]
risks:
- id: NSK-001
  statement: The planning loop could become a parallel source of truth if project-definition and architecture artifacts do not consume it.
  impact: Agents may optimize against stale or duplicate planning records.
  mitigation: Treat `northstar-plan.yaml` as planning input and require one explicit lifecycle handoff.
  source_ids: [SRC-001, SRC-002]
- id: NSK-003
  statement: A UI-first or hard-coded-adapter platform plan could under-serve the root-planner workflow.
  impact: The system may over-invest in dashboard UX or a removed worker while leaving capability discovery and supported dispatch too weak for the intended operating model.
  mitigation: Treat Agent Platform as capability-negotiated and API/MCP-first; scope UI to inspection, review, recovery, and operator override.
  source_ids: [SRC-009, SRC-011, SRC-014, SRC-037, SRC-038, SRC-039]
- id: NSK-004
  statement: Treating old Sunshine or prior-Gravity material as current authority could redirect the active restarted Gravity project.
  impact: Planning and integrations could target stale paths, contracts, topology, or ownership rather than the deployed system.
  mitigation: Make current Gravity repository, runtime, decisions, and backlog authoritative; retain historical extraction evidence only as advisory provenance.
  source_ids: [SRC-009, SRC-013, SRC-032, SRC-038, SRC-041]
- id: NSK-005
  statement: Learning capture could become unreviewed self-modification if proposals are applied automatically.
  impact: Skills, hooks, commands, or config could drift from governance and encode a bad lesson.
  mitigation: Schedule scans only after source scope, verifier, durable state, stop/budget, permissions, and manual-run evidence are approved; require evidence, redaction, risk classification, and approval before applying changes.
  source_ids: [SRC-010, SRC-020, SRC-033]
- id: NSK-006
  statement: Recurring loops without verifiers, stop conditions, budgets, or acceptance metrics can spend tokens while producing low-quality output.
  impact: The system could optimize for activity rather than accepted improvement or reviewable progress.
  mitigation: Add loop-readiness checks and track cost per accepted change where practical.
  source_ids: [SRC-010, SRC-020, SRC-033]
- id: NSK-007
  statement: Runtime-adapter workflow state could drift into a competing source of truth if facades store private progress instead of reconciling configured-provider records, mirror state, and `.agent-workflow`.
  impact: Agents and reviewers could act on hidden or stale state, bypassing issue scope, PR evidence, human review, or deployment proof.
  mitigation: Require every workflow facade to name authoritative provider primitives, mirror roles, durable artifacts, stop conditions, and evidence before advancing.
  source_ids: [SRC-014, SRC-022, SRC-024, SRC-038, SRC-040]
- id: NSK-008
  statement: A control request artifact could be mistaken for execution authorization if the policy verdict, human gate, and target identity are incomplete.
  impact: Planner-generated requests could encourage unsafe or premature Agent Platform mutations.
  mitigation: Keep `agent-platform-control` under platform-readiness, validate requests before use, and block protected or production-affecting actions without explicit policy and review evidence.
  source_ids: [SRC-029]
- id: NSK-009
  statement: A GitHub backlog sync artifact could drift into a private backlog if actions are not applied through GitHub or the named durable control plane.
  impact: Sprint planning could execute stale local intent instead of the authoritative issue, PR, dependency, check, or deployment state.
  mitigation: Treat snapshots as caches, require source freshness and limitations, and record every proposed action with its authoritative apply-through path.
  source_ids: [SRC-030]
- id: NSK-010
  statement: Environment GitOps reconciliation could be mistaken for mutation approval if desired-state drift or protected-environment gates are incomplete.
  impact: Agents could advance review or release with unsafe namespace policy, stale desired state, missing runtime proof, or unauthorized protected-environment changes.
  mitigation: Keep `environment-gitops` under platform-readiness, require explicit desired/observed state, drift, remediation, rollback, cleanup, and review fields, and route mutation through authorized control planes only.
  source_ids: [SRC-031]
- id: NSK-011
  statement: A healthy Gravity deployment or successful query could be mistaken for an integrated evidence capability when citations or MCP transport remain incomplete.
  impact: Other pilots could trust uncited results, bypass authorization parity, or claim integration before the consumer path exists.
  mitigation: Require current readiness to distinguish implementation, deployment, exposure, integration, citations, and release verification and prove API/MCP parity.
  source_ids: [SRC-032, SRC-013, SRC-038, SRC-041]
- id: NSK-012
  statement: Fleet bootstrap could expose secrets or overstate access if credential validation records raw values or lacks scoped probes.
  impact: Sensitive credentials could leak into artifacts or agents could make unsafe assumptions about production access.
  mitigation: Record only credential references, auth modes, scopes, owners, validation results, and failure modes; require platform/security approval for broad access.
  source_ids: [SRC-034, SRC-016]
- id: NSK-013
  statement: Repo controllers could mutate namespace, storage, route, or image policy before the platform contract is approved.
  impact: Repos could drift into inconsistent runtime topology, broken mounts, route conflicts, or unreviewed base images.
  mitigation: Gate self-service mutation behind platform-readiness contracts, storage/network owners, GitOps desired state, and PR/review paths.
  source_ids: [SRC-034, SRC-031]
- id: NSK-014
  statement: Orbit's broad personal, enterprise, and engineering context could become a parallel source of truth or an overpowered confused deputy.
  impact: Human review could act on stale summaries, and untrusted messages or documents could influence GitHub, Kubernetes, calendar, or outbound actions through one shared principal.
  mitigation: Reconcile engineering decisions to authoritative records, separate personal-context and fleet-actuation principals, enforce read/propose/write capabilities, and preserve provenance, freshness, tenant, and source ACLs.
  source_ids: [SRC-034, SRC-030, SRC-038, SRC-040]
- id: NSK-015
  statement: Repo-associated agents could overreach if scope and responsibility are left in chat, pod state, or informal AGENTS.md prose only.
  impact: A controller might mutate paths, credentials, namespaces, storage, routes, or GitHub state outside its intended authority.
  mitigation: Require a validated `repo-agent-scope.yaml` before operational ownership; route missing or overbroad authority through platform/security or repo-owner review.
  source_ids: [SRC-034, SRC-036]
- id: NSK-016
  statement: Four co-equal pilots could drift into four incompatible planning and capability models.
  impact: The root planner could not compare readiness, route dependencies, or resume work consistently across projects.
  mitigation: Define one versioned `PilotProject` contract and require owning-repository reconciliation for project-specific gaps.
  source_ids: [SRC-037, SRC-038, SRC-039, SRC-040, SRC-041]
- id: NSK-017
  statement: The root planner could become a hidden super-project that absorbs pilot ownership or bypasses the configured source/backlog authority.
  impact: Portfolio coordination would become opaque, non-resumable, and difficult to challenge or audit.
  mitigation: Limit the root planner to shared vision, priority, dependency, gate, evidence, and handoff coordination; preserve pilot backlogs and approvals.
  source_ids: [SRC-038, SRC-039, SRC-040, SRC-041]
- id: NSK-018
  statement: Publishing different bytes than the artifact tested or validating through preexisting target content creates a package supply-chain boundary failure.
  impact: A release can pass CI yet install unreviewed or attacker-controlled behavior.
  mitigation: Test the exact pack, bind it to a digest, stage into a fresh directory, validate trusted code and manifests, atomically promote, and retain rollback evidence.
  source_ids: [SRC-037, SRC-038]
- id: NSK-019
  statement: Retaining deprecated capability for hypothetical users will expand the skill graph and validator burden without product value.
  impact: Planning becomes harder to understand, compatibility bugs accumulate, and every release carries unnecessary surface area.
  mitigation: Delete deprecated skills, routes, schemas, docs, tests, and aliases unless a new explicit compatibility decision is approved.
  source_ids: [SRC-037, SRC-038]
- id: NSK-020
  statement: Orbit connectors could copy raw personal or enterprise material into source Git or a shared engineering trust domain.
  impact: Private, biometric, health, email, meeting, contact, or enterprise data could leak, persist beyond deletion, or cross tenants.
  mitigation: Use approved encrypted storage, preserve source ACL and retention, log metadata rather than bodies, and add negative privacy and deletion-propagation tests.
  source_ids: [SRC-038, SRC-040]
- id: NSK-021
  statement: An ASAP objective without a bounded first slice could turn into parallel platform hardening with no delivered cross-project outcome.
  impact: Activity rises while the integrated self-building loop remains unproved.
  mitigation: Prioritize the smallest cross-project slice that proves planning, supported dispatch, cited Gravity evidence, governed Orbit context, critic review, and resumable state.
  source_ids: [SRC-038, SRC-039, SRC-040, SRC-041]
- id: NSK-022
  statement: Replacing workflow execution without replacing source, review, status, and promotion authority would leave GitHub load-bearing behind a local façade.
  impact: GitHub unavailability would still halt delivery while the migration appeared complete.
  mitigation: Gate cutover on Forgejo authority contract tests and an attended GitHub-unavailable end-to-end transaction.
  source_ids: [SRC-043, SRC-044]
- id: NSK-023
  statement: Generic Agent Fleet workflows still clone GitHub and reference public tool and base images.
  impact: A cold node or external outage would fail local validation and packaging even if Argo controllers were healthy.
  mitigation: Mirror and digest-pin every executable dependency, deny public egress in acceptance, and keep a fail-closed exception ledger.
  source_ids: [SRC-043, SRC-044]
- id: NSK-024
  statement: Modeling a package repository as an ordinary runtime image could publish or deploy bytes that consumers never install.
  impact: Green container health would not prove the Verdify package artifact or installer behavior.
  mitigation: Publish a package-specific OCI subject and use a dedicated GitOps-owned consumer workload that installs and exercises its exact digest.
  source_ids: [SRC-037, SRC-044, SRC-045]
- id: NSK-025
  statement: Dual-running GitHub and local checks can diverge in names, permissions, stale-head handling, or failure semantics.
  impact: One control plane may accept a change that the other rejects, undermining reviewer trust and rollback.
  mitigation: Maintain a machine-readable parity matrix, common fixtures, exact-head correlation, and discrepancy gates throughout coexistence.
  source_ids: [SRC-043, SRC-044]
- id: NSK-026
  statement: Event replay, duplicate delivery, or controller restart could promote a stale revision or repeat a non-idempotent side effect.
  impact: Unreviewed bytes could be published or desired state could regress.
  mitigation: Bind events, statuses, approvals, artifacts, and promotions to immutable heads and idempotency keys; inject duplicates and restarts before cutover.
  source_ids: [SRC-028, SRC-043, SRC-045]
- id: NSK-027
  statement: Repository-scoped access cannot currently prove live Argo health, Zot contents, cluster ownership, or all organization-level GitHub dependencies.
  impact: Planning may omit an unseen control or claim readiness from incomplete evidence.
  mitigation: Retain each unknown in the exception ledger and require owner-scoped read-only probes before the relevant milestone can close.
  source_ids: [SRC-044, SRC-046]
- id: NSK-028
  statement: Removing Actions workflows, credentials, releases, packages, or protection before the observation window closes could make rollback slow or destructive.
  impact: A post-cutover failure could strand development or lose recoverable release state.
  mitigation: Separate authority cutover from retirement, keep mirror publication and snapshots during the observation window, and require a second explicit retirement gate.
  source_ids: [SRC-043, SRC-044, SRC-046]
- id: NSK-029
  statement: A Forgejo push mirror does not preserve issue, pull-request, review, required-status, comment, portfolio, or audit authority.
  impact: Treating Git mirroring as control-plane migration would lose governance history or leave GitHub load-bearing.
  mitigation: Define provider-neutral canonical IDs, migrate and mark historical records, preserve cross-system links, and contract-test every authority class before switch.
  source_ids: [SRC-044, SRC-047]
- id: NSK-030
  statement: Generic Argo webhook authentication does not itself prove Forgejo raw-body HMAC verification, replay prevention, or event ordering.
  impact: Forged, duplicated, reordered, or replayed events could execute candidate workflows or repeat privileged effects.
  mitigation: Use a dedicated raw-body admission service and durable effect ledger with payload hashes, unique transaction keys, compare-and-set states, authorized replay, and immutable archives.
  source_ids: [SRC-045, SRC-047]
- id: NSK-031
  statement: OCI referrers can appear separately and do not make a release graph atomic.
  impact: Consumers or approvers could observe a package before all required evidence or verify a mutable subset of the release.
  mitigation: Gate promotion on one signed immutable release envelope that enumerates every required pre-promotion subject and referrer digest; advance its lifecycle through explicit durable-ledger states and receipts without mutating the envelope.
  source_ids: [SRC-045, SRC-047]
- id: NSK-032
  statement: Candidate workloads with default service-account tokens, forge credentials, status rights, registry writes, signing material, or GitOps access can self-certify or escape the intended trust boundary.
  impact: Untrusted pull-request code could publish, approve, sign, report success, or deploy itself.
  mitigation: Disable token automount and separate candidate, validator, status, publisher, signer, mirror, and GitOps principals with deny-by-default network and credential boundaries.
  source_ids: [SRC-015, SRC-016, SRC-047]
- id: NSK-033
  statement: Restoring only Git data after cutover can produce split-brain identity, policy, ledger, artifact, signing, and desired-state histories.
  impact: The internal authority may resume with unverifiable approvals, missing artifacts, stale protection, or divergent deployments.
  mitigation: Snapshot and restore Forgejo metadata, IdP, protection, webhooks, ledger/archive, Zot/referrers, signing trust, GitOps desired state, and evidence as one tested recovery set.
  source_ids: [SRC-044, SRC-047]
- id: NSK-034
  statement: Running a forge, persistent event plane, workflow system, registry, signer, GitOps controller, evidence store, and mirrors without explicit capacity and ownership can exceed the value of replacing Actions.
  impact: Cost, queueing, upgrade toil, and on-call burden could rise without a sustainable operating model.
  mitigation: Lock a bounded pilot envelope, measure operator hours and resource use, name service owners, and require explicit approval before exceeding concurrency, storage, duration, or support thresholds.
  source_ids: [SRC-043, SRC-047]
- id: NSK-035
  statement: Switching public publication surfaces without a declared proprietary/source-available use and contributor-rights contract can silently grant the wrong impression, accept code without adequate rights, break authorized users, or lose security reporting.
  impact: Visitors may mistake `UNLICENSED` for no GitHub-platform rights or for a broad off-platform/package grant, maintainers may accept code without a CLA/assignment, authorized users may install stale bytes, or reports may go to an unattended mirror.
  mitigation: Publish GitHub-Terms rights plus the legal/IP-approved scope of any additional project/off-platform/package grant, reject external code until an approved CLA/assignment intake exists, and declare authority, freshness, outage, issue, vulnerability, deprecation, and support semantics before mirror-only operation; preserve separately gated licensing, intake, and retirement decisions.
  source_ids: [SRC-043, SRC-047]
adversarial_findings:
- id: ADV-001
  perspective: architect
  finding: A planning artifact that duplicates project definition fields could create competing truth unless its handoff and authority are explicit.
  disposition: accepted
  owner: Skills maintainer
- id: ADV-002
  perspective: SRE
  finding: Gravity readiness cannot be judged from planning artifacts alone; platform observability and runtime evidence are required.
  disposition: accepted
  owner: Platform readiness owner
- id: ADV-003
  perspective: finance
  finding: Local-first infrastructure and one-wave-per-day ambitions need later cost and capacity evidence before becoming commitments.
  disposition: deferred
  owner: State-of-union owner
- id: ADV-004
  perspective: architect
  finding: The current evidence points to a root-planner outer loop, a shared Skills method layer, and four co-equal pilot ownership domains; treating a runtime adapter or one pilot as globally authoritative would make the platform hard to reason about.
  disposition: accepted
  owner: Architecture owner
- id: ADV-005
  perspective: maintainer
  finding: Sunshine Club is valuable reuse evidence but is still coupled to Sunshine naming, paths, env vars, taxonomy, and business stories.
  disposition: accepted
  owner: Gravity readiness owner
- id: ADV-006
  perspective: security/privacy
  finding: Session-mining learning capture can expose secrets, personal data, or sensitive operational context if redaction is not a first-class step.
  disposition: accepted
  owner: Skills maintainer and security owner
- id: ADV-007
  perspective: cost/TCO
  finding: Loop count and token spend are weak success metrics; cost per accepted change and proposal acceptance rate better reflect useful automation.
  disposition: accepted
  owner: Controller-loop owner
- id: ADV-008
  perspective: operator/security
  finding: An external OpenClaw planner can make the SDLC easier to drive, but it must remain a constrained MCP/API client and workflow facade rather than a broad shell, browser, filesystem, dashboard, or production mutation surface.
  disposition: accepted
  owner: Platform and security owner
- id: ADV-009
  perspective: security/privacy
  finding: A bootstrap workflow that validates secrets and credentials is useful only if it never records raw secret material and cannot silently expand repo-agent authority.
  disposition: accepted
  owner: Platform and security owner
- id: ADV-010
  perspective: SRE
  finding: Controller availability, pod health, loop throughput, and alert-to-agent recovery need explicit telemetry and runbooks before fleet-scale autonomy is credible.
  disposition: accepted
  owner: Controller-loop owner
- id: ADV-011
  perspective: operator
  finding: Orbit's broad personal-assistant and engineering-chief-of-staff context is valuable, but it must preserve source authority and cannot share one unconstrained trust domain with fleet actuation.
  disposition: accepted
  owner: Orbit/platform owner
- id: ADV-012
  perspective: security
  finding: The installer trust boundary is unsafe unless the exact tested package is staged, validated by trusted code, atomically promoted, and recoverable without executing preexisting target content.
  disposition: gate_required
  owner: Skills release owner
- id: ADV-013
  perspective: maintainer
  finding: Backward-compatibility shims and deprecated skills impose permanent graph, documentation, routing, and testing cost without an identified user requirement.
  disposition: accepted
  owner: Skills maintainer
- id: ADV-014
  perspective: product
  finding: The previous hierarchy does not match the actual portfolio; Skills, Agent Platform, Orbit, and Gravity are all active pilots that must integrate without surrendering local ownership.
  disposition: accepted
  owner: Root planner and pilot owners
- id: ADV-015
  perspective: integration
  finding: Agent Platform cannot support the outer loop through a removed or hard-coded worker surface; the planner needs versioned capability discovery, supported dispatch, and typed degradation.
  disposition: accepted
  owner: Agent Platform owner
- id: ADV-016
  perspective: privacy/security
  finding: Orbit's current shared principal would combine broad personal context with sibling-pod and engineering actuation authority, creating a confused-deputy and prompt-injection blast radius.
  disposition: gate_required
  owner: Orbit and platform security owners
- id: ADV-017
  perspective: data governance
  finding: Raw personal material in source Git and missing connector read-audit rules are incompatible with a broad personal and enterprise information layer.
  disposition: gate_required
  owner: Orbit owner and privacy owner
- id: ADV-018
  perspective: consumer
  finding: Gravity search returning allowed hits without resolvable evidence spans is not sufficient evidence-interface readiness even when HTTP status and deployment health are green.
  disposition: accepted
  owner: Gravity owner
- id: ADV-019
  perspective: delivery
  finding: Protected development integration and release-only main promotion are needed to keep the exact reviewed artifact aligned with publication and rollback evidence.
  disposition: accepted
  owner: Skills release owner
- id: ADV-020
  perspective: user
  finding: A maintainer cannot regard the migration as successful if a GitHub outage still prevents source push, review, required statuses, merge, package retrieval, or rollback.
  disposition: accepted
  owner: Skills maintainer and Agent Platform owner
- id: ADV-021
  perspective: administrator
  finding: Forgejo introduces identity, backup, restore, upgrade, email, webhook, abuse, and repository-migration duties that are absent from a workflow-only proposal.
  disposition: gate_required
  owner: Platform and source-control owners
- id: ADV-022
  perspective: auditor
  finding: Renamed checks or copied release files do not prove policy parity unless exact heads, reviewer identities, artifact digests, evidence retention, and audit correlation remain verifiable.
  disposition: accepted
  owner: Skills governance and audit owners
- id: ADV-023
  perspective: architect
  finding: Reusing the image-only Agent Fleet CI schema for a package repository would conflate build mechanics with the released product contract.
  disposition: accepted
  owner: Skills and Agent Platform architecture owners
- id: ADV-024
  perspective: SRE
  finding: Warm-cache success and immediate health checks conceal cold-start, cache-population, retry, replay, controller-restart, and delayed-failure modes.
  disposition: accepted
  owner: Platform SRE owner
- id: ADV-025
  perspective: scalability
  finding: One-off repository Sensors, WorkflowTemplates, and registry conventions will not scale across the fleet and will make upgrades inconsistent.
  disposition: accepted
  owner: Agent Platform owner
- id: ADV-026
  perspective: finance
  finding: Running dual forges, dual CI, mirrored package paths, extra retention, and cold-node tests has a real storage and operator cost.
  disposition: accepted
  owner: Platform and finance owners
- id: ADV-027
  perspective: security
  finding: A local control plane can increase risk if webhook trust, workflow service accounts, registry write scope, signing keys, mirror credentials, or GitOps mutation rights are broader than the GitHub path.
  disposition: gate_required
  owner: Platform security owner
- id: ADV-028
  perspective: product/business
  finding: GitHub remains the fleet work source of truth in current operating policy, so repository-local forge authority needs an explicit portfolio-work migration and public-collaboration contract.
  disposition: gate_required
  owner: Root planner, product owner, and source-control owner
- id: ADV-029
  perspective: architecture
  finding: Git push mirroring cannot migrate issues, pull requests, reviews, statuses, comments, projects, or audit history and therefore cannot serve as control-plane failback.
  disposition: accepted
  owner: Source-control and migration owners
- id: ADV-030
  perspective: security
  finding: A generic Argo EventSource webhook is insufficient as the trusted Forgejo event boundary without raw-body signature verification, replay controls, and a durable transaction/effect ledger.
  disposition: gate_required
  owner: Platform security and event-plane owners
- id: ADV-031
  perspective: security
  finding: A required status is not trustworthy unless its canonical change, exact head and base, issuer, protected policy digest, attempt, currentness, and evidence are verified independently of candidate code.
  disposition: gate_required
  owner: Governance and status-service owners
- id: ADV-032
  perspective: supply-chain
  finding: OCI referrers are not an atomic release transaction; a signed immutable release envelope and separated publisher and signer principals are required.
  disposition: gate_required
  owner: Skills release and platform security owners
- id: ADV-033
  perspective: SRE
  finding: Cold-node acceptance must cover empty node and CRI caches plus node, gateway, controller, and repository-server egress, and recovery must restore the whole coordinated control plane.
  disposition: gate_required
  owner: Platform SRE and disaster-recovery owners
- id: ADV-034
  perspective: operations/finance
  finding: The proposal needs named service ownership, capacity, cost, support, RPO/RTO, latency, and observation thresholds before dual-running infrastructure can be approved.
  disposition: accepted
  owner: Agent Platform and finance owners
- id: ADV-035
  perspective: delivery
  finding: "Closed package-trust and protected-development issues #120 and #121 must be recorded as completed absorbed predecessors so the migration neither bypasses nor redispatches their security outcomes."
  disposition: accepted
  owner: Skills maintainer and release owner
open_questions:
- id: NSQ-009
  question: 'Deferred, nonblocking owner work: which session sources, retention windows, and redaction rules should the learning-capture loop use? Locked default: explicit research artifacts plus redacted local Codex/Claude/terminal summaries, proposal-only output, and loop-readiness proof before scheduling.'
  owner: Skills maintainer and security owner
  blocking: false
  source_ids: [SRC-010, SRC-020, SRC-033]
- id: NSQ-010
  question: 'Deferred, nonblocking owner work: validate a collision-safe owner/repository plus environment namespace convention for fleet bootstrap.'
  owner: Platform and security owner
  blocking: false
  source_ids: [SRC-034, SRC-031]
- id: NSQ-011
  question: 'Deferred, nonblocking owner work: validate the locked model-neutral controller default and select Codex, Claude, or successors per supported task capability and failure mode.'
  owner: Platform architecture owner
  blocking: false
  source_ids: [SRC-034, SRC-014, SRC-022]
- id: NSQ-012
  question: 'Deferred, nonblocking owner work: define named infrastructure-domain agent scope, owner, audit, approval, and rollback under the locked least-privilege default.'
  owner: Jason, platform owner, and security owner
  blocking: false
  source_ids: [SRC-034, SRC-016]
- id: NSQ-013
  question: 'Deferred, nonblocking owner work: validate typed platform control requests or PR-reviewed desired state for mounts, routes/DNS, namespaces, and base-image packages.'
  owner: Platform, storage, and networking owners
  blocking: false
  source_ids: [SRC-034, SRC-031]
- id: NSQ-015
  question: 'Final-lock decision: approve a capability-qualified supported Forgejo release (v16 is the current review candidate) as the internal primary source, repository issue, pull-request, review, required-status, and protected-branch authority, with GitHub retained as an output mirror through coexistence and the observation window?'
  owner: OWN-001, OWN-002, OWN-003, OWN-004, OWN-005, OWN-006, and OWN-009 advise; Jason makes the separate final decision
  blocking: true
  source_ids: [SRC-017, SRC-043, SRC-044, SRC-045, SRC-046, SRC-050, SRC-051]
- id: NSQ-016
  question: 'Final-lock decision: approve a package-specific Zot OCI subject, a signed immutable envelope for the complete pre-promotion graph, durable later-effect receipts, and a stable-harness/fresh-volume GitOps consumer as the authoritative Verdify release and deployed-acceptance model?'
  owner: OWN-001, OWN-002, OWN-004, OWN-005, OWN-006, OWN-008, and OWN-009 advise; Jason makes the separate final decision
  blocking: true
  source_ids: [SRC-007, SRC-031, SRC-037, SRC-043, SRC-044, SRC-045, SRC-047]
- id: NSQ-017
  question: 'Final-lock decision: keep GitHub source, npm, and GitHub Releases as best-effort proprietary/source-available mirrors that preserve GitHub users in-Service public-repository rights, make no additional project grant beyond GitHub Terms and applicable law for off-platform/package use unless separately approved, accept issue/security reports but reject external code until approved CLA or copyright-assignment terms exist, declare freshness/outage/verification/support, and defer licensing, intake, or retirement changes to separate gates?'
  owner: OWN-001, OWN-009, and OWN-010 advise; Jason makes the separate final decision
  blocking: true
  source_ids: [SRC-038, SRC-043, SRC-044, SRC-046, SRC-047, SRC-048, SRC-049]
- id: NSQ-018
  question: 'Final-lock decision: approve migration of the load-bearing repository and portfolio work authority—including provider-neutral issue and change IDs, portfolio metadata, historical-import markers, and cross-system links—while retaining jvallery/agents#3044 as the GitHub-side global migration record, natively blocked by shared platform issue #3047, until cutover reconciliation?'
  owner: OWN-001, OWN-002, OWN-003, OWN-004, and OWN-009 advise; Jason makes the separate final decision
  blocking: true
  source_ids: [SRC-043, SRC-044, SRC-047, SRC-050, SRC-051]
- id: NSQ-019
