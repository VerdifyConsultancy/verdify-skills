  - NSE-20260623-environment-gitops-implementation-best-p
  - NSE-20260709-verdify-skills-adversarial-review
  - NSE-20260727-verdify-skills-local-delivery-inventory
  - NSE-20260727-local-delivery-control-plane-primary-sources
  - NSE-20260727-local-delivery-adversarial-audit
  proposed_resolution: Require one identity-bound accept, revise, or reject row for every applicable NSQ-016/OWN-* pair before Jason decides. Treat the consumer as an acceptance workload; promote only the signed envelope digest, use a digest-pinned harness whose init path verifies into a fresh volume and whose main path performs a real install, and require Argo CD sole ownership, rollback, and delayed durability proof.
- id: NSQ-017
  artifact: both
  question: Keep GitHub source, npm, and GitHub Releases as best-effort proprietary/source-available mirrors that preserve GitHub's in-Service public-repository rights, make no additional project grant beyond GitHub's Terms and applicable law for off-platform/package use unless separately approved, accept issue/security reports but reject external code until approved CLA or copyright-assignment terms exist, declare freshness/outage/verification/support, and defer licensing, intake, or retirement changes to separate gates?
