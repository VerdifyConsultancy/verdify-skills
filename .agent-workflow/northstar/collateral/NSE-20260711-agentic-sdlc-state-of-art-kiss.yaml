claims:
- High-volume vendor reports from Stripe and Spotify describe a small deterministic
  controller around isolated replaceable coding agents, narrow tool sets, deterministic
  verification, bounded repair, existing Git and CI delivery infrastructure, and human
  review.
- The Agent Skills specification supports progressive-disclosure playbooks, while
  its official evaluation guidance begins with realistic clean-context with-skill
  and without-skill cases; experimental allowed-tools metadata is not an authorization
  boundary.
- ACP standardizes worker-session capabilities, MCP standardizes tools and resources,
  Kubernetes reconciles process state, and durable workflow systems still require
  idempotency for at-least-once external effects; none replaces delivery authority
  and outcome policy.
- DORA and METR evidence does not support a universal agent productivity claim and
  instead supports measuring accepted outcomes, stability, intervention, cost, and
  defects against a local baseline.
- At dev revision 4fe6ff65338bb129cbfbeb2451cb5a5fa696533d, Verdify repository validation
  and the full test suite pass for 28 skills and 49 schemas, and published release
  1.3.0 is bound to source revision 416caf3ff005cdb78b58b7c991351edd627fd00b.
- Local inspection found unproven or fail-open areas in consumer host-path preservation,
  critic criterion coverage, diff-to-contract enforcement, executable skill evaluation,
  resume behavior, provider-neutral dispatch, and crash or duplicate-effect recovery.
planning_relevance:
- 'Supports Verdify Skills #116 and the next state-of-union strategy refresh with
  a build, reuse, and stop-doing boundary.'
- 'Proposes a smaller proof sequence before the approved four-project target: security
  and truth floor, behavior evaluation, one single-repo lane, one runtime-changing
  lane, one narrow cross-project dependency, then the correlated slice.'
- Preserves GitHub authority, one-lane identity, exact-head independent review, distinct
  deploy and outcome proof, and four co-equal project ownership while challenging
  hardcoded dispatch and unmeasured artifact growth.
limitations:
- Vendor reports, specifications, stars, downloads, and benchmarks are not operational
  proof for Verdify; claims are labeled by evidence level.
- An initial GitHub GraphQL quota exhaustion recovered; the 2026-07-11 open-issue
  snapshot is point-in-time and must still be re-queried before execution.
- The report contains architecture proposals that require normal North Star and authority
  review; ingestion does not approve them.
