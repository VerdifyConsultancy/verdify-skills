claims:
- Reliable long-running agents need incremental tasks, durable progress, authoritative
  reconstruction, clean checkpoints, and end-to-end verification.
- A deterministic workflow spine plus bounded agent workers is a stronger fit than
  either a free-running root model or a fully hardcoded workflow.
- Agent quality requires outcome and trace evaluation, production monitoring, and
  periodic human calibration; schema validity alone is insufficient.
- Autonomy should be risk-proportional and intervention-ready rather than gated by
  per-action approval or enabled by universal auto-approval.
- Cross-project tools require versioned capability, identity, authorization, least-privilege
  scope, telemetry, and typed failure contracts.
- The first safe scale milestone is one fully verified four-project vertical slice,
  followed by fleet and customer rollout through the same contract.
