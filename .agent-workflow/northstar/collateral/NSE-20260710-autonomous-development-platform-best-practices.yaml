claims:
- Anthropic distinguishes predefined workflows from model-directed agents and recommends
  using the simplest agentic pattern that fits the task.
- Long-running-agent harness guidance uses incremental tasks, durable requirements and
  progress records, clean Git checkpoints, and end-to-end verification across sessions.
- Durable workflow execution uses persisted event history, replay, worker separation,
  retries, timers, and visibility to recover after failures.
- Agent evaluation guidance combines outcome grading, trace inspection, repeatable
  datasets, pre-deployment evaluations, production monitoring, and calibrated human
  review.
- Effective autonomy oversight emphasizes risk-sensitive autonomy, trustworthy visibility,
  uncertainty-aware stops, and simple human interruption.
- Secure MCP integrations should reject token passthrough, validate token audience,
  enforce server-side authorization, minimize scopes, preserve identity boundaries,
  and correlate authorization events.
- Portable GenAI telemetry conventions cover agents, model calls, events, metrics,
  and MCP operations; SLSA provenance links artifacts to sources and build processes.
planning_relevance:
- 'Supports issue #116 and the iteration-25 four-project root-planner execution strategy.'
- Verdify infers that a deterministic durable lifecycle spine with bounded model workers
  fits its approved architecture; the cited sources do not prescribe that product-specific
