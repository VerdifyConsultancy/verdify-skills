claims:
- Every production system that lets an AI verdict satisfy a merge gate (Cloudflare,
  Rewind, Intercom, Customer.io) pairs it with risk tiering and deterministic policy
  code; none runs always-on uniform heavyweight ceremony.
- The artifact-ceremony ceiling with demonstrated retention is 3-4 artifacts per feature
  (Kiro, Spec Kit, BMAD Quick Flow); verdify's measured internal overhead is ~5:1
  ceremony-to-code commits, 3 PRs and 9 artifacts per lane.
- 'The fresh-session independent critic is the single best-evidenced multi-agent pattern
  for code (Cognition: ~2 bugs/PR, 58% severe; LLM self-preference-bias and self-correction
  research), while deliberative consensus committees underperform their best member
  by up to 37.6%.'
- npm staged publishing (GA 2026-05) plus GitHub immutable releases and Rekor-logged
  provenance natively provide exact-tarball retention, inspection, and gated atomic
  go-live, superseding verdify's bespoke release-transaction ledger.
- 'GitHub runs Claude and Codex coding agents natively (Agent HQ), commoditizing the
  dispatch layer issue #12 planned to negotiate bespoke adapters for.'
- Capability scaffolding depreciates on METR's ~89-day task-horizon doubling; trust
  scaffolding (dispatch immutability, critic-before-merge, release gates, protected-base
  policy) endures.
