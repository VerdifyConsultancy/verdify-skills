    summary: Defines the approved recovery and trusted-release sequence.
  - id: RDI-003
    source: live GitHub issues, PRs, checks, deployments, environments, and protections through 2026-07-10T02:54:28Z
    evidence_status: verified
    summary: Establishes backlog, delivery, publication, and policy reality.
  - id: RDI-004
    source: git branches, remote refs, worktrees, and recovery commits fe1f94e/f425515
    evidence_status: verified
    summary: Establishes accepted, proposed, superseded, and cleanup-gated local state.
  - id: RDI-005
    source: clean detached make test at dev@442069ebc49f8622f2ac1f72a4d4ccbee3206564
    evidence_status: verified
    summary: Proves the source repository gate independently of the ignored scheduler file.
runtime_context:
  namespaces: []
  storage_mounts:
    - /Users/jason/repos/verdify-skills (primary repository checkout)
    - Temporary issue worktrees under approved local worktree roots or /tmp for detached validation
  routes:
    - https://github.com/VerdifyConsultancy/verdify-skills
    - https://www.npmjs.com/package/@verdify-cli/cli
  credential_refs:
    - Local GitHub CLI jvallery authentication (credential value excluded)
    - GitHub npm environment and OIDC trusted-publishing identity (credential value excluded)
    - Private GitHub security advisory access through authorized repository authentication
  observability_refs:
    - GitHub required checks and Actions workflow runs
    - GitHub deployments and releases
    - npm package metadata and provenance surfaces
    - Verdify release-verification and outcome-review artifacts
escalation_paths:
  - trigger: Product intent, North Star authority, architecture boundary, or protected scope is missing or contradictory.
    owner: Jason Vallery
    route: northstar-planning, project-definition, architecture-contracts, or a durable human gate
    blocking: true
  - trigger: Independent review identity or current-head approval cannot be satisfied.
    owner: Repository maintainers
    route: "issue #121 and sprint-orchestrator gate-management"
    blocking: true
  - trigger: Package, provenance, partial publication, or private history state is unsafe or inconsistent.
    owner: Release maintainer and security owner
    route: "issue #120 and release-verification"
    blocking: true
  - trigger: Recovery content or ref deletion is ambiguous.
    owner: Jason Vallery
    route: "issue #126 or a repo-hygiene gate"
    blocking: true
  - trigger: Agent Platform, Orbit, or Gravity runtime evidence is required.
    owner: Owning project controller
    route: platform-readiness, gravity-readiness, or the owning repository issue
    blocking: true
