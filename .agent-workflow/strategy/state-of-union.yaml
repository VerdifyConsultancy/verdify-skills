north_star:
  goal: >-
    Deliver a durable method and planning layer that converts human intent and
    evidence into bounded, independently reviewed, exactly released, and
    runtime-verifiable work across Verdify projects.
  alignment_status: aligned
  source_refs: [IN-001, IN-002, IN-003, IN-004]
current_state:
  summary: >-
    Recovery, package integrity, and version 1.3.0 release safety are integrated
    and terminal on dev. Main, npm, and GitHub release remain at 1.2.1. The only
    blocking delivery gap is issue #121: dev is unprotected, main lacks review,
    CODEOWNERS is ineffective, and the open James-authored PR #189 needs a
    candidate-side bootstrap policy plus real Jason approval before promotion.
  lifecycle_state: READY
  active_sprint: null
  open_gates: []
  delivery_risks:
    - Dev is unprotected, so ordinary integrations are not machine-bound to PRs, current checks, or critic evidence.
    - Main requires old checks but no review; its 1.2.1 trusted policy cannot validate the 1.3.0 candidate body on PR #189.
    - Workflow tokens cannot approve PR reviews, so dev must use transport-neutral critic status and releases must use a real non-author owner review.
    - Rescue refs and the shared recovery checkout must remain until 1.3.0 reaches main and cleanup is verified.
