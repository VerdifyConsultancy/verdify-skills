recommended_sequence:
  - id: SEQ-000
    outcome: Make a committed approved state-of-union routable without accepting unrelated post-assessment changes.
    issue_ids: [143]
    prerequisites:
      - Approved state-of-union artifact assessed at a full ancestor SHA.
    risks:
      - An overly broad suffix rule could accept stale strategy after implementation changes.
    depends_on: []
  - id: SEQ-001
    outcome: Make manifest and package file selection independent of ignored and untracked host state.
    issue_ids: [130]
    prerequisites:
      - Approved release-package architecture and issue acceptance.
    risks:
      - A tracked package input could be accidentally omitted if the allowlist is incomplete.
    depends_on: [SEQ-000]
  - id: SEQ-002
    outcome: Selectively recover timeline-historian, missing evidence, and a final ref-disposition ledger.
    issue_ids: [126]
    prerequisites:
      - Reproducible shipped-file selection from issue #130.
      - Exact recovery refs fe1f94e and f425515 remain available.
    risks:
      - Wholesale replay would regress current lifecycle and release work.
      - Newly registered evidence may restart North Star synthesis before later sprint planning.
    depends_on: [SEQ-001]
  - id: SEQ-003
    outcome: Build, test, and recover one exact immutable package publication transaction.
    issue_ids: [120]
    prerequisites:
      - Final recovered package shape from SEQ-002.
      - Canonical shipped-file selection from SEQ-001.
    risks:
      - Partial npm publication must resume without creating duplicate release issues.
    depends_on: [SEQ-001, SEQ-002]
  - id: SEQ-004
    outcome: Enforce protected dev integration and release-only main promotion with current-head approval evidence.
    issue_ids: [121]
    prerequisites:
      - Review transport and release ledger behavior from SEQ-003 are defined.
    risks:
      - Over-constrained rules can deadlock the single-operator path.
    depends_on: [SEQ-003]
  - id: SEQ-005
    outcome: Promote a genuinely new version from dev to main and verify npm, tag, GitHub release, and clean ref state.
    issue_ids: [120, 121, 126]
    prerequisites:
      - SEQ-001 through SEQ-004 accepted.
      - Exact artifact checks and authorized release approval pass.
    risks:
      - Version drift or a partial publication could leave main, npm, and release metadata inconsistent.
    depends_on: [SEQ-003, SEQ-004]
