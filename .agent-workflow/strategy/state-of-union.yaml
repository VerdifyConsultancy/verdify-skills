  - Verdify issue 135 truthful sprint terminalization
  - Agent Platform P0 security issues 2884, 2887, and 2906
  - Agent Platform four-pilot North Star issue 2890 and platform-readiness approval
  - Agent Platform durable execution substrate decision issue 2905
  - Gravity iteration-6 signoff, Gate B issue 184, citation parity issue 407, and canonical readiness
  - Orbit reframe issue 197, stale sprint issue 198, and trust issues 193 through 195
