$schema: https://json-schema.org/draft/2020-12/schema
$id: https://verdify.example/schemas/skill-pack.schema.yaml
title: Verdify Skill Pack
type: object
additionalProperties: false
required:
  - schema_ref
  - kind
  - schema_version
  - name
  - display_name
  - description
  - category
  - maturity
  - includes
  - provides
  - depends_on
  - conflicts
  - install
properties:
  schema_ref: {const: skill-pack.schema.yaml}
  kind: {const: VerdifySkillPack}
  schema_version: {const: "1.0"}
  name:
    type: string
    pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
    maxLength: 64
  display_name: {type: string, minLength: 1, maxLength: 120}
  description: {type: string, minLength: 1, maxLength: 512}
  category:
    type: string
    enum: [workflow, domain, utility, integration, governance]
  maturity:
    type: string
    enum: [experimental, beta, stable]
  includes:
    type: object
    additionalProperties: false
    required: [required, optional]
    properties:
      required:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
      optional:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
  provides:
    type: object
    additionalProperties: false
    required: [capabilities]
    properties:
      capabilities:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
  depends_on:
    type: object
    additionalProperties: false
    required: [packs, tools]
    properties:
      packs:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
      tools:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
  conflicts:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
  install:
    type: object
    additionalProperties: false
    required: [hosts, default_profile]
    properties:
      hosts:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum: [codex, claude]
      default_profile:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
